<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ROFL HUB · Пульт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #0b0f1a; --card: #141a2e; --card2: #1a2240; --neon: #00ffe1; --accent: #ffd93d; --text: #e8ecff;
          --muted: #8a93b8; --ok: #37e85f; --bad: #ff5555; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
         padding: 12px 12px 40px; min-height: 100vh; font-size: 14px; }
  .logo { text-align: center; font-weight: 900; font-size: 20px; letter-spacing: 3px; color: var(--neon);
          text-shadow: 0 0 18px rgba(0,255,225,.45); margin: 4px 0 12px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
  .tab { flex: 0 0 auto; padding: 9px 14px; border-radius: 999px; border: 1px solid rgba(0,255,225,.3);
         background: #0d1326; color: var(--text); font-weight: 700; cursor: pointer; }
  .tab.on { background: var(--neon); color: #001a17; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .card { background: linear-gradient(160deg, var(--card), var(--card2)); border: 1px solid rgba(0,255,225,.14);
          border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  h2 { font-size: 13px; letter-spacing: 1.5px; color: var(--neon); margin-bottom: 10px; text-transform: uppercase; }
  h3 { font-size: 13px; color: var(--accent); margin: 12px 0 6px; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(0,255,225,.25);
          background: #0d1326; color: var(--text); font-size: 14px; }
  textarea { min-height: 60px; resize: vertical; }
  .btn { display: block; width: 100%; padding: 12px; margin-top: 10px; border-radius: 12px; border: none; cursor: pointer;
         background: linear-gradient(90deg, var(--neon), #3df0ff); color: #001a17; font-weight: 900; font-size: 15px; }
  .btn.ghost { background: #0d1326; color: var(--text); border: 1px solid rgba(0,255,225,.3); font-weight: 700; }
  .btn.warn { background: #3a1520; color: #ffb3b3; border: 1px solid rgba(255,85,85,.4); }
  .btn:disabled { opacity: .45; cursor: wait; }
  .mini { padding: 6px 10px; border-radius: 9px; border: 1px solid rgba(0,255,225,.3); background: #0d1326; color: var(--text);
          font-weight: 700; cursor: pointer; font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 7px 11px; border-radius: 999px; border: 1px solid rgba(0,255,225,.25); background: #0d1326; color: var(--text);
          cursor: pointer; font-size: 13px; }
  .chip.on { background: rgba(0,255,225,.18); border-color: var(--neon); color: #fff; }
  .noms { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .nom { text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(0,255,225,.2); background: #0d1326;
         color: var(--text); cursor: pointer; font-size: 13px; }
  .nom.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .nom small { display: block; color: var(--muted); margin-top: 3px; }
  .mines { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
  .mn { position: relative; padding: 8px 4px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: #0d1326;
        color: var(--text); cursor: pointer; font-size: 13px; text-align: center; }
  .mn.free { border-color: rgba(0,255,225,.45); }
  .mn.busy { opacity: .35; cursor: not-allowed; }
  .mn.pick { border-color: var(--accent); background: rgba(255,217,61,.15); }
  .mn b { position: absolute; top: -7px; right: -5px; background: var(--accent); color: #1a1200; border-radius: 999px;
          font-size: 11px; padding: 1px 6px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed rgba(138,147,184,.15); }
  .row:last-child { border-bottom: none; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.4; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .place { border: 1px solid rgba(255,217,61,.25); border-radius: 12px; padding: 10px; margin-top: 8px; }
  .rw { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; margin-top: 6px;
        border-radius: 9px; background: rgba(0,255,225,.07); }
  .grid2 { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
  .grid3 { display: grid; gap: 8px; grid-template-columns: 1fr 1fr 1fr; }
  .status { font-size: 12px; font-weight: 700; }
  /* 🕵️ проверка на абуз */
  .ab { display: block; width: 100%; text-align: left; cursor: pointer; color: var(--text); border-left: 5px solid var(--muted); }
  .ab.red { border-left-color: #ff3b5c; box-shadow: 0 0 18px rgba(255,59,92,.18); } .ab.orange { border-left-color: #ff9a3c; }
  .ab.yellow { border-left-color: #ffd93d; } .ab.green { border-left-color: #37e85f; } .ab.cleared { opacity: .6; }
  .ab-head { display: flex; align-items: center; gap: 10px; }
  .ab-score { min-width: 54px; text-align: center; font-weight: 900; font-size: 20px; border-radius: 12px; padding: 6px 4px; background: #0d1326; }
  .ab-score small { display: block; font-size: 10px; font-weight: 400; color: var(--muted); }
  .red .ab-score, .ab-score.red { color: #ff6b81; } .orange .ab-score, .ab-score.orange { color: #ffb36b; }
  .yellow .ab-score, .ab-score.yellow { color: #ffe27a; } .green .ab-score, .ab-score.green { color: #6dff8f; }
  .ab-name { font-weight: 800; font-size: 15px; word-break: break-word; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .bdg { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(138,147,184,.15); color: var(--muted); }
  .bdg.bad { background: rgba(255,85,85,.18); color: #ffb3b3; } .bdg.ok { background: rgba(55,232,95,.15); color: #9dffb4; }
  .ab ul { margin: 8px 0 0 18px; color: #c9d0f0; font-size: 13px; line-height: 1.45; }
  .sig { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed rgba(138,147,184,.15); }
  .sig b { min-width: 42px; text-align: center; border-radius: 8px; padding: 3px 0; background: rgba(255,85,85,.15); color: #ffb3b3; }
  .uid { color: var(--neon); cursor: pointer; text-decoration: underline dotted; }
  .tbl { width: 100%; min-width: 460px; border-collapse: collapse; font-size: 12px; }
  .lnk { padding: 8px 0; border-bottom: 1px dashed rgba(138,147,184,.15); word-break: break-word; }
  .tbl th { text-align: left; color: var(--muted); font-weight: 600; padding: 5px 4px; border-bottom: 1px solid rgba(138,147,184,.25); }
  .tbl td { padding: 5px 4px; border-bottom: 1px dashed rgba(138,147,184,.12); vertical-align: top; word-break: break-word; }
  .tbl .p { color: var(--ok); } .tbl .m { color: var(--bad); }
  .scroll { overflow-x: auto; }
  .pg { display: flex; gap: 6px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .kv div { background: #0d1326; border-radius: 10px; padding: 8px 10px; } .kv small { display: block; color: var(--muted); font-size: 11px; }
  @media (min-width: 900px) { .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; align-items: start; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🎛 ПУЛЬТ ROFL HUB</div>
  <div class="tabs" id="tabs"></div>
  <div id="app"><div class="card">Загрузка…</div></div>
</div>
<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const initData = (tg && tg.initData) || "";
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => Number(n || 0).toLocaleString("ru-RU");
  const dt = iso => iso ? new Date(iso).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "UTC" }) + " UTC" : "—";
  async function api(path, opts) {
    const res = await fetch(path, Object.assign({ headers: { "X-Telegram-Init-Data": initData, "Content-Type": "application/json" } }, opts || {}));
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw body;
    return body;
  }
  const post = (path, data) => api(path, { method: "POST", body: JSON.stringify(data || {}) });
  function say(text) { if (tg && tg.showAlert) tg.showAlert(text); else alert(text); }
  async function act(btn, path, data, onOk) {
    if (btn) btn.disabled = true;
    try { const res = await post(path, data); await onOk(res); }
    catch (e) { say("❌ " + (e.message || e.error || "ошибка")); }
    finally { if (btn) btn.disabled = false; }
  }

  // ---------------- справочники для подписей
  const RES_ICON = { metal: "⛏", hydrogen: "💧", crystal: "💎", parts: "⚙️", stone: "🪨", wood: "🪵", fire: "🔥", energy: "⚡",
                     battery: "🔋", cow: "🐄", core: "☢️" };
  const ITEM_NAME = { nitrogen: "❄️ Азот", nuclear: "☢️ Ядерный Разгон", drone: "🛸 Мастер-дрон", shield: "🛡 Щит", unlimit: "♾ Безлимит",
    camo: "🎭 Маскировка", trap: "🪤 Приманка", drill: "🎯 Тренажёр стойки", thermos: "🧊 Термос", banner: "🏳️ Знамя", dome: "🛡 Купол",
    meds: "💊 Аптечка", forsage: "🔥 Форсаж", economizer: "⛽ Экономайзер", cargo: "📦 Трюм", stamp: "📜 Штамп" };
  const ONE_SHOT = ["forsage", "economizer", "cargo", "stamp"];
  const ROBOT_NAME = { junior: "🤖 Младший Майнер", premium: "⚡ Кибер-Бурильщик" };
  const BOOST_NAME = { nitrogen: "❄️ Азотное Охлаждение +40%", nuclear: "☢️ Ядерный Разгон x5", drone: "🛸 Мастер-дрон",
                       unlimit: "♾ Безлимит игр", shield: "🛡 Щит от налётов" };
  const DRONE_NAME = { guard: "🛡 Дрон-защитник", attack: "⚔️ Атакующий дрон", spy: "🛰 Дрон-шпион" };
  const SCOPES = { team: "🏆 Команды", clan: "👑 Кланы", teams: "🏆👑 Команды и кланы", solo: "👤 Личный" };
  const STATUS = { active: "🟢 идёт", finished: "🏁 итоги", cancelled: "⛔ отменена" };
  const UNIT = { h: 1, d: 24, y: 8760 };
  let meta = null, tab = "battles";

  function durLabel(h) { return !h ? "" : h % 8760 === 0 ? h / 8760 + " г." : h % 24 === 0 ? h / 24 + " дн." : h + " ч"; }
  function rewardLabel(r) {
    if (r.kind === "coins") return num(r.amount) + " 🪙";
    if (r.kind === "resource") return r.qty + " " + (RES_ICON[r.res] || r.res);
    if (r.kind === "cutlets") return r.qty + " 🥩";
    if (r.kind === "item") return ITEM_NAME[r.effect] + (r.hours ? " " + durLabel(r.hours) : "") + (r.qty > 1 ? " ×" + r.qty : "");
    if (r.kind === "robot") return ROBOT_NAME[r.robot] + " " + durLabel(r.hours) + (r.qty > 1 ? " ×" + r.qty : "");
    if (r.kind === "boost") return BOOST_NAME[r.boost] + " " + durLabel(r.hours);
    if (r.kind === "bdrone") return DRONE_NAME[r.drone] + (r.qty > 1 ? " ×" + r.qty : "");
    if (r.kind === "gear") return "🧥 Детали костюмов ×" + r.qty;
    if (r.kind === "artifact") return "💠 Артефакт ×" + r.qty;
    if (r.kind === "skin") { const sk = (meta.skins || []).find(x => x.id === r.skin); return "✨ " + (sk ? sk.name : r.skin); }
    return "🎁 " + r.text;
  }

  // ---------------- конструктор наград: любые одиночные награды и комбинации
  // Введённая, но не добавленная кнопкой «➕» награда раньше терялась (26.10: цель «Батарейки 10» ушла без приза).
  // Теперь каждый конструктор помнит «черновик», и при запуске flushRewards() дописывает его в награду.
  const BUILDERS = [];
  function flushRewards() {
    let added = 0;
    BUILDERS.forEach(b => { if (document.body.contains(b.host) && b.host._dirty) { const r = b.read(); if (r) { b.list.push(r); added++; } b.host._dirty = false; } });
    return added;
  }
  function rewardBuilder(host, list, onChange) {
    function draw(resetKind) {
      const kind = !resetKind && host.querySelector(".rk") ? host.querySelector(".rk").value : "coins";
      host.innerHTML =
        list.map((r, i) => '<div class="rw"><span>' + esc(rewardLabel(r)) + '</span><button class="mini" data-del="' + i + '">✕</button></div>').join("") +
        '<div class="grid2" style="margin-top:8px"><select class="rk">' +
        [["coins", "🪙 Монеты"], ["resource", "📦 Ресурс"], ["cutlets", "🥩 Котлеты"], ["item", "🧪 Изделие на склад"],
         ["robot", "🤖 Робот на срок"], ["boost", "⚡ Буст / Безлимит / Щит"], ["bdrone", "🤖 Боевой дрон (навсегда)"], ["gear", "🧥 Детали костюмов (случайные)"], ["artifact", "💠 Артефакт (случайный)"], ["skin", "✨ Скин (экземпляр с номером)"], ["text", "🎁 Ручной приз (текст)"]]
          .map(([k, t]) => '<option value="' + k + '"' + (k === kind ? " selected" : "") + '>' + t + '</option>').join("") +
        '</select><div class="rp"></div></div><button class="mini" style="margin-top:8px" data-add="1">➕ Добавить и выбрать ещё</button>';
      params();
      host._dirty = false;
      host.querySelector(".rk").onchange = () => { params(); host._dirty = true; };
      host.oninput = () => { host._dirty = true; };
      host.querySelectorAll("[data-del]").forEach(b => { b.onclick = () => { list.splice(Number(b.dataset.del), 1); draw(); onChange && onChange(); }; });
      host.querySelector("[data-add]").onclick = () => {
        const r = read();
        if (!r) { say("Заполни параметры награды"); return; }
        list.push(r); draw(true); onChange && onChange();
      };
    }
    const dur = () => '<div class="grid2"><input class="rh" type="number" min="1" value="1"><select class="ru"><option value="h">часов</option>' +
                      '<option value="d" selected>дней</option><option value="y">лет</option></select></div>';
    function params() {
      const k = host.querySelector(".rk").value, p = host.querySelector(".rp");
      const opts = (obj) => Object.entries(obj).map(([v, t]) => '<option value="' + v + '">' + t + '</option>').join("");
      p.innerHTML = {
        coins: '<input class="ra" type="number" min="1" placeholder="сколько монет">',
        resource: '<select class="rs">' + meta.resources.map(x => '<option value="' + x.key + '">' + (RES_ICON[x.key] || "") + ' ' + esc(x.name) + '</option>').join("") +
                  '</select><input class="ra" type="number" min="1" placeholder="количество" style="margin-top:6px">',
        cutlets: '<input class="ra" type="number" min="1" placeholder="сколько котлет">',
        item: '<select class="rs">' + opts(Object.fromEntries(meta.items.map(e => [e, ITEM_NAME[e] || e]))) + '</select>' + dur() +
              '<input class="rq" type="number" min="1" value="1" placeholder="штук" style="margin-top:6px">',
        robot: '<select class="rs">' + opts(ROBOT_NAME) + '</select>' + dur() + '<input class="rq" type="number" min="1" value="1" style="margin-top:6px">',
        boost: '<select class="rs">' + opts(BOOST_NAME) + '</select>' + dur(),
        bdrone: '<select class="rs">' + opts(DRONE_NAME) + '</select><input class="rq" type="number" min="1" value="1" style="margin-top:6px">',
        gear: '<input class="rq" type="number" min="1" max="5" value="1" placeholder="деталей (1–5)"><div class="hint">Костюм и слот — случайные; за сезон игроку не больше 5 деталей (лишнее не выдаётся).</div>',
        artifact: '<input class="rq" type="number" min="1" max="1" value="1"><div class="hint">Вид — случайный; за сезон игроку не больше 1 бесплатного артефакта.</div>',
        skin: '<select class="rs">' + (meta.skins || []).map(x => '<option value="' + x.id + '">' + esc(x.name + " · " + x.rarity + (x.edition ? " · тираж " + x.minted + "/" + x.edition : "")) + '</option>').join("") +
              '</select><div class="hint">Мифический — только так (аукцион, подарок, приз). Кончился тираж — не выдаётся.</div>',
        text: '<input class="rt" placeholder="например: особая награда внутри игры">',
      }[k];
    }
    function read() {
      const k = host.querySelector(".rk").value, q = c => host.querySelector(c);
      const hours = q(".rh") ? Number(q(".rh").value) * UNIT[q(".ru").value] : 0;
      if (k === "coins" || k === "cutlets") { const n = Number(q(".ra").value); return n > 0 ? (k === "coins" ? { kind: k, amount: n } : { kind: k, qty: n }) : null; }
      if (k === "resource") { const n = Number(q(".ra").value); return n > 0 ? { kind: k, res: q(".rs").value, qty: n } : null; }
      if (k === "item") { const e = q(".rs").value; const one = ONE_SHOT.includes(e); return (one || hours > 0) ? { kind: k, effect: e, hours: one ? 0 : hours, qty: Math.max(1, Number(q(".rq").value) || 1) } : null; }
      if (k === "robot") return hours > 0 ? { kind: k, robot: q(".rs").value, hours: hours, qty: Math.max(1, Number(q(".rq").value) || 1) } : null;
      if (k === "boost") return hours > 0 ? { kind: k, boost: q(".rs").value, hours: hours } : null;
      if (k === "bdrone") return { kind: k, drone: q(".rs").value, qty: Math.max(1, Number(q(".rq").value) || 1) };
      if (k === "gear") return { kind: k, qty: Math.min(5, Math.max(1, Number(q(".rq").value) || 1)) };
      if (k === "artifact") return { kind: k, qty: 1 };
      if (k === "skin") return { kind: k, skin: q(".rs").value };
      const t = q(".rt").value.trim(); return t ? { kind: "text", text: t } : null;
    }
    BUILDERS.push({ host, list, read });
    draw();
  }
  // ⏱ Окончание: точная дата/время (UTC) главнее часов + «итоги раньше, если наберётся N» (владелец 30.10)
  const FINISH_COUNTS = [10, 100, 1000, 10000];
  function endsBlock(p, st, what) {
    return '<label>Или точная дата и время итогов (UTC)</label><input id="' + p + 'Ends" type="datetime-local" value="' + esc(st.ends || "") + '">' +
      '<div class="hint">заполнено — главнее часов</div>' +
      '<label>Итоги раньше, если наберётся ' + what + '</label><div class="chips">' + [0].concat(FINISH_COUNTS).map(n =>
        '<button class="chip' + ((st.fc || 0) === n ? ' on' : '') + '" data-fc="' + p + ':' + n + '">' + (n ? num(n) : 'не надо') + '</button>').join("") + '</div>' +
      '<div class="hint">Итоги — по тому, что наступит раньше: время или число.</div>';
  }
  function bindEnds(host, p, st) {
    host.querySelectorAll('[data-fc^="' + p + ':"]').forEach(b => { b.onclick = () => {
      st.fc = Number(b.dataset.fc.split(":")[1]);
      host.querySelectorAll('[data-fc^="' + p + ':"]').forEach(x => x.classList.toggle("on", x === b)); }; });
    const i = $(p + "Ends");
    if (i) i.oninput = () => { st.ends = i.value; };
  }
  const endsBody = st => ({ ends_at: st.ends ? st.ends + ":00+00:00" : null, finish_count: st.fc || null });
  const endsNote = x => x.finish_count ? ' · ⏱ или при ' + num(x.finish_count) : '';

  // Итоговое подтверждение при запуске: весь список наград по местам (+ «за участие»), пустые места — с ⚠️
  function confirmPrizes(prizes, places, all) {
    const lines = Array.from({ length: places }, (_, i) => i + 1).map(p =>
      p + " место — " + (prizes[p] && prizes[p].length ? prizes[p].map(rewardLabel).join(" + ") : "⚠️ НЕТ НАГРАДЫ"));
    if (all && all.length) lines.push("🎒 за участие — " + all.map(rewardLabel).join(" + "));
    return confirm("Проверь награды:\n" + (lines.join("\n") || "без наград") + "\n\nЗапускаем?");
  }
  const prizeSummary = prizes => Object.entries(prizes).map(([p, l]) => p + " место — " + l.map(rewardLabel).join(" + ")).join("; ");

  // ---------------- 🏷 Название: заготовка «слово + слово + число» (переводится на 14 языков) или свой текст
  function titleBlock(id, st) {
    const T = meta.titles, noun = T.nouns.find(n => n.key === st.n), g = noun ? noun.g : "m";

    host.querySelectorAll("[data-mine]").forEach(b => {

  }
  function abCard(c) {
    return '<div class="card ab ' + c.level + (c.cleared ? ' cleared' : '') + '" data-uid="' + c.id + '"><div class="ab-head">' +
      '<div class="ab-score">' + c.score + '<small>баллов</small></div><div style="flex:1"><div class="ab-name">' + esc(c.name) + '</div>' +
      '<div class="badges"><span class="bdg">' + LVL[c.level] + '</span>' + (c.blocked ? '<span class="bdg bad">⛔ заблокирован</span>' : '') +
      (c.reviewed ? '<span class="bdg ok">✅ проверен (' + c.reviewed.score + ')</span>' : '') +
      (c.links ? '<span class="bdg">🔗 связей: ' + c.links + '</span>' : '') + '<span class="bdg">🗓 ' + c.age_days + ' дн.</span>' +
      '<span class="bdg">🧠 ' + c.quiz + '</span></div></div></div>' +
      (c.reasons.length ? '<ul>' + c.reasons.map(r => '<li>' + esc(r) + '</li>').join("") + (c.signals > 3 ? '<li class="hint">…и ещё ' + (c.signals - 3) + '</li>' : '') + '</ul>'
        : '<div class="hint">Подозрительного не найдено.</div>') + '</div>';
  }
  function bindUid(host) {
    host.querySelectorAll("[data-uid]").forEach(el => { el.onclick = e => {
      e.stopPropagation(); abUser = Number(el.dataset.uid); abCat = "why"; abCatPage = 0; go(); window.scrollTo(0, 0); }; });
  }
  const who = (d, id) => id ? '<span class="uid" data-uid="' + id + '">' + esc(d.names[String(id)] || "#" + id) + '</span>' : "—";
  function tbl(head, rows) {
    const per = 50, pages = Math.max(1, Math.ceil(rows.length / per)); abCatPage = Math.min(abCatPage, pages - 1);
    if (!rows.length) return '<div class="hint">За ' + abWindow + ' дней — пусто.</div>';
    return '<div class="scroll"><table class="tbl"><tr>' + head.map(h => '<th>' + h + '</th>').join("") + '</tr>' +
      rows.slice(abCatPage * per, abCatPage * per + per).map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join("") + '</tr>').join("") +
      '</table></div>' + (pages > 1 ? '<div class="pg">' + Array.from({ length: pages }, (_, i) => '<button class="chip' + (i === abCatPage ? ' on' : '') +
      '" data-acp="' + i + '">' + (i + 1) + '</button>').join("") + '</div>' : '');
  }
  const AB_CATS = [["why", "🚩 Почему"], ["links", "🔗 Связи"], ["coins", "🪙 Монеты"], ["res", "📦 Ресурсы"], ["gifts", "🤝 Подарки в команде"],
    ["transfers", "💸 Переводы"], ["market", "📈 Биржа и обмен"], ["raids", "⚔️ Налёты"], ["duels", "🥊 Дуэли"], ["games", "🕹 Игры"],
    ["exp", "🗺 Походы"], ["pay", "⭐ Покупки"], ["refs", "👥 Рефералы"], ["gear", "🧥 Вещи и награды"]];
  function abSection(d) {
    const res = k => (RES_ICON[k] || "") + " " + esc(k);
    switch (abCat) {
      case "why": return d.signals.length ? d.signals.map(s => '<div class="sig"><b>+' + s.points + '</b><div>' + esc(s.text) +
          (s.links.length ? '<div class="badges">' + s.links.slice(0, 12).map(id => who(d, id)).join(" ") + '</div>' : '') + '</div></div>').join("") +
          '<div class="hint">Баллы — сумма сигналов. 60+ — жёсткий случай, 30+ — подозрительно, 10+ — присмотреться.</div>'
        : '<div class="hint">Алгоритм не нашёл ничего подозрительного за ' + d.window_days + ' дней.</div>';
      case "links": return '<div class="hint">Все, с кем игрок обменивался ценностями. 🤝 — его реферал, ⬆️ — пригласивший, 🏆 — тиммейт.</div>' +
        (d.links.length ? d.links.map(l => '<div class="lnk"><div>' + who(d, l.id) + (l.blocked ? " ⛔" : "") + (l.referral ? " 🤝" : "") +
          (l.referrer ? " ⬆️" : "") + (l.same_team ? " 🏆" : "") + '</div><div class="badges">' + [
            [l.res_in, "📦 получил(а) " + num(l.res_in)], [l.res_out, "📦 отдал(а) " + num(l.res_out)],
            [l.coins_in, "🪙 получил(а) " + num(l.coins_in)], [l.coins_out, "🪙 отдал(а) " + num(l.coins_out)],
            [l.trades, "📈 сделок " + l.trades], [l.swaps, "🔁 обменов " + l.swaps],
            [l.duels, "🥊 дуэлей " + l.duels + ", его побед " + l.duel_wins],
            [l.raids_won, "⚔️ ограбил(а) " + l.raids_won], [l.raids_lost, "🛡 ограблен(а) " + l.raids_lost]]
            .filter(x => x[0]).map(x => '<span class="bdg">' + x[1] + '</span>').join("") + '</div></div>').join("")
          : '<div class="hint">Ни с кем не обменивался(ась) ценностями.</div>');
      case "coins": return '<h3>Итого по источникам</h3>' + tbl(["Источник", "Сумма", "Операций"], d.coin_sum.map(r => [esc(reasonLabel(r.reason)), sgn(r.total), r.n])) +
        '<h3>Журнал</h3>' + tbl(["Когда", "🪙", "За что", "Ссылка"], d.coins.map(r => [dt(r.created_at), sgn(r.delta), esc(reasonLabel(r.reason)), esc(r.ref || "")]));
      case "res": return '<h3>Итого по ресурсам и источникам</h3>' + tbl(["Ресурс", "Источник", "Сумма", "Операций"],
          d.res_sum.map(r => [res(r.kind), esc(reasonLabel(r.reason)), sgn(r.total), r.n])) +
        '<h3>Журнал</h3>' + tbl(["Когда", "Ресурс", "Кол-во", "За что", "Ссылка"], d.resources.map(r => [dt(r.created_at), res(r.kind), sgn(r.delta), esc(reasonLabel(r.reason)), esc(r.ref || "")]));
      case "gifts": return tbl(["Когда", "Куда", "Ресурс", "Кол-во", "Кто"], d.gifts.map(r => [dt(r.created_at), r.dir === "in" ? "⬅️ получил(а)" : "➡️ отдал(а)",
          res(r.kind), num(r.qty), who(d, r.cp)]));
      case "transfers": return tbl(["Когда", "Куда", "🪙", "Кто"], d.transfers.map(r => [dt(r.created_at), r.reason === "transfer_in" ? "⬅️ получил(а)" : "➡️ отправил(а)",
          sgn(r.delta), /^\d+$/.test(r.ref || "") ? who(d, Number(r.ref)) : esc(r.ref || "")]));
      case "market": return '<h3>Сделки</h3>' + tbl(["Когда", "Роль", "Товар", "Кол-во", "Цена", "Сумма", "С кем"], d.market.map(r => {
          const buy = r.buyer_id === d.id; return [dt(r.created_at), buy ? "🛒 купил(а)" : "🏷 продал(а)", esc(r.asset), r.qty, num(r.price), num(r.qty * r.price),
            who(d, buy ? r.seller_id : r.buyer_id)]; })) +
        '<h3>Обмены ресурсами</h3>' + tbl(["Когда", "Отдаёт", "Хочет", "Статус", "Автор", "Принял"], d.swaps.map(r => [dt(r.created_at), r.give_qty + " " + res(r.give_kind),
          r.want_qty + " " + res(r.want_kind), esc(r.status), who(d, r.maker_id), who(d, r.taker_id)]));
      case "raids": return tbl(["Когда", "Роль", "Соперник", "Итог", "Трофей", ""], d.raids.map(r => {
          const att = r.attacker_id === d.id; return [dt(r.created_at), att ? "⚔️ напал(а)" : "🛡 цель", who(d, att ? r.defender_id : r.attacker_id),
            r.result === "win" ? (att ? "✅ победа" : "❌ ограбили") : r.result === "lose" ? (att ? "❌ провал" : "✅ отбился(ась)") : "🤝 ничья",
            esc(r.loot === "{}" ? "" : r.loot), r.is_revenge ? "реванш" : ""]; }));
      case "duels": return tbl(["Когда", "Стол", "Соперник", "Итог", "Статус"], d.duels.map(r => {
          const cp = r.player1 === d.id ? r.player2 : r.player1; return [dt(r.created_at), num(r.stake) + " 🪙", who(d, cp),
            !r.winner_id ? "—" : r.winner_id === d.id ? "✅ победа" : "❌ поражение", esc(r.status)]; }));
      case "games": return '<h3>Победы по дням</h3>' + tbl(["День", "Игра", "Побед", "🪙"], d.games.map(r => [esc(r.day), esc(r.game), r.wins, num(r.coins)])) +
        '<h3>Раунды в приложении</h3>' + tbl(["День", "Игра", "Раундов"], d.rounds.map(r => [esc(r.day), esc(r.game), r.n])) +
        '<h3>Сколько разных часов в сутки активен(а)</h3><div class="hint">18+ часов в сутки — похоже на бота или общий аккаунт.</div>' +
        tbl(["День", "Часов"], d.hours.map(r => [esc(r.day), r.hours >= 18 ? '<b class="bad">' + r.hours + '</b>' : r.hours]));
      case "exp": return tbl(["Когда", "Цель", "Формат", "Статус", "Груз", "Вышел", "Прибытие"], d.expeditions.map(r => [dt(r.created_at), esc(r.title || "—"),
          esc(r.mode), esc(r.status), r.cargo, dt(r.departed_at), dt(r.arrive_at)]));
      case "pay": return tbl(["Когда", "Товар", "★", "Возврат"], d.payments.map(r => [dt(r.created_at), esc(r.item_payload), r.stars_amount,
          r.refunded_at ? '<span class="bad">' + dt(r.refunded_at) + '</span>' : ""])) + '<div class="hint">Покупки — за всё время.</div>';
      case "refs": return '<div class="hint">🔻 — пропал(а) сразу после квалификации, 🍼 — отдаёт ресурсы/монеты пригласившему.</div>' +
        tbl(["Друг", "Пришёл", "Активен с", "Последний вход", "🧠", ""], d.referrals.map(r => [who(d, r.id) + (r.blocked ? " ⛔" : ""), dt(r.created_at),
          dt(r.qualified_at), dt(r.last_seen_at), r.quiz, (r.abandoned ? "🔻" : "") + (r.feeds ? "🍼" : "")]));
      case "gear": return '<h3>Детали и артефакты</h3>' + tbl(["Когда", "Вещь", "Ур.", "Кол-во", "Откуда"], d.gear.map(r => [dt(r.created_at),
          esc(r.suit + " / " + r.slot), r.level, sgn(r.delta), esc(reasonLabel(r.reason)) + (r.ref ? " · " + esc(r.ref) : "")])) +
        '<h3>Награды битв, походов и подарков</h3>' + tbl(["Когда", "Ключ", "Что"], d.grants.map(r => [dt(r.created_at), esc(r.ref), esc(r.payload)]));
    }
    return "";
  }
  async function viewAbuseUser(app) {
    const d = await api("/api/admin/abuse/user?id=" + abUser);
    abWindow = d.window_days;
    const P = d.profile;
    d.names[String(d.id)] = d.name;
    app.innerHTML = '<button class="mini" id="abBack">⬅️ К ленте</button>' +
      '<div class="card" style="margin-top:10px"><div class="ab-head"><div class="ab-score ' + d.level + '">' + d.score + '<small>баллов</small></div>' +
      '<div style="flex:1"><div class="ab-name">' + esc(d.name) + '</div><div class="badges"><span class="bdg">' + LVL[d.level] + '</span>' +
      (P.blocked ? '<span class="bdg bad">⛔ заблокирован</span>' : '') + (P.thin ? '<span class="bdg">🐣 молодой/слабый аккаунт</span>' : '') +
      (d.reviewed ? '<span class="bdg ok">✅ проверен ' + dt(d.reviewed.at) + ' (' + d.reviewed.score + ')' + (d.reviewed.note ? ': ' + esc(d.reviewed.note) : '') + '</span>' : '') +
      '</div></div></div><div class="kv" style="margin-top:10px">' +
      [["Аккаунт создан", dt(P.created_at)], ["Последний вход", dt(P.last_seen_at)], ["Баланс", num(P.balance) + " 🪙"], ["Интеллект", "🧠 " + P.quiz],
       ["Ежедневных котлет", P.bonus_claims], ["Активный с", dt(P.qualified_at)], ["Команда", esc(P.team || "—")],
       ["Пригласил(а)", P.referrer_id ? who(d, P.referrer_id) : "—"]].map(([k, v]) => '<div><small>' + k + '</small>' + v + '</div>').join("") + '</div>' +
      '<div class="grid2"><button class="btn ghost" id="abOk">✅ Проверен — опустить в ленте</button>' +
      '<button class="btn warn" id="abBlock">' + (P.blocked ? "↩️ Разблокировать" : "⛔ Заблокировать") + '</button></div></div>' +
      '<div class="chips" style="margin-bottom:12px">' + AB_CATS.map(([k, t]) => '<button class="chip' + (abCat === k ? ' on' : '') + '" data-abc="' + k + '">' + t + '</button>').join("") + '</div>' +
      '<div class="card"><h2>' + AB_CATS.find(c => c[0] === abCat)[1] + ' · ' + d.window_days + ' дней</h2>' + abSection(d) + '</div>';
    $("abBack").onclick = () => { abUser = null; go(); };
    app.querySelectorAll("[data-abc]").forEach(b => { b.onclick = () => { abCat = b.dataset.abc; abCatPage = 0; viewAbuseUser(app); }; });
    app.querySelectorAll("[data-acp]").forEach(b => { b.onclick = () => { abCatPage = Number(b.dataset.acp); viewAbuseUser(app); }; });
    $("abOk").onclick = () => {
      const note = prompt("Заметка к проверке (необязательно):", d.reviewed ? d.reviewed.note : "") ;
      if (note === null) return;
      act($("abOk"), "/api/admin/abuse/review", { id: d.id, note: note }, () => { abData = null; say("✅ Отмечен как проверенный"); viewAbuseUser(app); });
    };
    $("abBlock").onclick = () => {
      if (!confirm(P.blocked ? "Разблокировать игрока?" : "Заблокировать игрока? Бот перестанет ему отвечать, приложение закроется.")) return;
      act($("abBlock"), "/api/admin/abuse/block", { id: d.id, blocked: !P.blocked }, () => { abData = null; viewAbuseUser(app); });
    };
    bindUid(app);
  }

  const TABS = { battles: ["⚔️ Битвы и акции", viewBattles], exp: ["🗺 Экспедиции", viewExp], gift: ["🎁 Подарки", viewGift],
                 quests: ["🗺 Квесты", viewQuests], vip: ["🔨 Аукционы", viewVip], abuse: ["🕵️ Проверка", viewAbuse],
                 flags: ["🎛 Тумблеры", viewFlags] };
  async function go() {
    $("tabs").innerHTML = Object.entries(TABS).map(([k, [t]]) => '<button class="tab' + (tab === k ? ' on' : '') + '" data-tab="' + k + '">' + t + '</button>').join("");
    $("tabs").querySelectorAll("[data-tab]").forEach(b => { b.onclick = () => { tab = b.dataset.tab; go(); }; });
    const app = $("app");
    try { meta = meta || await api("/api/admin/meta"); await TABS[tab][1](app); }
    catch (e) { app.innerHTML = '<div class="card bad">' + (e.error === "forbidden" ? "⛔ Пульт только для владельца." : "Ошибка: " + esc(e.message || e.error || e)) + '</div>'; }
  }
  go();
})();
</script>
</body>
</html>
