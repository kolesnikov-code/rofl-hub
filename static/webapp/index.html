<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ROFL HUB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b0f1a;
    --card: #141a2e;
    --card2: #1a2240;
    --neon: #00ffe1;
    --accent: #ffd93d;
    --pink: #ff4d8d;
    --text: #e8ecff;
    --muted: #8a93b8;
    --ok: #37e85f;
    --bad: #ff5555;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    padding: 12px 12px 28px;
    min-height: 100vh;
  }
  .logo {
    text-align: center; font-weight: 900; font-size: 22px; letter-spacing: 3px;
    margin: 6px 0 2px; color: var(--neon);
    text-shadow: 0 0 18px rgba(0, 255, 225, .45);
  }
  .sub { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .card {
    background: linear-gradient(160deg, var(--card), var(--card2));
    border: 1px solid rgba(0, 255, 225, .14);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
  }
  .card h2 { font-size: 13px; letter-spacing: 1.5px; color: var(--neon); margin-bottom: 10px; }
  .balance { font-size: 34px; font-weight: 900; color: var(--accent); line-height: 1.1; }
  .balance small { font-size: 14px; color: var(--muted); font-weight: 500; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 14px; }
  .row { gap: 10px; }
  .row .k { color: var(--muted); white-space: nowrap; flex: 0 0 auto; }   /* подпись с эмодзи — всегда одной строкой */
  .row .v { font-weight: 700; min-width: 0; text-align: right; overflow-wrap: anywhere; }          /* переносится значение, а не подпись */
  .row .k:only-child { white-space: normal; flex: 1 1 auto; }              /* строка без значения — текст переносится */
  .vip {
    display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px;
    background: rgba(255, 77, 141, .15); border: 1px solid var(--pink);
    color: var(--pink); font-size: 12px; font-weight: 800; letter-spacing: 1px;
  }
  .bar { height: 10px; background: #0d1326; border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
  .bar i {
    display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--neon), var(--accent));
    transition: width .6s ease;
  }
  .hint { color: var(--muted); font-size: 12px; }
  /* 🕹 Игры (26.10): плитки 2×5 — все игры на одном экране телефона */
  .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .game-tile { text-align: left; border: 1px solid rgba(0,255,225,.22); border-radius: 14px; padding: 11px 12px;
    background: linear-gradient(160deg, #18213d, #10162b); color: var(--text); cursor: pointer; min-height: 78px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 6px; font: inherit; }
  .game-tile .gt-name { font-weight: 800; font-size: 14px; line-height: 1.2; }
  .game-tile .gt-meta { font-size: 11px; color: var(--muted); }
  .game-tile.limit { opacity: .55; }
  .game-tile.soon { opacity: .4; cursor: default; border-style: dashed; }
  .game-tile:active:not(.soon) { transform: scale(.98); }
  .g-big { font-size: 46px; font-weight: 900; text-align: center; color: var(--accent); margin: 8px 0; }
  .g-moves { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .g-moves.four { grid-template-columns: repeat(4, 1fr); }
  .g-moves .btn { margin-top: 0; padding: 14px 4px; font-size: 15px; }
  .g-result { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #0d1326; font-size: 14px; line-height: 1.5; }
  .g-result.win { border: 1px solid rgba(55,232,95,.5); } .g-result.lose { border: 1px solid rgba(255,85,85,.45); }
  .quiz-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .quiz-q { font-size: 17px; font-weight: 800; line-height: 1.35; margin: 12px 0 4px; }
  .quiz-opt { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid rgba(0,255,225,.3); background: #0d1326; color: var(--text); font: inherit; font-size: 15px; cursor: pointer; }
  .quiz-opt.right, .btn.fx-win { border-color: var(--ok); background: rgba(55,232,95,.22); color: #eafff0;
    box-shadow: 0 0 0 1px var(--ok) inset, 0 0 22px rgba(55,232,95,.55); animation: fxGlow 1.2s ease-in-out infinite alternate; }
  .quiz-opt.wrong, .btn.fx-lose { border-color: var(--bad); background: rgba(255,85,85,.2); color: #ffd9d9;
    box-shadow: 0 0 0 1px var(--bad) inset; animation: fxShake .45s ease-in-out 1; }
  /* верный ответ, когда ты ошибся: «депрессивная» подсветка — приглушённый зелёный, пунктир, медленное угасание */
  .quiz-opt.sad, .btn.fx-sad { border: 1px dashed rgba(55,232,95,.65); background: rgba(55,232,95,.08); color: #9fbfa8;
    filter: saturate(.55); animation: fxSad 2.4s ease-in-out infinite; }
  .quiz-opt, .btn { position: relative; overflow: visible; }
  .spark { position: absolute; width: 5px; height: 5px; border-radius: 1px; pointer-events: none; z-index: 5; }
  .spark.up { background: #ffd93d; box-shadow: 0 0 6px #ff9a3d, 0 0 12px #ffd93d; animation: fxUp 1.1s ease-out forwards; }
  .spark.down { background: #ff5555; box-shadow: 0 0 6px #ff2a2a; animation: fxDown 1.9s ease-in forwards; }
  @keyframes fxUp { 0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), -70px) scale(.3); } }
  @keyframes fxDown { 0% { opacity: .95; transform: translate(0, 0); }
    100% { opacity: 0; transform: translate(var(--dx), 60px) rotate(120deg); } }
  @keyframes fxGlow { from { box-shadow: 0 0 0 1px var(--ok) inset, 0 0 10px rgba(55,232,95,.35); }
    to { box-shadow: 0 0 0 1px var(--ok) inset, 0 0 26px rgba(55,232,95,.75); } }
  @keyframes fxShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes fxSad { 0%, 100% { opacity: .9; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .spark { display: none; } .quiz-opt, .btn { animation: none !important; } }
  .game-tile.limit .gt-meta { color: var(--accent); }
  .quiz-opt.gone { opacity: .25; }
  .game-tile.wide { grid-column: 1 / -1; }
  .dl-search { text-align: center; font-size: 40px; margin: 14px 0 4px; animation: dlPulse 1.4s ease-in-out infinite; }
  @keyframes dlPulse { 0%, 100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.15); opacity: 1; } }
  .dl-vs { text-align: center; font-size: 15px; margin: 10px 0; }
  .btn.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  @media (prefers-reduced-motion: reduce) { .dl-search { animation: none; } }
  .qs-text { font-size: 15px; line-height: 1.5; margin: 10px 0 4px; animation: qsIn .35s ease-out; }
  @keyframes qsIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .qs-card { border: 1px solid rgba(0,255,225,.18); border-radius: 14px; padding: 12px; margin-top: 10px; }
  .qs-card h3 { margin: 0 0 4px; font-size: 15px; }
  .qs-status { font-size: 12px; color: var(--muted); float: right; }
  @media (prefers-reduced-motion: reduce) { .qs-text { animation: none; } }
  .g-reset { display: block; height: 3px; margin-top: 8px; border-radius: 99px; background: var(--accent);
    animation: gReset 3s linear forwards; }
  @keyframes gReset { from { width: 100%; } to { width: 0; } }
  .btn.short { background: #0d1326; color: var(--muted); border: 1px dashed rgba(255,255,255,.18); box-shadow: none; }
  .g-flag { display: block; margin: 12px auto 4px; height: 96px; max-width: 100%; border-radius: 8px; box-shadow: 0 0 0 1px rgba(255,255,255,.15); }
  .g-flag-emoji { font-size: 72px; text-align: center; line-height: 1.1; margin: 8px 0 0; }
  .math-q { font-size: 34px; font-weight: 900; text-align: center; color: var(--accent); margin: 14px 0 6px; letter-spacing: 1px; }
  .code-slots { display: flex; justify-content: center; gap: 8px; margin: 12px 0 4px; }
  .code-slots span { width: 46px; height: 54px; border-radius: 12px; border: 1px solid rgba(0,255,225,.35); display: flex;
    align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: var(--accent); background: #0d1326; }
  .code-slots.win span { border-color: var(--ok); color: var(--ok); }
  .code-slots.sad span { border-style: dashed; color: #9fbfa8; }
  .code-pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .code-pad .btn { margin-top: 0; padding: 12px 0; font-size: 17px; }
  .code-log { margin-top: 10px; font-size: 14px; }
  .code-log div { display: flex; justify-content: space-between; padding: 5px 2px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .code-log b { letter-spacing: 4px; }
  .mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .mem-card { aspect-ratio: 1 / 1; border-radius: 12px; border: 1px solid rgba(0,255,225,.3); background: linear-gradient(135deg, #10203a, #0b1124);
    font-size: 30px; display: flex; align-items: center; justify-content: center; color: transparent; transition: transform .25s, background .25s; }
  .mem-card::before { content: "?"; color: rgba(0,255,225,.35); font-size: 22px; font-weight: 900; }
  .mem-card.open { background: #13284a; color: inherit; transform: rotateY(180deg) scaleX(-1); }
  .mem-card.open::before, .mem-card.done::before { content: none; }
  .mem-card.done { background: rgba(55,232,95,.16); border-color: var(--ok); color: inherit; }
  .mem-card.miss { border-color: var(--bad); }
  .quiz-opt:disabled { cursor: default; }
  .tbar { height: 6px; background: #0d1326; border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .tbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), var(--accent), var(--bad)); transition: width 1s linear; }
  .btn + .hint { margin-top: 10px; }   /* подписи под кнопкой не прилипают к ней */
  .btn {
    width: 100%; margin-top: 10px; padding: 13px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 800; letter-spacing: .5px; cursor: pointer;
    background: linear-gradient(90deg, var(--neon), #00b3ff); color: #04121c;
    box-shadow: 0 0 18px rgba(0, 255, 225, .35);
  }
  .btn:disabled { background: #2a3354; color: var(--muted); box-shadow: none; }
  .cta {
    border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 13px;
    font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .cta.red { background: rgba(255,85,85,.12); border: 1px solid rgba(255,85,85,.55); color: #ff8e8e; }
  .cta.yellow { background: rgba(255,217,61,.1); border: 1px solid rgba(255,217,61,.45); color: var(--accent); }
  .cta button {
    padding: 8px 12px; border: none; border-radius: 10px; background: var(--neon);
    color: #04121c; font-weight: 800; cursor: pointer; white-space: nowrap; font-size: 13px;
  }
  .shop-sub { color: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: 1.5px; margin-top: 12px; }
  .shop-item {
    width: 100%; margin-top: 8px; padding: 12px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(0,255,225,.28); background: #0d1326; color: var(--text);
    font-size: 14px; font-weight: 700; text-align: center;
  }
  .shop-item:disabled { opacity: .45; cursor: wait; }
  .status-ok { color: var(--ok); } .status-bad { color: var(--bad); }
  .top-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; border-bottom: 1px dashed rgba(138,147,184,.18); }
  .top-row:last-child { border-bottom: none; }
  .top-row .place { width: 28px; font-weight: 900; color: var(--accent); }
  .top-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-row .brain { color: var(--neon); font-weight: 700; }
  .rank { font-size: 11px; font-weight: 700; color: var(--accent); opacity: .85; }
  .top-row .bal { font-weight: 800; }
  .loading { text-align: center; color: var(--muted); padding: 50px 0; font-size: 15px; }
  .hidden { display: none !important; }
  .made-by { margin-top: 6px; }
  .made-by a { color: var(--neon); text-decoration: none; font-weight: 700; }
  .scene-btn { background: linear-gradient(90deg, var(--accent), #ff9d3d); color: #1a1200; box-shadow: 0 0 18px rgba(255,217,61,.35); }
  .scene-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .scene-head h2 { font-size: 14px; letter-spacing: 1.5px; color: var(--neon); }
  .back { padding: 8px 12px; border: 1px solid rgba(0,255,225,.35); border-radius: 10px; background: #0d1326; color: var(--text); font-weight: 700; cursor: pointer; }
  .mine-scene { position: relative; height: 340px; border-radius: 16px; overflow: hidden; margin-bottom: 12px;
    background: linear-gradient(180deg, #070a16 0%, #0e1430 55%, #2b1b12 56%, #1a1009 100%);
    border: 1px solid rgba(0,255,225,.14); box-shadow: 0 4px 24px rgba(0,0,0,.4); }
  .sky i { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; opacity: .7; animation: twinkle 2.8s infinite; }
  @keyframes twinkle { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
  .moon { position: absolute; right: 24px; top: 22px; width: 42px; height: 42px; border-radius: 50%; background: #ffe9a3; box-shadow: 0 0 30px rgba(255,233,163,.55); }
  .hill { position: absolute; left: -10%; right: -10%; top: 46%; height: 60px; background: #1d1326; border-radius: 50% 50% 0 0; }
  .arch { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); width: 96px; height: 70px;
    background: #090612; border: 4px solid #6b4a2a; border-bottom: none; border-radius: 48px 48px 0 0; display: flex; align-items: flex-end; justify-content: center; font-size: 22px; padding-bottom: 6px; }
  .rails { position: absolute; left: 0; right: 0; top: 56%; height: 6px; background: repeating-linear-gradient(90deg, #8a93b8 0 14px, transparent 14px 26px); opacity: .5; }
  .units { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 10px; padding: 0 10px; flex-wrap: wrap; }
  .unit { width: 96px; text-align: center; background: rgba(13,19,38,.78); border: 1px solid rgba(0,255,225,.22); border-radius: 12px; padding: 6px 4px 6px; backdrop-filter: blur(2px); }
  .unit img { width: 64px; height: 64px; display: block; margin: 0 auto; animation: bob 2.2s ease-in-out infinite; }
  .unit.junior img { animation-duration: 1.9s; }
  .unit.premium img { animation: drill .22s linear infinite; }
  .unit.premium.idle img { animation: none; filter: grayscale(.8) brightness(.7); }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  @keyframes drill { 0% { transform: translate(0,0) } 25% { transform: translate(1px,-1px) } 50% { transform: translate(-1px,1px) } 75% { transform: translate(1px,1px) } 100% { transform: translate(0,0) } }
  .unit .cnt { font-weight: 900; color: var(--accent); font-size: 15px; }
  .unit .unm { font-size: 11px; color: var(--text); font-weight: 700; margin-top: 2px; }
  .unit .ust { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 13px; padding: 20px 30px; }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .coin { position: absolute; bottom: 120px; font-size: 18px; animation: rise 1.8s ease-out forwards; }
  @keyframes rise { 0% { transform: translateY(0) scale(.8); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(-150px) scale(1.15); opacity: 0 } }
  .mined { color: var(--ok); font-variant-numeric: tabular-nums; }
  .bar.fridge i { background: linear-gradient(90deg, #ff9d3d, var(--pink)); }
  .err { text-align: center; color: var(--bad); padding: 40px 10px; font-size: 15px; }
  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 10px; }

  /* ---------- вкладки (23.10): приложение вместо простыней в чате ---------- */
  .tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 10px;
    margin: 0 -12px 8px; padding-left: 12px; padding-right: 12px; background: linear-gradient(180deg, var(--bg) 80%, rgba(11,15,26,0));
    scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(0,255,225,.25);
    background: #0d1326; color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .tab.on { background: linear-gradient(90deg, var(--neon), #00b3ff); color: #04121c; border-color: transparent;
    box-shadow: 0 0 14px rgba(0,255,225,.35); }
  .balance.small { font-size: 20px; margin: 4px 0; }
  .btn.ghost { background: #0d1326; color: var(--text); border: 1px solid rgba(0,255,225,.35); box-shadow: none; }
  .btn.danger { background: linear-gradient(90deg, #ff4d8d, #ff8e3d); color: #1a0008; box-shadow: none; font-size: 14px; }
  .two { display: flex; gap: 8px; } .two .btn { flex: 1; font-size: 13px; padding: 11px 6px; }
  .mini { margin-top: 6px; padding: 7px 12px; border: none; border-radius: 10px; font-weight: 800; font-size: 12px;
    cursor: pointer; background: linear-gradient(90deg, var(--neon), #00b3ff); color: #04121c; }
  .mini.ghost { background: #0d1326; color: var(--neon); border: 1px solid rgba(0,255,225,.35); }
  .mini:disabled { background: #2a3354; color: var(--muted); cursor: default; }
  .robot { display: flex; align-items: center; gap: 12px; padding: 10px; margin-bottom: 8px; border-radius: 14px;
    background: rgba(13,19,38,.7); border: 1px solid rgba(0,255,225,.18); }
  .robot img { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; flex: 0 0 auto;
    box-shadow: 0 0 16px rgba(0,255,225,.25); }
  .robot.premium img { box-shadow: 0 0 18px rgba(255,157,61,.45); }
  .robot.junior img { box-shadow: 0 0 18px rgba(0,179,255,.4); }
  .robot .rinfo { flex: 1; min-width: 0; }
  .robot .rname { font-weight: 800; font-size: 15px; }
  .robot .rrate { color: var(--accent); font-weight: 700; font-size: 13px; margin-top: 2px; }
  .robot .rstat { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .robot .rcount { font-size: 28px; font-weight: 900; color: var(--accent); min-width: 54px; text-align: right; }
  .robot.zero .rcount { color: var(--muted); }
  .res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 6px; }
  .res { text-align: center; padding: 10px 4px; border-radius: 12px; background: rgba(13,19,38,.7); border: 1px solid rgba(0,255,225,.15); }
  .res .ri { font-size: 22px; } .res .rn { font-weight: 900; font-size: 17px; color: var(--accent); }
  .res .rs { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .chips.big .chip { font-size: 14px; padding: 6px 10px; }
  /* 🗺 Карта мира (28.10) */
  .world-wrap { margin: 8px 0; border-radius: 14px; overflow: hidden; border: 1px solid rgba(0,229,255,.25); }
  .world { display: block; width: 100%; aspect-ratio: 16 / 10; }
  .world .wgrid { stroke: rgba(0,229,255,.06); stroke-width: .25; }
  .world .wland { fill: rgba(60,120,140,.18); stroke: rgba(0,229,255,.15); stroke-width: .3; }
  .world .wpath { stroke: rgba(255,255,255,.18); stroke-width: .35; stroke-dasharray: 1.2 1.2; }
  .world .wpath.mine { stroke: var(--accent); stroke-width: .5; }
  .world .whome { font-size: 4px; text-anchor: middle; dominant-baseline: middle; }
  .world .wtgt { cursor: pointer; }
  .world .wglow { fill: rgba(0,229,255,.18); animation: wpulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .world .wtgt.on .wglow { fill: rgba(255,217,61,.35); }
  .world .wcore { fill: #0b1a2e; stroke: var(--neon); stroke-width: .5; }
  .world .wicon { font-size: 3.6px; text-anchor: middle; dominant-baseline: middle; }
  .world .wlabel { font-size: 2.6px; fill: #e8ecff; text-anchor: middle; font-weight: 700; paint-order: stroke; stroke: #070b16; stroke-width: .6px; }
  .world .wtime { font-size: 2.3px; fill: var(--accent); text-anchor: middle; paint-order: stroke; stroke: #070b16; stroke-width: .5px; }
  .world .wsq circle { fill: #9fb3d9; stroke: #070b16; stroke-width: .3; }

  // I18N_EXTRA_END

  const fmt = (s, o) => String(s || "").replace(/\{(\w+)\}/g, (_, k) => (o[k] !== undefined ? o[k] : ""));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function api(path, opts) {
    const res = await fetch(path, Object.assign({
      headers: { "X-Telegram-Init-Data": initData, "Content-Type": "application/json" }
    }, opts || {}));
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw { status: res.status, body: body };
    return body;
  }
  const post = (path, data) => api(path, { method: "POST", body: JSON.stringify(data || {}) });

  function notify(text, ok) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(ok === false ? "error" : "success");
    if (tg && tg.showAlert) tg.showAlert(text); else alert(text);
  }
  function apiError(e) {
    if (e && e.body && e.body.message) return notify(e.body.message, false);
    notify(L.error, false);
  }
  // Действие с сервером: блокируем кнопку, показываем итог, перерисовываем вкладку
  async function act(btn, path, data, onOk) {
    if (btn) btn.disabled = true;
    try {
      const res = await post(path, data);
      if (res.ok === false) { notify(res.message || L.error, false); if (btn) btn.disabled = false; return; }
      await onOk(res);
    } catch (e) { apiError(e); if (btn) btn.disabled = false; }
  }

  function card(title, inner, id) {
    return '<div class="card"' + (id ? ' id="' + id + '"' : '') + '><h2>' + title + '</h2>' + inner + '</div>';
  }
  const row = (k, v, cls) => '<div class="row"><span class="k">' + k + '</span><span class="v ' + (cls || "") + '">' + v + '</span></div>';

  // ================= Постраничный список: «‹ 1 2 3 … 45 46 ›» =================
  // Сотни лотов не растягивают плашку: на странице per штук, номер страницы переживает
  // обновление вкладки. bind(el) — перепривязать кнопки строк после смены страницы.
  const PAGERS = {};
  function pager(id, items, per, emptyHtml, bind) {
    const prev = PAGERS[id], pages = Math.max(1, Math.ceil(items.length / per));
    PAGERS[id] = { items: items, per: per, empty: emptyHtml || "", bind: bind,
                   page: Math.min(prev ? prev.page : 0, pages - 1) };
    return '<div class="pager" id="pg-' + id + '">' + pagerBody(id) + '</div>';
  }
  function pagerBody(id) {
    const p = PAGERS[id];
    if (!p.items.length) return p.empty;
    const pages = Math.ceil(p.items.length / p.per);
    const list = '<div class="pg-list">' + p.items.slice(p.page * p.per, (p.page + 1) * p.per).join("") + '</div>';
    if (pages <= 1) return list;
    const show = [];
    for (let i = 0; i < pages; i++) if (i < 2 || i >= pages - 2 || Math.abs(i - p.page) <= 1) show.push(i);
    let nav = '<button class="pg-btn" data-pg="' + (p.page - 1) + '"' + (p.page > 0 ? '' : ' disabled') + '>‹</button>';
    let last = -1;
    show.forEach(i => {
      if (i - last > 1) nav += '<span class="pg-gap">…</span>';
      nav += '<button class="pg-btn' + (i === p.page ? ' on' : '') + '" data-pg="' + i + '">' + (i + 1) + '</button>';
      last = i;
    });
    nav += '<button class="pg-btn" data-pg="' + (p.page + 1) + '"' + (p.page < pages - 1 ? '' : ' disabled') + '>›</button>';
    return list + '<div class="pg-nav">' + nav + '</div>';
  }
  function bindPager(el) {
    const id = el.id.slice(3), p = PAGERS[id];
    if (!p) return;
    el.querySelectorAll(".pg-btn[data-pg]").forEach(b => {
      b.onclick = () => {
        p.page = Number(b.dataset.pg);
        el.innerHTML = pagerBody(id);
        bindPager(el);
        if (p.bind) p.bind(el);
      };
    });
  }
  const bindPagers = root => (root || document).querySelectorAll(".pager").forEach(bindPager);
  // Сколько колонок плашек у вкладки на широком экране (см. CSS #app[data-cols])
  const VIEW_COLS = { games: 1, lab: 3, mines: 2, map: 2, auctions: 2, history: 1, info: 1, passport: 2, farm: 2, storage: 3, goals: 1, workshop: 2, raids: 2, market: 3,
                      team: 3, friends: 3, shop: 3, top: 1, faq: 1, rules: 1 };

  const costChips = (cost, stock) => RES_ALL.filter(k => cost[k]).map(k =>
    '<span class="chip ' + ((stock[k] || 0) >= cost[k] ? 'have' : 'lack') + '">' + RES_ICON[k] + ' ' + num(stock[k] || 0) + '/' + num(cost[k]) + '</span>').join("");

  function startTab() {
    let tab = null;

    if (!tab) { try { tab = localStorage.getItem("rofl_tab"); } catch (e) {} }

      '<button class="tab' + (t === current ? ' on' : '') + '" data-tab="' + t + '">' + L["tab_" + t] + '</button>').join("");
    document.querySelectorAll(".tab").forEach(b => { b.onclick = () => go(b.dataset.tab); });
    const on = document.querySelector(".tab.on");

  }
  async function go(tab) {
    current = tab;

    try { localStorage.setItem("rofl_tab", tab); } catch (e) {}
    renderTabs();

    // Каждое нажатие рисует в СВЕЖИЙ контейнер: медленный ответ прошлой вкладки допишет в старый, уже снятый
    // со страницы, и не перекроет новую (баг «нажал Склад — открылась Биржа»)
    const old = document.getElementById("app"), box = old.cloneNode(false);

    const goalsReq = (me.features || {}).goals !== false ? api("/api/goals").catch(() => null) : Promise.resolve(null);

  function newsCard(d) {
    const now = Date.now();

      const right = x.live ? (x.at && left > 0 ? fmt(L.news_left, { t: dur(left) }) : "")

        (x.prize ? (x.sub ? ' · ' : '') + '<span>' + (x.kind === "auction" ? '💰 ' : '🎁 ') + esc(x.prize) + '</span>' : '') +

  // Нарисованный холодильник: чем больше объём, тем шире корпус и больше дверей
  function fridgeSvg(cap) {
    const lvl = cap >= 100 ? 3 : cap >= 50 ? 2 : cap >= 10 ? 1 : 0;
    const w = [26, 34, 46, 58][lvl], doors = [1, 1, 2, 3][lvl], x0 = (64 - w) / 2;

    let s = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="' + x0 + '" y="6" width="' + w + '" height="52" rx="5" fill="#141b2e" stroke="' + col + '" stroke-width="2"/>' +
      '<line x1="' + x0 + '" y1="22" x2="' + (x0 + w) + '" y2="22" stroke="' + col + '" stroke-width="1.5" opacity=".7"/>';
    for (let i = 1; i < doors; i++) { const x = x0 + w * i / doors; s += '<line x1="' + x + '" y1="6" x2="' + x + '" y2="58" stroke="' + col + '" stroke-width="1.5" opacity=".7"/>'; }
    for (let i = 0; i < doors; i++) { const x = x0 + w * (i + 1) / doors - 4; s += '<rect x="' + x + '" y="26" width="2" height="9" rx="1" fill="' + col + '"/><rect x="' + x + '" y="11" width="2" height="6" rx="1" fill="' + col + '"/>'; }
    return s + '<text x="32" y="51" text-anchor="middle" font-size="9" font-weight="800" fill="' + col + '">' + cap + '</text></svg>';
  }
  const fridgeMini = cap => '<div class="fmini"><div class="fm-in"><div class="fm-face fm-front">' + fridgeSvg(cap) + '</div>' +
    '<div class="fm-face fm-back">' + fridgeImg(cap) + '</div></div></div>';
  let fridgeTimer = null;
  function startFridgeFlip(box) {
    clearInterval(fridgeTimer);
    const minis = Array.from(box.querySelectorAll(".fmini"));
    if (!minis.length) return;
    fridgeTimer = setInterval(() => {
      if (!document.body.contains(minis[0])) return clearInterval(fridgeTimer);
      if (document.hidden) return;
      minis.forEach((m, i) => setTimeout(() => m.classList.toggle("on"), i * 180));   // волной слева направо
    }, 5000);
  }
  function viewFarm(box) {
    const f = me.farm;
    const boosts = [];
    if (f.boosts.nuclear_until) boosts.push("🔋 x5");
    if (f.boosts.nitrogen_until) boosts.push("❄️ +40%");
    if (f.boosts.drone_until) boosts.push("🛸");
    if (me.bonus_percent) boosts.push("🛡 +" + me.bonus_percent + "%");
    const burnout = f.nearest_burnout
      ? new Date(f.nearest_burnout).toLocaleString(me.lang === "ru" ? "ru-RU" : "en-GB",
          { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
    const fridgePct = f.fridge_capacity ? Math.round(f.fridge / f.fridge_capacity * 100) : 0;
    const ups = f.fridge_levels || [];
    const fridgeCard = card(L.fr_title,
      '<div class="fridge-now">' + fridgeMini(f.fridge_capacity) + '<div class="finfo">' +
      '<div class="fname">' + fmt(L.fr_cap, { n: f.fridge_capacity }) + '</div>' +
      row("🥩", f.fridge + " / " + f.fridge_capacity) +
      '<div class="bar fridge"><i style="width:' + fridgePct + '%"></i></div></div></div>' +
      '<div class="hint fr-hint">' + L.fr_hint + '</div>' +
      (ups.length
        ? '<div class="hint">' + L.fr_up + '</div><div class="fridge-up">' + ups.map(u =>
            '<button data-fridge="' + u.sku + '">' + fridgeMini(u.capacity) + '<span>' + u.stars + ' ★</span></button>').join("") + '</div>'
        : '<div class="hint status-ok">' + L.fr_max + '</div>'));
    box.innerHTML =
      card(L.robotsTitle, KINDS.map(k => robotCard(k, f)).join("") +
        '<button class="btn scene-btn" id="openFarmBtn">' + L.openFarm + '</button>') + fridgeCard +
      card(L.farm,
        row(L.speed, fmt(L.perHour, { v: "+" + f.speed_hour }), "status-ok") +
        row(L.inv, f.inv_cutlets) +
        '<div class="two"><button class="btn ghost" id="refOne">' + L.refuelOne + '</button>' +
        '<button class="btn ghost" id="refAll">' + L.refuelAll + '</button></div>' +
        row(L.burnout, "🔥 " + burnout) +
        row(L.boosts, boosts.join(" ") || L.none) +
        buildCta(f) +
        '<button class="btn" id="bonusBtn"></button>');
    setupBonusButton(f.bonus_seconds_left);
    const ib = document.getElementById("internBtn");
    if (ib) ib.onclick = () => act(ib, "/api/intern", {}, async () => { notify(L.internDone); await refreshMe(); go("farm"); });
    document.getElementById("openFarmBtn").onclick = () => openScene(me);
    box.querySelectorAll("[data-fridge]").forEach(b => { b.onclick = () => buy(b.dataset.fridge, b); });
    startFridgeFlip(box);
    ["refOne", "refAll"].forEach(id => {
      const b = document.getElementById(id);
      b.onclick = () => act(b, "/api/refuel", { mode: id === "refOne" ? "one" : "all" },
        async res => { notify(fmt(L.refueled, { n: res.loaded })); await refreshMe(); go("farm"); });
    });
    bindShopLinks();
  }
  function bindShopLinks() {
    document.querySelectorAll(".goShop").forEach(b => { b.onclick = () => go("shop"); });
  }
  // CTA-триггеры: покупка предлагается в момент «боли»
  function buildCta(f) {
    const box = (kind, text) =>
      '<div class="cta ' + kind + '"><span>' + text + '</span><button class="goShop">' + L.ctaShopBtn + '</button></div>';
    if (f.junior + f.premium === 0) return box("red", L.ctaNoRobots);
    if (f.premium > 0 && f.premium_fueled < f.premium && f.fridge === 0 && f.inv_cutlets === 0)
      return box("red", fmt(L.ctaHungry, { n: f.premium - f.premium_fueled }));
    if (f.premium > 0 && f.fridge + f.inv_cutlets < f.premium) return box("yellow", L.ctaLowFuel);
    return "";
  }
  function setupBonusButton(secondsLeft) {
    const btn = document.getElementById("bonusBtn");
    if (!btn) return;
    function show(left) {
      btn.disabled = left > 0;
      btn.textContent = left > 0 ? fmt(L.bonusWait, { h: Math.floor(left / 3600), m: Math.floor(left % 3600 / 60) }) : L.bonusReady;
    }
    show(secondsLeft);
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const res = await post("/api/bonus", {});
        if (res.ok) { notify(L.bonusDone); await refreshMe(); go("farm"); } else show(res.seconds_left);
      } catch (e) { show(1); }
    };
  }

  // ================= 🎯 Цели =================
  function goalsCard(g) {
    const list = g.goals.map(x => {
      const pct = Math.min(100, Math.round(x.progress / x.target * 100));
      return '<div class="goal' + (x.progress >= x.target ? ' ok' : '') + '"><div class="gh"><div class="gt">' +
        (x.progress >= x.target ? "✅ " : "⬜ ") + esc(x.title) + '</div><div class="gp">' + x.progress + '/' + x.target + '</div></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
    }).join("");

    if (g.claimed) action = '<div class="hint ok-text">' + L.goals_claimed + '</div>';
    else action = '<button class="btn scene-btn" id="chestBtn"' + (g.done ? '' : ' disabled') + '>' + L.goals_claim + '</button>';

      '<div class="hint">' + fmt(L.goals_chest, { c: g.chest_coins, r: g.chest_res }) + '</div>' +
      '<div class="hint">' + fmt(L.goals_streak, { s: g.streak, e: g.every, b: g.streak_bonus }) + '</div>' +
      '<div class="hint">' + L.goals_reset + '</div>');

  // ================= 🔧 Мастерская =================
  // Сила одного боевого дрона (числа — shared/economy.py, приходят с витриной мастерской)
  let DRONE_FX = {};
  async function viewWorkshop(box) {
    const w = await api("/api/workshop");

    const recipes = w.recipes.map(r => {

        (r.team ? '<div class="hint' + (r.team_ok ? '' : ' status-bad') + '">' + (r.team_ok ? fmt(L.ws_teamItem, { x: w.team_mult }) : L.it_needTeam) + '</div>' : '');
      // дрона можно купить за монеты сразу — его карточка не сереет, замок только на сборке
      return '<div class="recipe' + (r.affordable ? ' ready' : '') + (r.locked && !r.drone ? ' locked' : '') + '"><div class="rh"><b>' + esc(r.title) + '</b>' + btn + '</div>' +
        '<div class="hint">' + (r.drone ? fmt(L["dr_eff_" + r.drone], DRONE_FX) : (L["eff_" + r.effect] || "")) + '</div>' + extra +
        (r.drone ? '<div class="hint">' + fmt(L.dr_have, { n: (w.drones || {})[r.drone] || 0 }) + '</div>' : '') +

    const weekly = (w.weekly || []).map(r => {
      const cost = RES.filter(k => r.cost[k]).map(k =>
        '<span class="chip ' + ((w.stock[k] || 0) >= r.cost[k] ? 'have' : 'lack') + '">' +
        RES_ICON[k] + ' ' + num(w.stock[k] || 0) + '/' + r.cost[k] + '</span>').join("");
      return '<div class="recipe weekly' + (r.affordable ? ' ready' : '') + '"><div class="rh"><b>' + esc(r.title) + '</b>' +
        '<button class="mini wcraft" data-id="' + r.id + '"' + (r.affordable ? '' : ' disabled') + '>' + L.ws_craft + '</button></div>' +

    }).join("");
    box.innerHTML = (weekly ? '<div class="card hot span-all"><h2>' + L.wk_title + '</h2><div class="hint">' + L.wk_hint + '</div>' +
      '<div class="recipes">' + weekly + '</div></div>' : '') +
      card(L.ws_title,
      '<div class="chips big">' + resLine(w.stock) + '</div>' +
      '<div class="hint">' + fmt(L.st_cap, { c: num(w.capacity) }) + '</div>' +
      '<div class="hint">' + L.ws_hint + '</div>' +
      row(L.ws_armor, fmt(L.ws_armorLvl, { l: w.armor_level, m: w.armor_max, p: w.armor_pct })) +
      (w.armor_until ? '<div class="hint">' + fmt(L.ws_armorUntil, { t: new Date(w.armor_until).toLocaleString(me.lang === "ru" ? "ru-RU" : "en-GB",
        { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) }) + '</div>' : '') +
      '<div class="hint">' + fmt(w.has_shuttle ? L.ws_shuttleOn : L.ws_shuttleOff,
        { fee: w.has_shuttle ? w.shuttle_fee : w.market_fee }) + '</div>') +
      card(L.resources + " · " + L.resWhere, RES_ALL.map(k => row(RES_ICON[k] + " " + esc(w.res_names[k] || k), L["res_" + k + "_src"] || "")).join("")) +
      '<div class="recipes">' + recipes + '</div>';
    document.querySelectorAll(".wcraft").forEach(b => {
      b.onclick = () => act(b, "/api/craft_weekly", { recipe: b.dataset.id }, async res => {
        notify(res.stored ? L.it_stored : L.ws_crafted); await refreshMe(); go("workshop");
      });
    });
    document.querySelectorAll(".dbuy").forEach(b => {
      b.onclick = () => act(b, "/api/drone/buy", { kind: b.dataset.k }, async () => { notify(L.dr_bought); await refreshMe(); go("workshop"); });
    });
    document.querySelectorAll(".craft").forEach(b => {
      b.onclick = () => act(b, "/api/craft", { recipe: b.dataset.id }, async res => {
