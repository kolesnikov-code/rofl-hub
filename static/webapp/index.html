<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ROFL HUB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b0f1a;
    --card: #141a2e;
    --card2: #1a2240;
    --neon: #00ffe1;
    --accent: #ffd93d;
    --pink: #ff4d8d;
    --text: #e8ecff;
    --muted: #8a93b8;
    --ok: #37e85f;
    --bad: #ff5555;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    padding: 12px 12px 28px;
    min-height: 100vh;
  }
  .logo {
    text-align: center; font-weight: 900; font-size: 22px; letter-spacing: 3px;
    margin: 6px 0 2px; color: var(--neon);
    text-shadow: 0 0 18px rgba(0, 255, 225, .45);
  }
  .sub { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .card {
    background: linear-gradient(160deg, var(--card), var(--card2));
    border: 1px solid rgba(0, 255, 225, .14);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
  }
  .card h2 { font-size: 13px; letter-spacing: 1.5px; color: var(--neon); margin-bottom: 10px; }
  .balance { font-size: 34px; font-weight: 900; color: var(--accent); line-height: 1.1; }
  .balance small { font-size: 14px; color: var(--muted); font-weight: 500; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 14px; }
  .row { gap: 10px; }
  .row .k { color: var(--muted); white-space: nowrap; flex: 0 0 auto; }   /* подпись с эмодзи — всегда одной строкой */
  .row .v { font-weight: 700; min-width: 0; text-align: right; overflow-wrap: anywhere; }          /* переносится значение, а не подпись */
  .row .k:only-child { white-space: normal; flex: 1 1 auto; }              /* строка без значения — текст переносится */
  .vip {
    display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px;
    background: rgba(255, 77, 141, .15); border: 1px solid var(--pink);
    color: var(--pink); font-size: 12px; font-weight: 800; letter-spacing: 1px;
  }
  .bar { height: 10px; background: #0d1326; border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
  .bar i {
    display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--neon), var(--accent));
    transition: width .6s ease;
  }
  .hint { color: var(--muted); font-size: 12px; }
  /* 🕹 Игры (26.10): плитки 2×5 — все игры на одном экране телефона */
  .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .game-tile { text-align: left; border: 1px solid rgba(0,255,225,.22); border-radius: 14px; padding: 11px 12px;
    background: linear-gradient(160deg, #18213d, #10162b); color: var(--text); cursor: pointer; min-height: 78px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 6px; font: inherit; }
  .game-tile .gt-name { font-weight: 800; font-size: 14px; line-height: 1.2; }
  .game-tile .gt-meta { font-size: 11px; color: var(--muted); }
  .game-tile.limit { opacity: .55; }
  .game-tile.soon { opacity: .4; cursor: default; border-style: dashed; }
  .game-tile:active:not(.soon) { transform: scale(.98); }
  .g-big { font-size: 46px; font-weight: 900; text-align: center; color: var(--accent); margin: 8px 0; }
  .g-moves { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .g-moves.four { grid-template-columns: repeat(4, 1fr); }
  .g-moves .btn { margin-top: 0; padding: 14px 4px; font-size: 15px; }
  .g-result { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #0d1326; font-size: 14px; line-height: 1.5; }
  .g-result.win { border: 1px solid rgba(55,232,95,.5); } .g-result.lose { border: 1px solid rgba(255,85,85,.45); }
  .quiz-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .quiz-q { font-size: 17px; font-weight: 800; line-height: 1.35; margin: 12px 0 4px; }
  .quiz-opt { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid rgba(0,255,225,.3); background: #0d1326; color: var(--text); font: inherit; font-size: 15px; cursor: pointer; }
  .quiz-opt.right, .btn.fx-win { border-color: var(--ok); background: rgba(55,232,95,.22); color: #eafff0;
    box-shadow: 0 0 0 1px var(--ok) inset, 0 0 22px rgba(55,232,95,.55); animation: fxGlow 1.2s ease-in-out infinite alternate; }
  .quiz-opt.wrong, .btn.fx-lose { border-color: var(--bad); background: rgba(255,85,85,.2); color: #ffd9d9;
    box-shadow: 0 0 0 1px var(--bad) inset; animation: fxShake .45s ease-in-out 1; }
  /* верный ответ, когда ты ошибся: «депрессивная» подсветка — приглушённый зелёный, пунктир, медленное угасание */
  .quiz-opt.sad, .btn.fx-sad { border: 1px dashed rgba(55,232,95,.65); background: rgba(55,232,95,.08); color: #9fbfa8;
    filter: saturate(.55); animation: fxSad 2.4s ease-in-out infinite; }
  .quiz-opt, .btn { position: relative; overflow: visible; }
  .spark { position: absolute; width: 5px; height: 5px; border-radius: 1px; pointer-events: none; z-index: 5; }
  .spark.up { background: #ffd93d; box-shadow: 0 0 6px #ff9a3d, 0 0 12px #ffd93d; animation: fxUp 1.1s ease-out forwards; }
  .spark.down { background: #ff5555; box-shadow: 0 0 6px #ff2a2a; animation: fxDown 1.9s ease-in forwards; }
  @keyframes fxUp { 0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), -70px) scale(.3); } }
  @keyframes fxDown { 0% { opacity: .95; transform: translate(0, 0); }
    100% { opacity: 0; transform: translate(var(--dx), 60px) rotate(120deg); } }
  @keyframes fxGlow { from { box-shadow: 0 0 0 1px var(--ok) inset, 0 0 10px rgba(55,232,95,.35); }
    to { box-shadow: 0 0 0 1px var(--ok) inset, 0 0 26px rgba(55,232,95,.75); } }
  @keyframes fxShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes fxSad { 0%, 100% { opacity: .9; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .spark { display: none; } .quiz-opt, .btn { animation: none !important; } }
  .game-tile.limit .gt-meta { color: var(--accent); }
  .quiz-opt.gone { opacity: .25; }
  .game-tile.wide { grid-column: 1 / -1; }
  .dl-search { text-align: center; font-size: 40px; margin: 14px 0 4px; animation: dlPulse 1.4s ease-in-out infinite; }
  @keyframes dlPulse { 0%, 100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.15); opacity: 1; } }
  .dl-vs { text-align: center; font-size: 15px; margin: 10px 0; }
  .btn.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  @media (prefers-reduced-motion: reduce) { .dl-search { animation: none; } }
  .qs-text { font-size: 15px; line-height: 1.5; margin: 10px 0 4px; animation: qsIn .35s ease-out; }
  @keyframes qsIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .qs-card { border: 1px solid rgba(0,255,225,.18); border-radius: 14px; padding: 12px; margin-top: 10px; }
  .qs-card h3 { margin: 0 0 4px; font-size: 15px; }
  .qs-card.dim { filter: grayscale(1); opacity: .45; }
  .qs-card.epic { border-color: rgba(255,211,77,.55); box-shadow: 0 0 14px rgba(255,211,77,.12) inset; }
  .qs-paper { margin-top: 6px; color: #ffd34d; }
  .qs-meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .qs-status { font-size: 12px; color: var(--muted); float: right; }
  .fx-toggle { float: right; background: none; border: 1px solid rgba(0,255,225,.3); border-radius: 10px; color: var(--text);
    font-size: 13px; padding: 2px 8px; margin-top: -4px; cursor: pointer; }
  .fx-toggle.off { opacity: .45; }
  .fx-sw { float: right; display: inline-flex; align-items: center; gap: 6px; font: 400 11px/1 -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--muted); letter-spacing: 0; text-transform: none; text-shadow: none; }
  .fx-sw .fx-toggle { float: none; }
  .qs-fiction { margin-top: 12px; font-size: 11px; opacity: .75; }
  .qs-input { display: flex; gap: 8px; margin-top: 10px; }
  .qs-input input { flex: 1; min-width: 0; padding: 11px 12px; border-radius: 12px; border: 1px solid rgba(0,255,225,.35);
    background: #0d1326; color: var(--text); font: 600 16px/1.2 inherit; letter-spacing: .08em; }
  .qs-input .btn { width: auto; margin-top: 0; padding: 0 16px; }
  .fx-gal { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .fx-gal .btn { margin-top: 0; padding: 9px 6px; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .qs-text { animation: none; } }
  .g-reset { display: block; height: 3px; margin-top: 8px; border-radius: 99px; background: var(--accent);
    animation: gReset 3s linear forwards; }
  @keyframes gReset { from { width: 100%; } to { width: 0; } }
  .btn.short { background: #0d1326; color: var(--muted); border: 1px dashed rgba(255,255,255,.18); box-shadow: none; }
  .qr-open { font-size: 12px; padding: 7px 10px; margin-top: 10px; }
  .qr-box { margin-top: 10px; padding: 10px; border-radius: 12px; border: 1px dashed rgba(255,255,255,.18); }
  .qr-box .btn { margin-top: 6px; font-size: 13px; padding: 9px 10px; }
  .g-flag { display: block; margin: 12px auto 4px; height: 96px; max-width: 100%; border-radius: 8px; box-shadow: 0 0 0 1px rgba(255,255,255,.15); }
  .g-flag-emoji { font-size: 72px; text-align: center; line-height: 1.1; margin: 8px 0 0; }
  .math-q { font-size: 34px; font-weight: 900; text-align: center; color: var(--accent); margin: 14px 0 6px; letter-spacing: 1px; }
  .code-slots { display: flex; justify-content: center; gap: 8px; margin: 12px 0 4px; }
  .code-slots span { width: 46px; height: 54px; border-radius: 12px; border: 1px solid rgba(0,255,225,.35); display: flex;
    align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: var(--accent); background: #0d1326; }
  .code-slots.win span { border-color: var(--ok); color: var(--ok); }
  .code-slots.sad span { border-style: dashed; color: #9fbfa8; }
  .code-pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .code-pad .btn { margin-top: 0; padding: 12px 0; font-size: 17px; }
  .code-log { margin-top: 10px; font-size: 14px; }
  .code-log div { display: flex; justify-content: space-between; padding: 5px 2px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .code-log b { letter-spacing: 4px; }
  .mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .mem-card { aspect-ratio: 1 / 1; border-radius: 12px; border: 1px solid rgba(0,255,225,.3); background: linear-gradient(135deg, #10203a, #0b1124);
    font-size: 30px; display: flex; align-items: center; justify-content: center; color: transparent; transition: transform .25s, background .25s; }
  .mem-card::before { content: "?"; color: rgba(0,255,225,.35); font-size: 22px; font-weight: 900; }
  .mem-card.open { background: #13284a; color: inherit; transform: rotateY(180deg) scaleX(-1); }
  .mem-card.open::before, .mem-card.done::before { content: none; }
  .mem-card.done { background: rgba(55,232,95,.16); border-color: var(--ok); color: inherit; }
  .mem-card.miss { border-color: var(--bad); }
  .quiz-opt:disabled { cursor: default; }
  .tbar { height: 6px; background: #0d1326; border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .tbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), var(--accent), var(--bad)); transition: width 1s linear; }
  .btn + .hint { margin-top: 10px; }   /* подписи под кнопкой не прилипают к ней */
  .btn {
    width: 100%; margin-top: 10px; padding: 13px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 800; letter-spacing: .5px; cursor: pointer;
    background: linear-gradient(90deg, var(--neon), #00b3ff); color: #04121c;
    box-shadow: 0 0 18px rgba(0, 255, 225, .35);
  }
  .btn:disabled { background: #2a3354; color: var(--muted); box-shadow: none; }
  .cta {
    border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 13px;
    font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .cta.red { background: rgba(255,85,85,.12); border: 1px solid rgba(255,85,85,.55); color: #ff8e8e; }
  .cta.yellow { background: rgba(255,217,61,.1); border: 1px solid rgba(255,217,61,.45); color: var(--accent); }
  .cta button {
    padding: 8px 12px; border: none; border-radius: 10px; background: var(--neon);
    color: #04121c; font-weight: 800; cursor: pointer; white-space: nowrap; font-size: 13px;
  }
  .shop-sub { color: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: 1.5px; margin-top: 12px; }
  .shop-item {
    width: 100%; margin-top: 8px; padding: 12px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(0,255,225,.28); background: #0d1326; color: var(--text);
    font-size: 14px; font-weight: 700; text-align: center;
  }
  .shop-item:disabled { opacity: .45; cursor: wait; }
  .status-ok { color: var(--ok); } .status-bad { color: var(--bad); }
  .top-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; border-bottom: 1px dashed rgba(138,147,184,.18); }
  .top-row:last-child { border-bottom: none; }
  .top-row .place { width: 28px; font-weight: 900; color: var(--accent); }
  .top-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-row .brain { color: var(--neon); font-weight: 700; }
  .rank { font-size: 11px; font-weight: 700; color: var(--accent); opacity: .85; }
  .top-row .bal { font-weight: 800; }
  .loading { text-align: center; color: var(--muted); padding: 50px 0; font-size: 15px; }
  .hidden { display: none !important; }
  .made-by { margin-top: 6px; }
  .made-by a { color: var(--neon); text-decoration: none; font-weight: 700; }
  .scene-btn { background: linear-gradient(90deg, var(--accent), #ff9d3d); color: #1a1200; box-shadow: 0 0 18px rgba(255,217,61,.35); }
  .scene-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .scene-head h2 { font-size: 14px; letter-spacing: 1.5px; color: var(--neon); }
  .back { padding: 8px 12px; border: 1px solid rgba(0,255,225,.35); border-radius: 10px; background: #0d1326; color: var(--text); font-weight: 700; cursor: pointer; }
  .mine-scene { position: relative; height: 340px; border-radius: 16px; overflow: hidden; margin-bottom: 12px;
    background: linear-gradient(180deg, #070a16 0%, #0e1430 55%, #2b1b12 56%, #1a1009 100%);
    border: 1px solid rgba(0,255,225,.14); box-shadow: 0 4px 24px rgba(0,0,0,.4); }
  .sky i { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; opacity: .7; animation: twinkle 2.8s infinite; }
  @keyframes twinkle { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
  .moon { position: absolute; right: 24px; top: 22px; width: 42px; height: 42px; border-radius: 50%; background: #ffe9a3; box-shadow: 0 0 30px rgba(255,233,163,.55); }
  .hill { position: absolute; left: -10%; right: -10%; top: 46%; height: 60px; background: #1d1326; border-radius: 50% 50% 0 0; }
  .arch { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); width: 96px; height: 70px;
    background: #090612; border: 4px solid #6b4a2a; border-bottom: none; border-radius: 48px 48px 0 0; display: flex; align-items: flex-end; justify-content: center; font-size: 22px; padding-bottom: 6px; }
  .rails { position: absolute; left: 0; right: 0; top: 56%; height: 6px; background: repeating-linear-gradient(90deg, #8a93b8 0 14px, transparent 14px 26px); opacity: .5; }
  .units { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 10px; padding: 0 10px; flex-wrap: wrap; }
  .unit { width: 96px; text-align: center; background: rgba(13,19,38,.78); border: 1px solid rgba(0,255,225,.22); border-radius: 12px; padding: 6px 4px 6px; backdrop-filter: blur(2px); }
  .unit img { width: 64px; height: 64px; display: block; margin: 0 auto; animation: bob 2.2s ease-in-out infinite; }
  .unit.junior img { animation-duration: 1.9s; }
  .unit.premium img { animation: drill .22s linear infinite; }
  .unit.premium.idle img { animation: none; filter: grayscale(.8) brightness(.7); }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  @keyframes drill { 0% { transform: translate(0,0) } 25% { transform: translate(1px,-1px) } 50% { transform: translate(-1px,1px) } 75% { transform: translate(1px,1px) } 100% { transform: translate(0,0) } }
  .unit .cnt { font-weight: 900; color: var(--accent); font-size: 15px; }
  .unit .unm { font-size: 11px; color: var(--text); font-weight: 700; margin-top: 2px; }
  .unit .ust { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 13px; padding: 20px 30px; }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .coin { position: absolute; bottom: 120px; font-size: 18px; animation: rise 1.8s ease-out forwards; }
  @keyframes rise { 0% { transform: translateY(0) scale(.8); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(-150px) scale(1.15); opacity: 0 } }
  .mined { color: var(--ok); font-variant-numeric: tabular-nums; }
  .bar.fridge i { background: linear-gradient(90deg, #ff9d3d, var(--pink)); }
  .err { text-align: center; color: var(--bad); padding: 40px 10px; font-size: 15px; }
  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 10px; }

  /* ---------- вкладки (23.10): приложение вместо простыней в чате ---------- */
  .tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 10px;
    margin: 0 -12px 8px; padding-left: 12px; padding-right: 12px; background: linear-gradient(180deg, var(--bg) 80%, rgba(11,15,26,0));
    scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(0,255,225,.25);
    background: #0d1326; color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .tab.on { background: linear-gradient(90deg, var(--neon), #00b3ff); color: #04121c; border-color: transparent;
    box-shadow: 0 0 14px rgba(0,255,225,.35); }
  .balance.small { font-size: 20px; margin: 4px 0; }
  .btn.ghost { background: #0d1326; color: var(--text); border: 1px solid rgba(0,255,225,.35); box-shadow: none; }
  .btn.danger { background: linear-gradient(90deg, #ff4d8d, #ff8e3d); color: #1a0008; box-shadow: none; font-size: 14px; }
  .two { display: flex; gap: 8px; } .two .btn { flex: 1; font-size: 13px; padding: 11px 6px; }
  .mini { margin-top: 6px; padding: 7px 12px; border: none; border-radius: 10px; font-weight: 800; font-size: 12px;
    cursor: pointer; background: linear-gradient(90deg, var(--neon), #00b3ff); color: #04121c; }
  .mini.ghost { background: #0d1326; color: var(--neon); border: 1px solid rgba(0,255,225,.35); }
  .mini:disabled { background: #2a3354; color: var(--muted); cursor: default; }
  .robot { display: flex; align-items: center; gap: 12px; padding: 10px; margin-bottom: 8px; border-radius: 14px;
    background: rgba(13,19,38,.7); border: 1px solid rgba(0,255,225,.18); }
  .robot img { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; flex: 0 0 auto;
    box-shadow: 0 0 16px rgba(0,255,225,.25); }
  .robot.premium img { box-shadow: 0 0 18px rgba(255,157,61,.45); }
  .robot.junior img { box-shadow: 0 0 18px rgba(0,179,255,.4); }
  .robot .rinfo { flex: 1; min-width: 0; }
  .robot .rname { font-weight: 800; font-size: 15px; }
  .robot .rrate { color: var(--accent); font-weight: 700; font-size: 13px; margin-top: 2px; }
  .robot .rstat { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .robot .rcount { font-size: 28px; font-weight: 900; color: var(--accent); min-width: 54px; text-align: right; }
  .robot.zero .rcount { color: var(--muted); }
  .res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 6px; }

  /* 🎉 Новая ступень — торжественный экран */

  .pt-row { display: grid; grid-template-columns: 2.4em 1fr 1fr; gap: 10px; align-items: start; padding: 7px 0;

  .st-up { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;

  @keyframes stUpIn { from { opacity: 0; } }
  @keyframes stPop { from { transform: scale(.2) rotate(-25deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .fx-aurora, .fx-shimmer, .fx-pulse, .fx-flame, .st-combat, .st-veteran, .st-legend, .st-immortal,

  .sub2 { color: var(--accent); font-weight: 800; font-size: 13px; margin: 12px 0 4px; letter-spacing: .5px; }

  .card.hot { border-color: rgba(255,157,61,.55); box-shadow: 0 0 22px rgba(255,157,61,.18); }

  /* Компьютер и планшет: единая сетка плашек. Число колонок задаёт вкладка (data-cols):
     ≥1100px — до 3, 720–1099px — 2, уже 720px — одна колонка, как на телефоне.
     Плашки одного ряда — одной высоты; длинные списки внутри листаются страницами. */
  @media (min-width: 720px) {
    #app {
      display: grid; gap: 14px; align-items: stretch;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 1500px; margin: 0 auto;
    }
    #app[data-cols="1"] { grid-template-columns: minmax(0, 1fr); max-width: 820px; }
    #app > .card { margin-bottom: 0; display: flex; flex-direction: column; }
    #app > :not(.card), #app > .span-all { grid-column: 1 / -1; }   /* загрузка, ошибки, сетки плиток */
    #scene, #footer { max-width: 1000px; margin-left: auto; margin-right: auto; }
    /* Мастерская: рецепты — плитки одинаковой высоты, кнопка и цена внизу */
    .recipes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .recipes .recipe { margin-bottom: 0; display: flex; flex-direction: column; }
    .recipes .recipe .chips { margin-top: auto; padding-top: 8px; }
    .card .recipes { margin-top: 8px; }
  }
  @media (min-width: 720px) and (max-width: 1099px) {
    #app > .span-tablet { grid-column: 1 / -1; }    /* «Что даёт каждый товар» под двумя колонками */
  }
  @media (min-width: 1100px) {
    #app[data-cols="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  /* ----- 🛡 Щит от налётов: таймер обратного отсчёта ----- */
  .card.shield-card { transition: filter .4s, opacity .4s; }
  .card.shield-card.off { filter: grayscale(1); opacity: .6; }
  .card.shield-card.on { border-color: rgba(167, 139, 250, .45); box-shadow: 0 0 22px rgba(167, 139, 250, .18), 0 4px 24px rgba(0, 0, 0, .35); }
  .sh-state { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 1px; padding: 3px 10px;
    border-radius: 999px; margin-bottom: 8px; background: #2a3354; color: var(--muted); }
  .shield-card.on .sh-state { background: rgba(52, 211, 153, .16); color: #6ee7b7; }
  .sh-timer { font: 800 34px/1.1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 2px;
    color: #59607e; margin: 2px 0 8px; font-variant-numeric: tabular-nums; }
  .shield-card.on .sh-timer { color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(90deg, #f6c177, #c4a7e7, #9ccfd8, #a6e3a1, #f6c177);
    background-size: 300% 100%; animation: shflow 9s ease-in-out infinite alternate; }
  @keyframes shflow { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
  /* ----- налёты: топливо в углу плашки ----- */
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .card-head h2 { margin-bottom: 0; }
  .fuel-pill { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
    background: rgba(0, 255, 225, .1); color: var(--neon); }
  .fuel-pill.low { background: rgba(255, 85, 85, .12); color: var(--bad); }
  /* ----- 📦 Склад: серые пустые плашки и «лавовая лампа» у заполненных ----- */
  .card.dim { filter: grayscale(1); opacity: .5; }
  .card.lava { position: relative; overflow: hidden; border-color: rgba(255, 255, 255, .16); }
  .card.lava::before, .card.lava::after { content: ""; position: absolute; pointer-events: none; z-index: 0; }
  .card.lava::before { inset: -60%; filter: blur(46px); opacity: .30;
    background: conic-gradient(from 0deg, #ffb347, #ff6fb5, #c084fc, #60a5fa, #22d3ee, #34d399, #a3e635, #fde047, #ffb347);
    animation: lavaSpin 28s linear infinite; }
  .card.lava::after { inset: -30%; filter: blur(30px); opacity: .22;
    background: radial-gradient(circle at 30% 30%, #f472b6 0, transparent 38%), radial-gradient(circle at 70% 65%, #38bdf8 0, transparent 40%),
                radial-gradient(circle at 45% 80%, #facc15 0, transparent 35%);
    animation: lavaDrift 17s ease-in-out infinite alternate; }
  .card.lava > * { position: relative; z-index: 1; }
  @keyframes lavaSpin { to { transform: rotate(360deg); } }
  @keyframes lavaDrift { 0% { transform: translate(-8%, -6%) scale(1); } 50% { transform: translate(6%, 4%) scale(1.15); }
                         100% { transform: translate(-4%, 8%) scale(.95); } }
  @media (prefers-reduced-motion: reduce) { .card.lava::before, .card.lava::after, .shield-card.on .sh-timer { animation: none; } }
  .moves + .hint { margin-top: 8px; }
  /* ----- мастерская: рецепт ещё не открыт новичку ----- */

  .recipe .lockline { color: var(--muted); font-size: 12px; font-weight: 700; }
  /* ----- 📚 Инфо: FAQ и соглашение в одной вкладке ----- */
  .doc-switch { display: flex; gap: 8px; margin-bottom: 10px; }
  .doc-switch .idx { flex: 1; }
  /* ----- ⛏ Карта рудников ----- */
  .minemap { position: relative; width: 100%; border-radius: 14px; overflow: hidden;
    background: radial-gradient(ellipse at 30% 20%, #1c2a4a 0%, transparent 55%),
                radial-gradient(ellipse at 75% 80%, #2a1d3f 0%, transparent 55%), #0d1426;
    border: 1px solid rgba(0, 255, 225, .12); }
  .minemap svg.terrain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; }
  .mine { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .14); background: #18213a; color: #fff; font-size: 19px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
    transition: transform .2s; overflow: visible; }
  .mine:hover { transform: scale(1.12); }
  .mine.free { border-color: rgba(0, 255, 225, .55); background: #1f2c4f;
    box-shadow: 0 0 12px rgba(0, 255, 225, .35); animation: freeGlow 3s ease-in-out infinite; }
  .mine .no { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); font-size: 10px;
    color: var(--muted); font-weight: 700; white-space: nowrap; }
  .mine .tb { position: absolute; top: -8px; right: -8px; font-size: 13px; background: #0d1426;
    border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .mine.held { border-color: var(--mc); box-shadow: 0 0 14px var(--mc); animation: pumpBob 2.4s ease-in-out infinite; }
  /* занятый рудник: «бронированное» зубчатое кольцо — на шахте идёт добыча чужой командой */
  .mine.held::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(var(--mc) 0deg 11deg, rgba(0, 0, 0, 0) 11deg 22.5deg);
    -webkit-mask: radial-gradient(circle, transparent 0 62%, #000 63% 76%, transparent 77%);
            mask: radial-gradient(circle, transparent 0 62%, #000 63% 76%, transparent 77%);
    filter: drop-shadow(0 0 3px var(--mc)); animation: armorSpin 14s linear infinite; }
  .mine.held::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--mc);
    opacity: 0; animation: pumpRing 2.4s ease-out infinite; }
  .mine.mine-own { border-color: #fde047; box-shadow: 0 0 18px rgba(253, 224, 71, .55); }
  .mine.target { border-color: #fb923c; box-shadow: 0 0 16px rgba(251, 146, 60, .6); animation: targetPulse 1.6s ease-in-out infinite; }
  .mine.sel { outline: 2px solid var(--neon); outline-offset: 3px; }
  .mine .drop { position: absolute; left: 50%; top: 4px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%;
    background: var(--mc); opacity: 0; animation: dropUp 2.1s ease-in infinite; pointer-events: none; }
  .mine .drop:nth-child(2) { animation-delay: .7s; margin-left: -9px; }
  .mine .drop:nth-child(3) { animation-delay: 1.4s; margin-left: 3px; }
  @keyframes pumpBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes armorSpin { to { transform: rotate(360deg); } }
  @keyframes freeGlow { 0%, 100% { box-shadow: 0 0 8px rgba(0, 255, 225, .25); } 50% { box-shadow: 0 0 18px rgba(0, 255, 225, .6); } }
  @keyframes pumpRing { 0% { transform: scale(.9); opacity: .7; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes dropUp { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-34px); opacity: 0; } }
  @keyframes targetPulse { 0%, 100% { box-shadow: 0 0 8px rgba(251, 146, 60, .4); } 50% { box-shadow: 0 0 22px rgba(251, 146, 60, .9); } }
  @media (prefers-reduced-motion: reduce) { .mine.held, .mine.held::after, .mine.held::before, .mine.free, .mine .drop, .mine.target { animation: none; } }
  /* Склад: ресурсы — одна плашка во всю ширину, внутри 1–3 колонки */
  .res-cols { display: grid; gap: 4px 22px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .res-cols .resbar .k { white-space: nowrap; }
  .res-actions { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 6px; }

    padding: 14px 16px; text-align: center; font-weight: 700; font-size: 14px; z-index: 2; }
  .lead-row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }

  .big-num { font-size: 30px; font-weight: 900; margin: 2px 0 6px; }

  .resbar { margin: 6px 0; }
  /* 🧭 27.10: выбор режима, постепенное открытие разделов, вызов на дуэль, Дело дня, карточка достижений */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(4, 7, 16, .82); display: flex; align-items: center;

  .mode-opt { display: block; width: 100%; text-align: left; margin-top: 10px; padding: 12px 14px; border-radius: 14px; cursor: pointer;
    border: 1px solid rgba(0, 255, 225, .25); background: #0d1326; color: var(--text); font: inherit; }
  .mode-opt b { display: block; font-size: 15px; margin-bottom: 4px; }
  .mode-opt span { display: block; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .mode-opt.on { border-color: var(--neon); box-shadow: 0 0 14px rgba(0, 255, 225, .25); }
  .mode-opt:disabled { opacity: .6; }
  .tab.lock { opacity: .55; border-style: dashed; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 40; max-width: 92vw; padding: 12px 16px;
    border-radius: 14px; background: #10203a; border: 1px solid var(--neon); color: var(--text); font-size: 13px; line-height: 1.4;

  // ⚡ ДАННЫЕ ВКЛАДОК В ПАМЯТИ (31.10, как в RusExpat): повторный вход во вкладку рисуется СРАЗУ из прошлого ответа,
  // свежие данные приходят фоном и тихо перерисовывают (revalidate). Запоминаются только GET, сделанные при рисовании
  // вкладки (не опросы и не действия игрока); любое действие (POST) стирает память — после него всё с сервера.
  const GET_CACHE = new Map();             // путь → { raw, at }
  const CACHE_TTL_MS = 5 * 60 * 1000;      // старше — не показываем, ждём сервер
  const NO_CACHE_TABS = ["games"];         // раунды игр и дуэли — только живые данные
  let viewCache = null;                    // пока рисуется вкладка: { used: Set путей, отданных из памяти }
  let navSeq = 0, cacheGen = 0;
  const IN_FLIGHT = new Map();             // путь → обещание предзагрузки (вкладка ждёт его, а не дублирует запрос)
  async function api(path, opts) {
    opts = opts || {};
    const isGet = !opts.method || opts.method === "GET", vc = viewCache;
    if (!isGet) { GET_CACHE.clear(); cacheGen++; }
    else if (vc && !opts.fresh) {
      if (IN_FLIGHT.has(path)) await IN_FLIGHT.get(path);
      const hit = GET_CACHE.get(path);
      if (hit && Date.now() - hit.at < CACHE_TTL_MS) { vc.used.add(path); return JSON.parse(hit.raw); }
    }
    const gen = cacheGen;
    const res = await fetch(path, Object.assign({
      headers: { "X-Telegram-Init-Data": initData, "Content-Type": "application/json" }
    }, opts));
    const raw = swapIcons(await res.text().catch(() => ""));
    let body = {};
    try { body = JSON.parse(raw); } catch (e) {}
    if (!res.ok) throw { status: res.status, body: body };
    // ответ, ушедший ДО действия игрока, в память не кладём — он уже устарел
    if (isGet && (vc || opts.fresh) && gen === cacheGen) GET_CACHE.set(path, { raw: raw, at: Date.now() });
    return body;
  }
  // Фоном: свежие ответы для путей, показанных из памяти; изменилось — тихо перерисовать (если игрок не ушёл и не печатает)
  const REVALIDATE_AFTER_MS = 20 * 1000;   // ответ моложе — свежий (только что предзагружен), не перепрашиваем
  async function revalidate(tab, nav, paths) {
    paths = paths.filter(p => Date.now() - ((GET_CACHE.get(p) || {}).at || 0) >= REVALIDATE_AFTER_MS);
    if (!paths.length) return;
    const before = paths.map(p => (GET_CACHE.get(p) || {}).raw);
    try { await Promise.all(paths.map(p => api(p, { fresh: true }))); } catch (e) { return; }
    if (nav !== navSeq || current !== tab) return;
    if (paths.every((p, i) => (GET_CACHE.get(p) || {}).raw === before[i])) return;
    const box = document.getElementById("app"), el = document.activeElement;
    if (box && el && box.contains(el) && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    go(tab, { quiet: true });

  const post = (path, data) => api(path, { method: "POST", body: JSON.stringify(data || {}) });

  function notify(text, ok) {

  // Действие с сервером: блокируем кнопку, показываем итог, перерисовываем вкладку
  async function act(btn, path, data, onOk) {

  // ================= Постраничный список: «‹ 1 2 3 … 45 46 ›» =================
  // Сотни лотов не растягивают плашку: на странице per штук, номер страницы переживает
  // обновление вкладки. bind(el) — перепривязать кнопки строк после смены страницы.
  const PAGERS = {};
  function pager(id, items, per, emptyHtml, bind) {
    const prev = PAGERS[id], pages = Math.max(1, Math.ceil(items.length / per));
    PAGERS[id] = { items: items, per: per, empty: emptyHtml || "", bind: bind,
                   page: Math.min(prev ? prev.page : 0, pages - 1) };
    return '<div class="pager" id="pg-' + id + '">' + pagerBody(id) + '</div>';
  }
  function pagerBody(id) {
    const p = PAGERS[id];
    if (!p.items.length) return p.empty;
    const pages = Math.ceil(p.items.length / p.per);
    const list = '<div class="pg-list">' + p.items.slice(p.page * p.per, (p.page + 1) * p.per).join("") + '</div>';
    if (pages <= 1) return list;
    const show = [];
    for (let i = 0; i < pages; i++) if (i < 2 || i >= pages - 2 || Math.abs(i - p.page) <= 1) show.push(i);
    let nav = '<button class="pg-btn" data-pg="' + (p.page - 1) + '"' + (p.page > 0 ? '' : ' disabled') + '>‹</button>';
    let last = -1;
    show.forEach(i => {
      if (i - last > 1) nav += '<span class="pg-gap">…</span>';
      nav += '<button class="pg-btn' + (i === p.page ? ' on' : '') + '" data-pg="' + i + '">' + (i + 1) + '</button>';
      last = i;
    });
    nav += '<button class="pg-btn" data-pg="' + (p.page + 1) + '"' + (p.page < pages - 1 ? '' : ' disabled') + '>›</button>';

  // за раз — первый заход во вкладку тоже мгновенный. Пути — ровно те, что запрашивает вкладка (иначе промах — просто
  // обычная загрузка). Нажатие на вкладку (pointerdown) начинает загрузку раньше, чем отпущен палец.
  const PREFETCH = {
    passport: () => ["/api/gifts", "/api/goals", "/api/news", "/api/card"],
    storage: () => ["/api/storage"],
    workshop: () => ["/api/workshop"],

  const PREFETCH_ORDER = ["passport", "storage", "workshop", "market", "team", "shop", "top", "persona", "friends"];
  function prefetchTab(tab) {
    if (!PREFETCH[tab] || NO_CACHE_TABS.indexOf(tab) >= 0) return Promise.resolve();
    const fresh = p => { const h = GET_CACHE.get(p); return h && Date.now() - h.at < CACHE_TTL_MS; };
    return Promise.all(PREFETCH[tab]().filter(p => !fresh(p) && !IN_FLIGHT.has(p)).map(p => {

      IN_FLIGHT.set(p, job);

    }));
  }
  async function prefetchMain() {

    const worker = async () => { while (queue.length) await prefetchTab(queue.shift()); };
    await Promise.all([worker(), worker()]);

  async function go(tab, opt) {
    const quiet = !!(opt && opt.quiet);   // тихая перерисовка свежими данными: без «Загрузка…», прокрутка на месте
    if (quiet && current !== tab) return;
    current = tab;
    const nav = ++navSeq, y = window.scrollY;
    stopGameTimer();   // таймер викторины не тикает на другой вкладке
    try { localStorage.setItem("rofl_tab", tab); } catch (e) {}
    if (!quiet) { renderTabs(); window.scrollTo(0, 0); }
    // Каждое нажатие рисует в СВЕЖИЙ контейнер: медленный ответ прошлой вкладки допишет в старый, уже снятый
    // со страницы, и не перекроет новую (баг «нажал Склад — открылась Биржа»)
    const old = document.getElementById("app"), box = old.cloneNode(false);
    old.replaceWith(box);
    if (!quiet) box.innerHTML = '<div class="loading">' + L.loading + '</div>';
    box.dataset.cols = VIEW_COLS[tab] || 2;
    const vc = NO_CACHE_TABS.indexOf(tab) < 0 ? { used: new Set() } : null;
    viewCache = vc;
    try {
      await VIEWS[tab](box);
      bindPagers(box);
    } catch (e) {
      if (window.console) console.error("[tab " + tab + "]", e);   // причина в консоли — для отладки
      if (e && e.status === 503) box.innerHTML = '<div class="err">' + L.featureOff + '</div>';
      else box.innerHTML = '<div class="err">' + L.error + '</div>';
    } finally {
      if (viewCache === vc) viewCache = null;
    }
    if (quiet) window.scrollTo(0, y);
    else if (vc && vc.used.size && nav === navSeq) revalidate(tab, nav, Array.from(vc.used));
  }

  function rr(x, a, b, w, h, r) {
    x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r);
    x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath();
  }
  const clip = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
  // Неоновая карточка 1080×1920 (формат Историй). JPEG — чтобы уложиться в лимит загрузки.
  function drawAchCard(c) {
    const W = 1080, H = 1920, cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const x = cv.getContext("2d"), F = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#0b0620"); g.addColorStop(.55, "#1a0b3a"); g.addColorStop(1, "#04121f");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.strokeStyle = "rgba(0,255,225,.07)"; x.lineWidth = 2;
    for (let i = 0; i <= W; i += 90) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); }
    for (let j = 0; j <= H; j += 90) { x.beginPath(); x.moveTo(0, j); x.lineTo(W, j); x.stroke(); }
    x.textAlign = "center";
    x.shadowColor = "#ff4d8d"; x.shadowBlur = 40; x.fillStyle = "#ff6fa5"; x.font = "900 112px " + F; x.fillText("ROFL HUB", W / 2, 210);
    x.shadowColor = "#00ffe1"; x.shadowBlur = 22; x.fillStyle = "#bffff6"; x.font = "600 44px " + F; x.fillText(L.ac_cardSub, W / 2, 285);
    x.shadowBlur = 0; x.fillStyle = "#ffffff"; x.font = "800 72px " + F; x.fillText(clip(c.name, 22), W / 2, 430);
    x.fillStyle = "#ffd93d"; x.font = "600 46px " + F;
    x.fillText(["🧠 " + c.level, c.rank, c.vip ? "💎 " + c.vip : ""].filter(Boolean).join("  ·  "), W / 2, 510);
    if (c.team) { x.fillStyle = "#9fe8ff"; x.font = "500 40px " + F; x.fillText("🛡 " + clip(c.team.name, 26), W / 2, 575); }
    ACH.forEach((a, i) => {
      const bx = 90 + (i % 2) * 470, by = 650 + Math.floor(i / 2) * 250, bw = 430, bh = 210, col = i % 2 ? "0,255,225" : "255,77,141";
      x.fillStyle = "rgba(255,255,255,.06)"; rr(x, bx, by, bw, bh, 34); x.fill();
      x.shadowColor = "rgb(" + col + ")"; x.shadowBlur = 18; x.strokeStyle = "rgba(" + col + ",.75)"; x.lineWidth = 4;
      rr(x, bx, by, bw, bh, 34); x.stroke(); x.shadowBlur = 0;
      x.fillStyle = "#ffffff"; x.font = "60px " + F; x.fillText(a[1], bx + bw / 2, by + 78);
      x.font = "800 64px " + F; x.fillText(num(c[a[0]]), bx + bw / 2, by + 150);
      x.fillStyle = "#b9b3d6"; x.font = "500 32px " + F; x.fillText(clip(L["ac_" + a[0]], 24), bx + bw / 2, by + 192);
    });
    x.fillStyle = "#ffffff"; x.font = "800 50px " + F; x.fillText(L.ac_cardCall, W / 2, 1740);
    x.fillStyle = "#00ffe1"; x.font = "500 36px " + F; x.fillText(String(c.link || "").replace(/^https:\/\//, ""), W / 2, 1810);
    return cv.toDataURL("image/jpeg", .9);
  }

  function fridgeSvg(cap) {
    const lvl = cap >= 100 ? 3 : cap >= 50 ? 2 : cap >= 10 ? 1 : 0;

      '<line x1="' + x0 + '" y1="22" x2="' + (x0 + w) + '" y2="22" stroke="' + col + '" stroke-width="1.5" opacity=".7"/>';
    for (let i = 1; i < doors; i++) { const x = x0 + w * i / doors; s += '<line x1="' + x + '" y1="6" x2="' + x + '" y2="58" stroke="' + col + '" stroke-width="1.5" opacity=".7"/>'; }
    for (let i = 0; i < doors; i++) { const x = x0 + w * (i + 1) / doors - 4; s += '<rect x="' + x + '" y="26" width="2" height="9" rx="1" fill="' + col + '"/><rect x="' + x + '" y="11" width="2" height="6" rx="1" fill="' + col + '"/>'; }

    if (ib) ib.onclick = () => act(ib, "/api/intern", {}, async () => { notify(L.internDone); await refreshMe(); go("farm"); });
    document.getElementById("openFarmBtn").onclick = () => openScene(me);
    box.querySelectorAll("[data-fridge]").forEach(b => { b.onclick = () => buy(b.dataset.fridge, b); });
    startFridgeFlip(box);
    ["refOne", "refAll"].forEach(id => {
      const b = document.getElementById(id);
      b.onclick = () => act(b, "/api/refuel", { mode: id === "refOne" ? "one" : "all" },
        async res => { notify(fmt(L.refueled, { n: res.loaded })); await refreshMe(); go("farm"); });
    });
    bindShopLinks();
  }
  function bindShopLinks() {
    document.querySelectorAll(".goShop").forEach(b => { b.onclick = () => { shopCat = "farm"; go("shop"); }; });
  }
  // CTA-триггеры: покупка предлагается в момент «боли»
  function buildCta(f) {
    const box = (kind, text) =>
      '<div class="cta ' + kind + '"><span>' + text + '</span><button class="goShop">' + L.ctaShopBtn + '</button></div>';
    if (f.junior + f.premium === 0) return box("red", L.ctaNoRobots);
    if (f.premium > 0 && f.premium_fueled < f.premium && f.fridge === 0 && f.inv_cutlets === 0)
      return box("red", fmt(L.ctaHungry, { n: f.premium - f.premium_fueled }));
    if (f.premium > 0 && f.fridge + f.inv_cutlets < f.premium) return box("yellow", L.ctaLowFuel);
    return "";
  }
  function setupBonusButton(secondsLeft) {
    const btn = document.getElementById("bonusBtn");
    if (!btn) return;
    function show(left) {
      btn.disabled = left > 0;
      btn.textContent = left > 0 ? fmt(L.bonusWait, { h: Math.floor(left / 3600), m: Math.floor(left % 3600 / 60) }) : L.bonusReady;
    }
    show(secondsLeft);
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const res = await post("/api/bonus", {});
        if (res.ok) { notify(L.bonusDone); await refreshMe(); go("farm"); } else show(res.seconds_left);
      } catch (e) { show(1); }
    };
  }

  // ================= 🎯 Цели =================
  function goalsCard(g) {
    const list = g.goals.map(x => {
      const pct = Math.min(100, Math.round(x.progress / x.target * 100));
      return '<div class="goal' + (x.progress >= x.target ? ' ok' : '') + '"><div class="gh"><div class="gt">' +
        (x.progress >= x.target ? "✅ " : "⬜ ") + esc(x.title) + '</div><div class="gp">' + x.progress + '/' + x.target + '</div></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
    }).join("");
    let action;
    if (g.claimed) action = '<div class="hint ok-text">' + L.goals_claimed + '</div>';
    else action = '<button class="btn scene-btn" id="chestBtn"' + (g.done ? '' : ' disabled') + '>' + L.goals_claim + '</button>';
    return card(L.goals_title, list + action +
      '<div class="hint">' + fmt(L.goals_chest, { c: g.chest_coins, r: g.chest_res }) + '</div>' +
      '<div class="hint">' + fmt(L.goals_streak, { s: g.streak, e: g.every, b: g.streak_bonus }) + '</div>' +
      '<div class="hint">' + L.goals_reset + '</div>');
  }
  function bindGoals(root) {
    const cb = root.querySelector("#chestBtn");
    if (cb) cb.onclick = () => act(cb, "/api/goals/claim", {}, async res => {
      notify(fmt(L.goals_got, { c: res.coins, q: res.qty, n: res.res_name, s: res.streak }) + (res.special ? "\n+ " + bundle(res.special) : ""));
      await refreshMe(); go("passport");
    });
  }

  // ================= 🔧 Мастерская =================
  // Сила одного боевого дрона (числа — shared/economy.py, приходят с витриной мастерской)
  let DRONE_FX = {};
  async function viewWorkshop(box) {
    const w = await api("/api/workshop");
    DRONE_FX = w.drone_fx || {};
    const recipes = w.recipes.map(r => {
      const cost = costChips(r.cost, w.stock) +
        (r.coins ? '<span class="chip ' + (w.balance >= r.coins ? 'have' : 'lack') + '">🪙 ' + num(w.balance) + '/' + num(r.coins) + '</span>' : '');
      const btn = r.done ? '<span class="owned">' + L.ws_owned + '</span>'
        : r.locked ? '<span class="lockline">🔒</span>'
        : '<button class="mini craft" data-id="' + r.id + '"' + (r.affordable ? '' : ' disabled') + '>' + L.ws_craft + '</button>';
      // Новичку рецепты открываются по одному в сутки — закрытые серые, со временем до открытия
      const extra = (r.locked ? '<div class="lockline">' + fmt(L.ws_locked, { t: dur(r.unlock_in) }) + '</div>' : '') +
        (r.week_limit ? '<div class="hint">' + fmt(L.wk_left, { n: r.week_left, m: r.week_limit }) + '</div>' : '') +
        (r.stored && !r.locked ? '<div class="hint">' + L.ws_toStorage + '</div>' : '') +
        (r.tool && !r.locked ? '<div class="hint' + (r.tool_ok ? '' : ' status-bad') + '">' + fmt(L.ws_needTool, { t: TOOL_ICON[r.tool] + ' ' + L["tool_" + r.tool] }) + '</div>' : '') +
        (r.team ? '<div class="hint' + (r.team_ok ? '' : ' status-bad') + '">' + (r.team_ok ? fmt(L.ws_teamItem, { x: w.team_mult }) : L.it_needTeam) + '</div>' : '');
      // дрона можно купить за монеты сразу — его карточка не сереет, замок только на сборке
      return '<div class="recipe' + (r.affordable ? ' ready' : '') + (r.locked && !r.drone ? ' locked' : '') + '"><div class="rh"><b>' + esc(r.title) + '</b>' + btn + '</div>' +
        '<div class="hint">' + (r.drone ? fmt(L["dr_eff_" + r.drone], DRONE_FX) : (L["eff_" + r.effect] || "")) + '</div>' + extra +
        (r.drone ? '<div class="hint">' + fmt(L.dr_have, { n: (w.drones || {})[r.drone] || 0 }) + '</div>' : '') +
        (r.done ? '' : '<div class="chips">' + cost + '</div>') +
        (r.buy_coins ? '<button class="mini ghost dbuy" data-k="' + r.drone + '"' + (w.balance >= r.buy_coins ? '' : ' disabled') + '>' +
          fmt(L.dr_buy, { c: num(r.buy_coins) }) + '</button>' : '') + '</div>';
    }).join("");
    const weekly = (w.weekly || []).map(r => {
      const cost = RES.filter(k => r.cost[k]).map(k =>
        '<span class="chip ' + ((w.stock[k] || 0) >= r.cost[k] ? 'have' : 'lack') + '">' +
        RES_ICON[k] + ' ' + num(w.stock[k] || 0) + '/' + r.cost[k] + '</span>').join("");
      return '<div class="recipe weekly' + (r.affordable ? ' ready' : '') + '"><div class="rh"><b>' + esc(r.title) + '</b>' +
        '<button class="mini wcraft" data-id="' + r.id + '"' + (r.affordable ? '' : ' disabled') + '>' + L.ws_craft + '</button></div>' +
        '<div class="hint">' + fmt(L.wk_left, { n: r.left, m: r.limit }) + '</div><div class="chips">' + cost + '</div></div>';
    }).join("");
    box.innerHTML = (weekly ? '<div class="card hot span-all"><h2>' + L.wk_title + '</h2><div class="hint">' + L.wk_hint + '</div>' +
      '<div class="recipes">' + weekly + '</div></div>' : '') +
      card(L.ws_title,
      '<div class="chips big">' + resLine(w.stock) + '</div>' +
      '<div class="hint">' + fmt(L.st_cap, { c: num(w.capacity) }) + '</div>' +
      '<div class="hint">' + L.ws_hint + '</div>' +
      row(L.ws_armor, fmt(L.ws_armorLvl, { l: w.armor_level, m: w.armor_max, p: w.armor_pct })) +
      (w.armor_until ? '<div class="hint">' + fmt(L.ws_armorUntil, { t: new Date(w.armor_until).toLocaleString(me.lang === "ru" ? "ru-RU" : "en-GB",
        { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) }) + '</div>' : '') +
      '<div class="hint">' + fmt(w.has_shuttle ? L.ws_shuttleOn : L.ws_shuttleOff,
        { fee: w.has_shuttle ? w.shuttle_fee : w.market_fee }) + '</div>') +
      card(L.resources + " · " + L.resWhere, RES_ALL.map(k => row(RES_ICON[k] + " " + esc(w.res_names[k] || k), L["res_" + k + "_src"] || "")).join("")) +
      '<div class="recipes">' + recipes + '</div>';
    document.querySelectorAll(".wcraft").forEach(b => {
      b.onclick = () => act(b, "/api/craft_weekly", { recipe: b.dataset.id }, async res => {
        notify(res.stored ? L.it_stored : L.ws_crafted); await refreshMe(); go("workshop");
      });
    });
    document.querySelectorAll(".dbuy").forEach(b => {
      b.onclick = () => act(b, "/api/drone/buy", { kind: b.dataset.k }, async () => { notify(L.dr_bought); await refreshMe(); go("workshop"); });
    });
    document.querySelectorAll(".craft").forEach(b => {
      b.onclick = () => act(b, "/api/craft", { recipe: b.dataset.id }, async res => {
        notify(res.stored ? L.it_stored : L.ws_crafted); await refreshMe(); go("workshop");
      });
    });
  }

  // ================= 🏴‍☠️ Налёты =================
  const MOVES = ["rock", "scissors", "paper"];
  const dateShort = iso => new Date(iso).toLocaleString(me.lang === "ru" ? "ru-RU" : "en-GB",
    { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  // Обратный отсчёт «ЧЧ:ММ:СС» (часы могут быть больше 24 — щит на неделю = 167:59:59)
  function hms(ms) {
    const sec = Math.max(0, Math.floor(ms / 1000)), p = n => String(n).padStart(2, "0");
    return p(Math.floor(sec / 3600)) + ":" + p(Math.floor(sec % 3600 / 60)) + ":" + p(sec % 60);
  }
  let shieldTick = null;
  // «1 д 5 ч» / «5 ч 12 мин» / «12 мин» — сколько ждать
  function dur(sec) {
    const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.max(1, Math.ceil(sec % 3600 / 60));
    return d ? fmt(L.durDH, { d: d, h: h }) : h ? fmt(L.durHM, { h: h, m: m % 60 }) : fmt(L.durM, { m: m });
  }
  async function viewRaids(box) {
    const d = await api("/api/raids");
    const R = d.rules;
    const fuelOk = (d.stock.hydrogen || 0) >= R.fuel;
    // Корабль без топлива не «готов к вылету», даже если перезарядка закончилась
    const ship = !fuelOk ? '<div class="hint status-bad">' + L.raid_noFuel + '</div>'
      : d.cooldown_left > 0 ? '<div class="hint">' + fmt(L.raid_cooldown, { m: Math.ceil(d.cooldown_left / 60) }) + '</div>'
      : '<div class="hint status-ok">' + L.raid_ready + '</div>';
    const stance = MOVES.map(m => '<button class="mv' + (d.stance === m ? ' on' : '') + '" data-st="' + m + '">' + L[m] + '</button>').join("");
    const revenge = d.revenge.map(r => '<button class="btn danger rv" data-id="' + r.raid_id + '" data-name="' + esc(r.name) + '">' +
      fmt(L.raid_revengeBtn, { name: esc(r.name) }) + ' · ' + bundle(r.loot) + '</button>').join("");
    const sh = d.shield, shOn = !!sh.active, shUntil = sh.until ? new Date(sh.until).getTime() : null;
    // Что «наготове» на следующий вылет и что охраняет склад (изделия со склада)
    const ch = d.charges || {}, gd = d.guards || {};
    const armed = [ch.economizer ? '⛽ ' + L.it_economizer + ' ×' + ch.economizer : '', ch.cargo ? '📦 ' + L.it_cargo + ' ×' + ch.cargo : '']
      .filter(Boolean).join(" · ");
    const guards = ["camo", "trap", "drill"].filter(k => gd[k]).map(k =>
      '<div class="hint status-ok">' + IT_ICON[k] + ' ' + fmt(L.raid_guardUntil, { n: L["it_" + k], t: dateShort(gd[k]) }) + '</div>').join("");
    const fs = d.forsage || {};
    const forsageBtn = d.cooldown_left > 0 && fs.qty > 0 && fs.ready
      ? '<button class="btn ghost" id="forsageBtn">' + fmt(L.raid_forsageBtn, { n: fs.qty }) + '</button>' : '';
    const shieldCard = '<div class="card shield-card ' + (shOn ? 'on' : 'off') + '"><h2>' + L.raid_shieldTitle + '</h2>' +
      '<div class="sh-state">' + (shOn ? L.raid_shieldActive : L.raid_shieldInactive) + '</div>' +
      (shOn && !shUntil ? '<div class="balance small">' + L.raid_shieldNewbie + '</div>'
        : '<div class="sh-timer" id="shTimer">' + (shUntil ? hms(shUntil - Date.now()) : "00:00:00") + '</div>') +
      (shUntil ? '<div class="hint">' + fmt(L.raid_shieldOn, { t: dateShort(sh.until) }) + '</div>' : '') +
      (sh.dome ? '<div class="hint status-ok">' + fmt(L.raid_domeOn, { t: dateShort(sh.dome) }) + '</div>' : '') + guards +
      '<div class="hint">' + L.raid_shieldHint + '</div>' +
      (shOn ? '' : '<button class="btn ghost" id="shStore">' + L.raid_toStorage + '</button>') + '</div>';
    box.innerHTML =
      '<div class="card"><div class="card-head"><h2>' + L.raid_title + '</h2>' +
        '<span class="fuel-pill' + (fuelOk ? '' : ' low') + '">💧 ' + num(d.stock.hydrogen) + ' / ' + R.fuel + '</span></div>' +
        ship + (armed ? '<div class="hint status-ok">' + fmt(L.raid_armed, { l: armed }) + '</div>' : '') +
        // Технологии (27.10): без 📡🔭⚔️ первого уровня налётов нет; топливо налёта — водород, батарейки не нужны
        '<div class="chips">' + ["comm", "scout", "attack", "defense"].map(k => '<span class="chip ' + (d.tech[k] || k === "defense" ? 'have' : 'lack') + '">' +
          TECH_ICON[k] + ' ' + d.tech[k] + '</span>').join("") + '</div>' +
        (["comm", "scout", "attack"].some(k => !d.tech[k]) ? '<div class="hint status-bad">' + L.raid_needTech + '</div><button class="btn ghost" data-go="lab">' + L.raid_toLab + '</button>' : '') +
        '<div class="hint">' + fmt(L.raid_scoutInfo, { n: d.candidates }) + '</div>' +
        '<div class="hint ' + (d.meds ? 'status-ok' : '') + '">' + (d.meds ? fmt(L.raid_medsOn, { t: dateShort(d.meds) }) : L.raid_medsOff) + '</div>' +
        '<div class="hint">' + fmt(L.raid_stats, { a: d.stats.attacks, w: d.stats.attack_wins, h: d.stats.defense_holds, d: d.stats.defenses }) + '</div>' +
        forsageBtn +
        '<button class="btn scene-btn" id="scoutBtn">' + L.raid_scout + '</button>' +
        '<div id="raidStage"></div></div>' +
      shieldCard +
      (revenge ? card(L.raid_revenge, revenge) : '') +
      card(L.raid_stance, '<div class="moves">' + stance + '</div><div class="hint">' +
        (d.stance ? L.raid_stanceHint : L.raid_stanceNone) + '</div>') +
      card(L.raid_how, '<ol class="rules">' +
        '<li>' + L.raid_rule1 + '</li>' +
        '<li>' + fmt(L.raid_rule2, { pct: R.loot_pct, cap: R.loot_cap, fpct: R.fail_pct, fcap: R.fail_cap }) + '</li>' +
        '<li>' + fmt(L.raid_rule3, { days: R.newbie_days }) + '</li>' +
        '<li>' + fmt(L.raid_rule4, { fuel: R.fuel, cd: R.cooldown_h, rh: R.revenge_h }) + '</li></ol>');
    clearInterval(shieldTick);
    if (shUntil) shieldTick = setInterval(() => {
      const el = document.getElementById("shTimer");
      if (!el) { clearInterval(shieldTick); return; }
      const left = shUntil - Date.now();
      el.textContent = hms(left);
      if (left <= 0) { clearInterval(shieldTick); go("raids"); }
    }, 1000);
    box.querySelectorAll("[data-go]").forEach(b => { b.onclick = () => go(b.dataset.go); });
    const shb = document.getElementById("shStore");
    if (shb) shb.onclick = () => go("storage");
    const fb = document.getElementById("forsageBtn");
    if (fb) fb.onclick = () => act(fb, "/api/item/use", { effect: "forsage", hours: 0 }, async () => {
      notify(L.it_forsaged); go("raids");
    });
    document.querySelectorAll(".mv[data-st]").forEach(b => {
      b.onclick = () => act(b, "/api/raid/stance", { stance: b.dataset.st }, async () => { notify(L.raid_stanceSaved); go("raids"); });
    });
    document.querySelectorAll(".rv").forEach(b => {
      b.onclick = () => pickMove(document.getElementById("raidStage"), { revenge: Number(b.dataset.id) }, b.dataset.name);
    });
    const sb = document.getElementById("scoutBtn");
    sb.onclick = () => act(sb, "/api/raid/scout", {}, async res => {
      sb.disabled = false;
      const stage = document.getElementById("raidStage");
      if (!res.targets.length) { stage.innerHTML = '<div class="hint">' + L.raid_noTargets + '</div>'; return; }
      stage.innerHTML = '<div class="sub2">' + L.raid_targets + '</div>' + res.targets.map(tg =>
        '<button class="target" data-slot="' + tg.slot + '" data-name="' + esc(tg.name) + '">🎯 ' + esc(tg.name) +
        (tg.rank ? ' <span class="rank">' + esc(tg.rank) + '</span>' : '') +
        '<span class="tr">' + fmt(L.raid_res, { n: tg.total }) + '</span></button>').join("");
      stage.querySelectorAll(".target").forEach(b => {
        b.onclick = () => pickMove(stage, { slot: Number(b.dataset.slot) }, b.dataset.name);
      });
    });
  }

  // ================= ⛏ Рудники: карта, битва за рудник, добыча команды =================
  const MINE_COLOR = { metal: "#c0c7d6", hydrogen: "#60a5fa", crystal: "#c084fc", parts: "#fbbf24", stone: "#a8a29e",
                       wood: "#d97706", energy: "#facc15" };
  let mineSel = null;
  function minePos(id, cols, rows) {
    // Детерминированная «карта»: сетка со смещением каждого рудника — выглядит живо, но не перекрывается
    const i = id - 1, c = i % cols, r = Math.floor(i / cols);
    const jx = ((id * 37) % 11 - 5) / 22, jy = ((id * 53) % 11 - 5) / 22;
    return { x: (c + 0.5 + jx) / cols * 100, y: 3 + (r + 0.5 + jy) / rows * 90 };   // снизу место под подпись «№»
  }
  async function viewMines(box) {
    const d = await api("/api/mines");
    const narrow = box.clientWidth < 560, cols = narrow ? 5 : 6, rows = Math.ceil(d.mines.length / cols);
    const battleBy = {}; d.battles.forEach(b => { (b.mine_ids || [b.mine_id]).forEach(id => { battleBy[id] = b; }); });
    const tiles = d.mines.map(m => {
      const p = minePos(m.id, cols, rows), held = !!m.team;
      const cls = 'mine ' + (held ? 'held' : 'free') + (m.mine ? ' mine-own' : '') + (m.target ? ' target' : '') + (mineSel === m.id ? ' sel' : '');
      return '<button class="' + cls + '" data-id="' + m.id + '" style="left:' + p.x.toFixed(2) + '%;top:' + p.y.toFixed(2) + '%;--mc:' + MINE_COLOR[m.kind] + '">' +
        (held ? '<i class="drop"></i><i class="drop"></i><i class="drop"></i>' : '') + RES_ICON[m.kind] +
        (m.target ? '<span class="tb">⚔️</span>' : held ? '<span class="tb">' + esc(m.team.symbol || '🏆') + '</span>' : '') +
        '<span class="no">№' + m.id + '</span></button>';
    }).join("");
    const terrain = '<svg class="terrain" viewBox="0 0 100 60" preserveAspectRatio="none">' +
      '<path d="M0 42 Q15 30 30 38 T60 34 T100 40" fill="none" stroke="#2c3d66" stroke-width=".5"/>' +
      '<path d="M0 22 Q20 12 40 20 T80 16 T100 22" fill="none" stroke="#3a2c5c" stroke-width=".5"/>' +
      '<path d="M0 52 Q25 46 50 52 T100 50" fill="none" stroke="#24405a" stroke-width=".4"/></svg>';
    const lock = d.battles.length ? '' : '<div class="map-lock">' + L.mn_closed + '</div>';
    const mapCard = '<div class="card span-all"><h2>' + L.mn_title + '</h2>' +
      '<div class="minemap" style="aspect-ratio:' + cols + ' / ' + (rows * (narrow ? 1.25 : 0.88)).toFixed(2) + '">' + terrain + tiles + lock + '</div>' +
      '<div class="hint" style="margin-top:8px">' + L.mn_pick + '</div></div>';
    const battleCards = d.battles.map(b => {
      const leaders = b.leaders.length ? b.leaders.map((x, i) => '<div class="lead-row' + (x.mine ? ' me' : '') + '"><b>' +
          ['🥇', '🥈', '🥉'][i] + ' ' + esc(x.name) + '</b><span>' + num(x.score) + '</span></div>').join("")
        : '<div class="hint">' + L.mn_noLeaders + '</div>';
      // 🔋 Заявка команды: за рудники бьются только команды, скинувшиеся батарейками
      const e = b.entry;
      const entry = !e ? '' : !e.allowed ? '<div class="hint status-bad">' + L.bt_notAllowed + '</div>'
        : e.registered ? '<div class="hint status-ok">' + L.bt_entered + '</div>'
        : '<div class="stres"><div class="row"><span class="k">' + fmt(L.bt_entry, { n: e.batteries, m: e.fee }) + '</span></div>' +
          '<div class="bar"><i style="width:' + Math.round(e.batteries / e.fee * 100) + '%"></i></div></div>' +
          '<button class="btn ghost btGive" data-b="' + b.id + '"' + (d.batteries > 0 ? '' : ' disabled') + '>' + fmt(L.bt_give, { n: d.batteries }) + '</button>';
      return card(fmt(b.started ? L.mn_battle : L.mn_soon, { t: esc(b.title), n: (b.mine_ids || [b.mine_id]).join(", №"), d: dateShort(b.starts_at) }),
        '<div class="hint">' + fmt(L.mn_nom, { n: esc(b.nomination) }) + '</div>' +
        '<div class="hint">' + fmt(L.mn_ends, { d: dateShort(b.ends_at) }) + '</div>' + entry +
        '<div class="hint">' + fmt(L.bt_info, { f: d.fee.team, fc: d.fee.clan }) + '</div>' +
        (b.started ? '<div class="sub2">' + L.mn_leaders + '</div>' + leaders : ''));
    }).join("");
    // Ход добычи на рудниках своей команды: сколько добыто всеми бойцами и сколько осталось
    const myMines = (d.my_mines || []).map(x => {
      const a = new Date(x.captured_at).getTime(), b = new Date(x.until).getTime(), pct = Math.min(100, Math.round((Date.now() - a) / (b - a) * 100));
      return '<div class="stres"><div class="row"><span class="k">' + fmt(L.mn_name, { n: x.id }) + ' · ' + RES_ICON[x.kind] + '</span><span class="v">' +
        fmt(L.mn_mined, { n: num(x.mined), i: RES_ICON[x.kind] }) + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="hint">' + fmt(L.mn_left, { t: dur(Math.max(0, (b - Date.now()) / 1000)) }) + '</div></div>';
    }).join("");
    const teamCard = card(L.mn_myTeam, d.in_team
      ? (d.my_income ? '<div class="balance small">' + fmt(L.mn_income, { n: d.my_income }) + '</div>' + myMines + '<div class="hint">' + L.mn_commNote + '</div>' : '<div class="hint">' + L.mn_noIncome + '</div>')
      : '<div class="hint">' + L.mn_noTeam + '</div><button class="btn ghost" data-go="team">' + L.mn_teamBtn + '</button>');
    const rules = card(L.mn_how, '<ol class="rules"><li>' + L.mn_rule1 + '</li><li>' +
      fmt(L.mn_rule2, { h: d.hold_hours, y: d.yield }) + '</li><li>' + L.mn_rule3 + '</li></ol>');
    box.innerHTML = mapCard + '<div class="card" id="mineInfo"><h2>' + L.mn_info + '</h2><div class="hint">' + L.mn_pick + '</div></div>' +
      battleCards + teamCard + rules;
    const info = id => {
      const m = d.mines.find(x => x.id === id), b = battleBy[id];
      let body = row(L.mn_res, RES_ICON[m.kind] + ' ' + esc(d.res_names[m.kind]));
      if (m.team) body += row(L.mn_holder, esc(m.team.symbol) + ' ' + esc(m.team.name) + (m.mine ? ' 🏆' : '')) +
        row(L.mn_untilL, dateShort(m.until)) + '<div class="hint status-ok">' + fmt(L.mn_pumping, { n: m.team.members * d.yield, i: RES_ICON[m.kind] }) + '</div>';
      else body += row(L.mn_holder, L.mn_free);
      body += b ? '<div class="hint status-ok">' + fmt(L.mn_targetOf, { t: esc(b.title) }) +
          (m.place ? ' · ' + fmt(L.mn_place, { p: m.place }) : '') + '</div>'
        : '<div class="hint">' + L.mn_closedOne + '</div>';
      document.getElementById("mineInfo").innerHTML = '<h2>' + fmt(L.mn_name, { n: id }) + '</h2>' + body;
    };
    box.querySelectorAll(".mine").forEach(el => {
      el.onclick = () => {
        mineSel = Number(el.dataset.id);
