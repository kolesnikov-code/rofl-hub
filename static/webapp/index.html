<style>
  :root {
    --bg: #0b0f1a;
    --card: #141a2e;
    --card2: #1a2240;
    --neon: #00ffe1;
    --accent: #ffd93d;
    --pink: #ff4d8d;
    --text: #e8ecff;
    --muted: #8a93b8;
    --ok: #37e85f;
    --bad: #ff5555;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    padding: 12px 12px 28px;
    min-height: 100vh;
  }
  .logo {
    text-align: center; font-weight: 900; font-size: 22px; letter-spacing: 3px;
    margin: 6px 0 2px; color: var(--neon);
    text-shadow: 0 0 18px rgba(0, 255, 225, .45);
  }
  .sub { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .card {
    background: linear-gradient(160deg, var(--card), var(--card2));
    border: 1px solid rgba(0, 255, 225, .14);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
  }
  .card h2 { font-size: 13px; letter-spacing: 1.5px; color: var(--neon); margin-bottom: 10px; }
  .balance { font-size: 34px; font-weight: 900; color: var(--accent); line-height: 1.1; }
  .balance small { font-size: 14px; color: var(--muted); font-weight: 500; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 14px; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 700; }
  .vip {
    display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px;
    background: rgba(255, 77, 141, .15); border: 1px solid var(--pink);
    color: var(--pink); font-size: 12px; font-weight: 800; letter-spacing: 1px;
  }
  .bar { height: 10px; background: #0d1326; border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
  .bar i {
    display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--neon), var(--accent));
    transition: width .6s ease;
  }
  .hint { color: var(--muted); font-size: 12px; }
  .btn {
    width: 100%; margin-top: 10px; padding: 13px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 800; letter-spacing: .5px; cursor: pointer;
    background: linear-gradient(90deg, var(--neon), #00b3ff); color: #04121c;
    box-shadow: 0 0 18px rgba(0, 255, 225, .35);
  }
  .btn:disabled { background: #2a3354; color: var(--muted); box-shadow: none; }
  .cta {
    border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 13px;
    font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .cta.red { background: rgba(255,85,85,.12); border: 1px solid rgba(255,85,85,.55); color: #ff8e8e; }
  .cta.yellow { background: rgba(255,217,61,.1); border: 1px solid rgba(255,217,61,.45); color: var(--accent); }
  .cta button {
    padding: 8px 12px; border: none; border-radius: 10px; background: var(--neon);
    color: #04121c; font-weight: 800; cursor: pointer; white-space: nowrap; font-size: 13px;
  }
  .shop-sub { color: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: 1.5px; margin-top: 12px; }
  .shop-item {
    width: 100%; margin-top: 8px; padding: 12px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(0,255,225,.28); background: #0d1326; color: var(--text);
    font-size: 14px; font-weight: 700; text-align: center;
  }
  .shop-item:disabled { opacity: .45; cursor: wait; }
  .status-ok { color: var(--ok); } .status-bad { color: var(--bad); }
  .top-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; border-bottom: 1px dashed rgba(138,147,184,.18); }
  .top-row:last-child { border-bottom: none; }
  .top-row .place { width: 28px; font-weight: 900; color: var(--accent); }
  .top-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-row .brain { color: var(--neon); font-weight: 700; }
  .rank { font-size: 11px; font-weight: 700; color: var(--accent); opacity: .85; }
  .top-row .bal { font-weight: 800; }
  .loading { text-align: center; color: var(--muted); padding: 50px 0; font-size: 15px; }
  .hidden { display: none !important; }
  .made-by { margin-top: 6px; }
  .made-by a { color: var(--neon); text-decoration: none; font-weight: 700; }
  .scene-btn { background: linear-gradient(90deg, var(--accent), #ff9d3d); color: #1a1200; box-shadow: 0 0 18px rgba(255,217,61,.35); }
  .scene-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .scene-head h2 { font-size: 14px; letter-spacing: 1.5px; color: var(--neon); }
  .back { padding: 8px 12px; border: 1px solid rgba(0,255,225,.35); border-radius: 10px; background: #0d1326; color: var(--text); font-weight: 700; cursor: pointer; }
  .mine { position: relative; height: 340px; border-radius: 16px; overflow: hidden; margin-bottom: 12px;
    background: linear-gradient(180deg, #070a16 0%, #0e1430 55%, #2b1b12 56%, #1a1009 100%);
    border: 1px solid rgba(0,255,225,.14); box-shadow: 0 4px 24px rgba(0,0,0,.4); }
  .sky i { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; opacity: .7; animation: twinkle 2.8s infinite; }
  @keyframes twinkle { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
  .moon { position: absolute; right: 24px; top: 22px; width: 42px; height: 42px; border-radius: 50%; background: #ffe9a3; box-shadow: 0 0 30px rgba(255,233,163,.55); }
  .hill { position: absolute; left: -10%; right: -10%; top: 46%; height: 60px; background: #1d1326; border-radius: 50% 50% 0 0; }
  .arch { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); width: 96px; height: 70px;
    background: #090612; border: 4px solid #6b4a2a; border-bottom: none; border-radius: 48px 48px 0 0; display: flex; align-items: flex-end; justify-content: center; font-size: 22px; padding-bottom: 6px; }
  .rails { position: absolute; left: 0; right: 0; top: 56%; height: 6px; background: repeating-linear-gradient(90deg, #8a93b8 0 14px, transparent 14px 26px); opacity: .5; }
  .units { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 10px; padding: 0 10px; flex-wrap: wrap; }
  .unit { width: 96px; text-align: center; background: rgba(13,19,38,.78); border: 1px solid rgba(0,255,225,.22); border-radius: 12px; padding: 6px 4px 6px; backdrop-filter: blur(2px); }
  .unit img { width: 64px; height: 64px; display: block; margin: 0 auto; animation: bob 2.2s ease-in-out infinite; }
  .unit.junior img { animation-duration: 1.9s; }
  .unit.premium img { animation: drill .22s linear infinite; }
  .unit.premium.idle img { animation: none; filter: grayscale(.8) brightness(.7); }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  @keyframes drill { 0% { transform: translate(0,0) } 25% { transform: translate(1px,-1px) } 50% { transform: translate(-1px,1px) } 75% { transform: translate(1px,1px) } 100% { transform: translate(0,0) } }
  .unit .cnt { font-weight: 900; color: var(--accent); font-size: 15px; }
  .unit .unm { font-size: 11px; color: var(--text); font-weight: 700; margin-top: 2px; }
  .unit .ust { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 13px; padding: 20px 30px; }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .coin { position: absolute; bottom: 120px; font-size: 18px; animation: rise 1.8s ease-out forwards; }
  @keyframes rise { 0% { transform: translateY(0) scale(.8); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(-150px) scale(1.15); opacity: 0 } }
  .mined { color: var(--ok); font-variant-numeric: tabular-nums; }
  .bar.fridge i { background: linear-gradient(90deg, #ff9d3d, var(--pink)); }
  .err { text-align: center; color: var(--bad); padding: 40px 10px; font-size: 15px; }
  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 10px; }

  async function api(path, opts) {
    const res = await fetch(path, Object.assign({
      headers: { "X-Telegram-Init-Data": initData, "Content-Type": "application/json" }
    }, opts || {}));
    if (!res.ok) throw { status: res.status, body: await res.json().catch(() => ({})) };
    return res.json();
  }

  function card(title, inner) {
    return '<div class="card"><h2>' + title + '</h2>' + inner + '</div>';
  }

  function render(me, top, shop) {
    L = I18N[me.lang] || I18N.ru;
    document.getElementById("subtitle").textContent = L.subtitle;
    document.getElementById("footer").innerHTML = esc(L.footer) +
      '<div class="made-by">' + esc(L.madeBy).replace("@mister_telebot",
        '<a href="https://t.me/mister_telebot">@mister_telebot</a>') + '</div>';
    currentMe = me;

    const q = me.quiz, f = me.farm;
    const pct = Math.min(100, Math.round(q.progress / q.required * 100));
    const vip = me.vip_aliases.map(a => '<span class="vip">💎 ' + esc(a) + '</span>').join(" ");

    let passport =
      '<div class="balance">' + me.balance.toLocaleString("ru-RU") + ' <small>' + L.coins + '</small></div>' +
      (vip ? '<div>' + vip + '</div>' : '') +
      (me.rank ? '<div class="row"><span class="k">' + L.rank + '</span><span class="v">' + esc(me.rank) + '</span></div>' : '') +
      '<div class="row"><span class="k">' + L.brain + '</span><span class="v">' + q.level + '</span></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="hint">' + fmt(L.toNext, { n: q.next_level, left: q.required - q.progress, reward: q.next_reward }) + '</div>';

    const boosts = [];
    if (f.boosts.nuclear_until) boosts.push("🔋 x5");
    if (f.boosts.nitrogen_until) boosts.push("❄️ +40%");
    if (f.boosts.drone_until) boosts.push("🛸");
    const burnout = f.nearest_burnout
      ? new Date(f.nearest_burnout).toLocaleString(me.lang === "ru" ? "ru-RU" : "en-GB",
          { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })
      : "—";
    const fuelCls = f.premium === 0 || f.premium_fueled === f.premium ? "status-ok" : "status-bad";

    let farm =
      '<div class="row"><span class="k">' + L.intern + '</span><span class="v">🤖 ' + f.intern + '</span></div>' +

      '<div class="row"><span class="k">' + L.fridge + '</span><span class="v">🥩 ' + f.fridge + ' / ' + f.fridge_capacity + '</span></div>' +

      '<div class="row"><span class="k">' + L.burnout + '</span><span class="v">🔥 ' + burnout + '</span></div>' +
      '<div class="row"><span class="k">' + L.boosts + '</span><span class="v">' + (boosts.join(" ") || L.none) + '</span></div>' +
      buildCta(f) +
      '<button class="btn scene-btn" id="openFarmBtn">' + L.openFarm + '</button>' +
      (f.intern_claimed ? '' : '<button class="btn" id="internBtn">' + L.activateIntern + '</button>') +
      '<button class="btn" id="bonusBtn"></button>';

    let teamHtml;
    if (me.team) {
      teamHtml =
        '<div class="row"><span class="k">' + (me.team.is_clan ? "👑 " + L.clan : L.teamLabel) + '</span>' +
        '<span class="v">' + esc(me.team.team_name) + '</span></div>' +
        '<div class="row"><span class="k">' + L.members + '</span><span class="v">' +
        me.team.members_count + ' / ' + me.team.max_members + '</span></div>' +
        (me.team.i_am_captain ? '<div class="hint">' + L.captain + '</div>' : '');
    } else {
      teamHtml = '<div class="hint">' + L.noTeam + '</div>';
    }

    const topHtml = top.top.map((p, i) =>
      '<div class="top-row"><span class="place">' + (["🥇", "🥈", "🥉"][i] || (i + 1) + ".") + '</span>' +
      '<span class="nm">' + esc(p.name) + (p.vip ? ' <span class="vip">💎</span>' : '') +
      (p.rank ? ' <span class="rank">' + esc(p.rank) + '</span>' : '') + '</span>' +
      '<span class="brain">🧠' + p.quiz_level + '</span>' +
      '<span class="bal">' + p.balance.toLocaleString("ru-RU") + '</span></div>'
    ).join("") || '<div class="hint">—</div>';

    const shopHtml =
      '<div class="hint">' + L.shopHint + '</div>' +
      '<div class="shop-sub">' + L.shopFarm + '</div>' + shop.farm.map(shopBtn).join("") +
      '<div class="shop-sub">' + L.shopGames + '</div>' + shop.games.map(shopBtn).join("");

    document.getElementById("app").innerHTML =
      card(L.passport, passport) + card(L.farm, farm) +
      '<div class="card" id="shop"><h2>' + L.shop + '</h2>' + shopHtml + '</div>' +
      card(L.team, teamHtml) + card(L.top, topHtml);

    setupBonusButton(f.bonus_seconds_left);
    setupInternButton();
    const openBtn = document.getElementById("openFarmBtn");
    if (openBtn) openBtn.onclick = function () { openScene(me); };
    document.querySelectorAll(".shop-item").forEach(btn => {
      btn.onclick = () => buy(btn.dataset.sku, btn);
    });
    document.querySelectorAll(".goShop").forEach(btn => {
      btn.onclick = () => document.getElementById("shop").scrollIntoView({ behavior: "smooth" });
    });
  }

  function shopBtn(item) {
    return '<button class="shop-item" data-sku="' + esc(item.sku) + '">' + esc(item.label) + '</button>';
  }

  // CTA-триггеры: покупка предлагается в момент «боли», а не просто так
  function buildCta(f) {
    const box = (kind, text) =>
      '<div class="cta ' + kind + '"><span>' + text + '</span><button class="goShop">' + L.ctaShopBtn + '</button></div>';
    if (f.junior + f.premium === 0) return box("red", L.ctaNoRobots);
    if (f.premium > 0 && f.premium_fueled < f.premium && f.fridge === 0 && f.inv_cutlets === 0)
      return box("red", fmt(L.ctaHungry, { n: f.premium - f.premium_fueled }));
    if (f.premium > 0 && f.fridge + f.inv_cutlets < f.premium) return box("yellow", L.ctaLowFuel);
    return "";
  }

  // Покупка из Mini App: сервер создаёт Stars-инвойс, Telegram открывает оплату нативно
  async function buy(sku, btn) {
    if (!tg || !tg.openInvoice) {
      if (tg && tg.showAlert) tg.showAlert(L.oldClient); else alert(L.oldClient);
      return;
    }
    btn.disabled = true;
    try {
      const res = await api("/api/invoice", { method: "POST", body: JSON.stringify({ sku: sku }) });
      tg.openInvoice(res.link, function (status) {
        btn.disabled = false;
        if (status === "paid") {
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
          if (tg.showAlert) tg.showAlert(L.paid);
          setTimeout(load, 1500);
        } else if (status === "failed") {
          if (tg.showAlert) tg.showAlert(L.payFail);
        }
      });
    } catch (e) {
      btn.disabled = false;
      const msg = (e.body && e.body.error && e.status === 400) ? e.body.error : L.payFail;
      if (tg && tg.showAlert) tg.showAlert(msg); else alert(msg);
    }
  }

  // ================= ВИЗУАЛЬНАЯ ФЕРМА: шахта, юниты, живой счётчик =================
  let currentMe = null, sceneTimer = null, coinTimer = null, minedVisit = 0;

  function unitCard(kind, n, fueled) {
    let status;
    if (kind === "premium") status = fueled === n ? "⚡ " + L.fueledAll : "🔴 " + fmt(L.fueledPart, { a: fueled, b: n });
    else if (kind === "intern") status = "♾ " + L.eternal;
    else status = "⏳ " + L.license;
    const idle = kind === "premium" && fueled === 0 ? " idle" : "";   // серые — только при полной остановке
    return '<div class="unit ' + kind + idle + '">' +
      '<img src="/img/robots/' + kind + '.png" alt="" onerror="this.onerror=null;this.src=\'/img/robots/' + kind + '.svg\'">' +
      '<div class="cnt">×' + n + '</div><div class="unm">' + L["unit_" + kind] + '</div>' +
      '<div class="ust">' + status + '</div></div>';
  }

  function openScene(me) {
    const f = me.farm;
    let units = "";
    if (f.premium) units += unitCard("premium", f.premium, f.premium_fueled);
    if (f.junior) units += unitCard("junior", f.junior, f.junior);
    if (f.intern) units += unitCard("intern", f.intern, f.intern);
    if (!units) units = '<div class="empty">' + L.emptyFarm + '</div>';
    const fridgePct = f.fridge_capacity ? Math.round(f.fridge / f.fridge_capacity * 100) : 0;
    const stars = Array.from({ length: 26 }, function (_, i) {
      return '<i style="left:' + ((i * 37) % 100) + '%;top:' + ((i * 53) % 55) + '%;animation-delay:' + (i % 7) * .4 + 's"></i>';
    }).join("");
    document.getElementById("scene").innerHTML =
      '<div class="scene-head"><button class="back" id="sceneBack">' + L.back + '</button><h2>' + L.farmScene + '</h2></div>' +
      '<div class="mine"><div class="sky">' + stars + '</div><div class="moon"></div>' +
      '<div class="hill"></div><div class="arch"><span>⛏</span></div><div class="rails"></div>' +
      '<div class="units" id="units">' + units + '</div><div class="fx" id="coinsFx"></div></div>' +
      '<div class="card scene-stats">' +
      '<div class="row"><span class="k">' + L.speed + '</span><span class="v">' + fmt(L.perHour, { v: "+" + f.speed_hour }) + '</span></div>' +
      '<div class="row"><span class="k">' + L.minedVisit + '</span><span class="v mined" id="minedVisit">+0.00</span></div>' +
      '<div class="row"><span class="k">' + L.fridge + '</span><span class="v">🥩 ' + f.fridge + ' / ' + f.fridge_capacity + '</span></div>' +
      '<div class="bar fridge"><i style="width:' + fridgePct + '%"></i></div>' +
      '<div class="row"><span class="k">' + L.inv + '</span><span class="v">' + f.inv_cutlets + '</span></div>' +
      buildCta(f) +
      (f.intern_claimed ? '' : '<button class="btn" id="internBtn2">' + L.activateIntern + '</button>') +
      '</div>';
    document.getElementById("app").classList.add("hidden");
    document.getElementById("scene").classList.remove("hidden");
    window.scrollTo(0, 0);
    document.getElementById("sceneBack").onclick = closeScene;
    if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeScene); }
    const ib = document.getElementById("internBtn2");
    if (ib) ib.onclick = async function () {
      ib.disabled = true;
      try { await api("/api/intern", { method: "POST" }); ib.textContent = L.internDone; setTimeout(function () { closeScene(); load(); }, 900); }
      catch (e) { ib.disabled = false; }
    };
    document.querySelectorAll("#scene .goShop").forEach(function (b) {
      b.onclick = function () { closeScene(); setTimeout(function () { document.getElementById("shop").scrollIntoView({ behavior: "smooth" }); }, 50); };
    });
    // Живой счётчик: монеты капают на глазах, пока открыта сцена
    minedVisit = 0;
    const perTick = f.speed_hour / 3600 / 10;
    clearInterval(sceneTimer);
    sceneTimer = setInterval(function () {
      minedVisit += perTick;
      const el = document.getElementById("minedVisit");
      if (el) el.textContent = "+" + minedVisit.toFixed(2);
    }, 100);
    clearInterval(coinTimer);
    if (f.speed_hour > 0) coinTimer = setInterval(spawnCoin, Math.max(350, 5000 / (f.speed_hour / 5 + 1)));
  }

  function spawnCoin() {
    const box = document.getElementById("coinsFx");
    if (!box) return;
    const c = document.createElement("span");
    c.className = "coin";
    c.textContent = "🪙";
    c.style.left = (10 + Math.random() * 80) + "%";
    box.appendChild(c);
    setTimeout(function () { c.remove(); }, 1800);
  }

  function closeScene() {
    clearInterval(sceneTimer); clearInterval(coinTimer);
    document.getElementById("scene").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    if (tg && tg.BackButton) { tg.BackButton.offClick(closeScene); tg.BackButton.hide(); }
  }

  function setupInternButton() {
    const btn = document.getElementById("internBtn");
    if (!btn) return;
    btn.onclick = async function () {
      btn.disabled = true;
      try {
        const res = await api("/api/intern", { method: "POST" });
        if (res.ok || res.error === "already") {
          btn.textContent = L.internDone;
          setTimeout(load, 900);
        } else { btn.disabled = false; }
      } catch (e) { btn.disabled = false; }
    };
  }

  function setupBonusButton(secondsLeft) {
    const btn = document.getElementById("bonusBtn");
    function show(left) {
      if (left <= 0) {
        btn.disabled = false;
        btn.textContent = L.bonusReady;
      } else {
        btn.disabled = true;
        btn.textContent = fmt(L.bonusWait, { h: Math.floor(left / 3600), m: Math.floor(left % 3600 / 60) });
      }
    }
    show(secondsLeft);
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const res = await api("/api/bonus", { method: "POST", body: "{}" });
        if (res.ok) {
          btn.textContent = L.bonusDone;
          if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
          setTimeout(load, 1200);
        } else {
          show(res.seconds_left);
        }
      } catch (e) { show(1); }
    };
  }

  async function load() {
    try {
      const [me, top, shop] = await Promise.all([api("/api/me"), api("/api/top"), api("/api/shop")]);
      render(me, top, shop);
    } catch (e) {
      const code = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user &&
                    tg.initDataUnsafe.user.language_code) || "ru";
      L = I18N[code] || (code === "ru" ? I18N.ru : I18N.en);
      let msg = L.error;
      if (e.status === 401) msg = L.outside;
      else if (e.status === 404) msg = L.noProfile;
      else if (e.status === 403) msg = L.blocked;
      document.getElementById("app").innerHTML = '<div class="err">' + msg + '</div>';
    }
  }

  if (!initData) {
    document.getElementById("app").innerHTML = '<div class="err">' + I18N.ru.outside + '</div>';
  } else {
    load();
  }
})();
</script>
</body>
</html>
