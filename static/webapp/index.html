<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ROFL HUB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b0f1a;
    --card: #141a2e;
    --card2: #1a2240;
    --neon: #00ffe1;
    --accent: #ffd93d;
    --pink: #ff4d8d;
    --text: #e8ecff;
    --muted: #8a93b8;
    --ok: #37e85f;
    --bad: #ff5555;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    padding: 12px 12px 28px;
    min-height: 100vh;
  }
  .logo {
    text-align: center; font-weight: 900; font-size: 22px; letter-spacing: 3px;
    margin: 6px 0 2px; color: var(--neon);
    text-shadow: 0 0 18px rgba(0, 255, 225, .45);
  }
  .sub { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .card {
    background: linear-gradient(160deg, var(--card), var(--card2));
    border: 1px solid rgba(0, 255, 225, .14);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
  }
  .card h2 { font-size: 13px; letter-spacing: 1.5px; color: var(--neon); margin-bottom: 10px; }
  .balance { font-size: 34px; font-weight: 900; color: var(--accent); line-height: 1.1; }
  .balance small { font-size: 14px; color: var(--muted); font-weight: 500; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 14px; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 700; }
  .vip {
    display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px;
    background: rgba(255, 77, 141, .15); border: 1px solid var(--pink);
    color: var(--pink); font-size: 12px; font-weight: 800; letter-spacing: 1px;
  }
  .bar { height: 10px; background: #0d1326; border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
  .bar i {
    display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--neon), var(--accent));
    transition: width .6s ease;
  }
  .hint { color: var(--muted); font-size: 12px; }
  .btn {
    width: 100%; margin-top: 10px; padding: 13px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 800; letter-spacing: .5px; cursor: pointer;
    background: linear-gradient(90deg, var(--neon), #00b3ff); color: #04121c;
    box-shadow: 0 0 18px rgba(0, 255, 225, .35);
  }
  .btn:disabled { background: #2a3354; color: var(--muted); box-shadow: none; }
  .cta {
    border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 13px;
    font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .cta.red { background: rgba(255,85,85,.12); border: 1px solid rgba(255,85,85,.55); color: #ff8e8e; }
  .cta.yellow { background: rgba(255,217,61,.1); border: 1px solid rgba(255,217,61,.45); color: var(--accent); }
  .cta button {
    padding: 8px 12px; border: none; border-radius: 10px; background: var(--neon);
    color: #04121c; font-weight: 800; cursor: pointer; white-space: nowrap; font-size: 13px;
  }
  .shop-sub { color: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: 1.5px; margin-top: 12px; }
  .shop-item {
    width: 100%; margin-top: 8px; padding: 12px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(0,255,225,.28); background: #0d1326; color: var(--text);
    font-size: 14px; font-weight: 700; text-align: center;
  }
  .shop-item:disabled { opacity: .45; cursor: wait; }
  .status-ok { color: var(--ok); } .status-bad { color: var(--bad); }
  .top-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; border-bottom: 1px dashed rgba(138,147,184,.18); }
  .top-row:last-child { border-bottom: none; }
  .top-row .place { width: 28px; font-weight: 900; color: var(--accent); }
  .top-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-row .brain { color: var(--neon); font-weight: 700; }
  .rank { font-size: 11px; font-weight: 700; color: var(--accent); opacity: .85; }
  .top-row .bal { font-weight: 800; }
  .loading { text-align: center; color: var(--muted); padding: 50px 0; font-size: 15px; }
  .hidden { display: none !important; }
  .made-by { margin-top: 6px; }
  .made-by a { color: var(--neon); text-decoration: none; font-weight: 700; }
  .scene-btn { background: linear-gradient(90deg, var(--accent), #ff9d3d); color: #1a1200; box-shadow: 0 0 18px rgba(255,217,61,.35); }
  .scene-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .scene-head h2 { font-size: 14px; letter-spacing: 1.5px; color: var(--neon); }
  .back { padding: 8px 12px; border: 1px solid rgba(0,255,225,.35); border-radius: 10px; background: #0d1326; color: var(--text); font-weight: 700; cursor: pointer; }
  .mine { position: relative; height: 340px; border-radius: 16px; overflow: hidden; margin-bottom: 12px;
    background: linear-gradient(180deg, #070a16 0%, #0e1430 55%, #2b1b12 56%, #1a1009 100%);
    border: 1px solid rgba(0,255,225,.14); box-shadow: 0 4px 24px rgba(0,0,0,.4); }
  .sky i { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; opacity: .7; animation: twinkle 2.8s infinite; }
  @keyframes twinkle { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
  .moon { position: absolute; right: 24px; top: 22px; width: 42px; height: 42px; border-radius: 50%; background: #ffe9a3; box-shadow: 0 0 30px rgba(255,233,163,.55); }
  .hill { position: absolute; left: -10%; right: -10%; top: 46%; height: 60px; background: #1d1326; border-radius: 50% 50% 0 0; }
  .arch { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); width: 96px; height: 70px;
    background: #090612; border: 4px solid #6b4a2a; border-bottom: none; border-radius: 48px 48px 0 0; display: flex; align-items: flex-end; justify-content: center; font-size: 22px; padding-bottom: 6px; }
  .rails { position: absolute; left: 0; right: 0; top: 56%; height: 6px; background: repeating-linear-gradient(90deg, #8a93b8 0 14px, transparent 14px 26px); opacity: .5; }
  .units { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 10px; padding: 0 10px; flex-wrap: wrap; }
  .unit { width: 96px; text-align: center; background: rgba(13,19,38,.78); border: 1px solid rgba(0,255,225,.22); border-radius: 12px; padding: 6px 4px 6px; backdrop-filter: blur(2px); }
  .unit img { width: 64px; height: 64px; display: block; margin: 0 auto; animation: bob 2.2s ease-in-out infinite; }
  .unit.junior img { animation-duration: 1.9s; }
  .unit.premium img { animation: drill .22s linear infinite; }
  .unit.premium.idle img { animation: none; filter: grayscale(.8) brightness(.7); }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  @keyframes drill { 0% { transform: translate(0,0) } 25% { transform: translate(1px,-1px) } 50% { transform: translate(-1px,1px) } 75% { transform: translate(1px,1px) } 100% { transform: translate(0,0) } }
  .unit .cnt { font-weight: 900; color: var(--accent); font-size: 15px; }
  .unit .unm { font-size: 11px; color: var(--text); font-weight: 700; margin-top: 2px; }
  .unit .ust { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 13px; padding: 20px 30px; }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .coin { position: absolute; bottom: 120px; font-size: 18px; animation: rise 1.8s ease-out forwards; }
  @keyframes rise { 0% { transform: translateY(0) scale(.8); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(-150px) scale(1.15); opacity: 0 } }
  .mined { color: var(--ok); font-variant-numeric: tabular-nums; }
  .bar.fridge i { background: linear-gradient(90deg, #ff9d3d, var(--pink)); }
  .err { text-align: center; color: var(--bad); padding: 40px 10px; font-size: 15px; }
  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 10px; }

  /* ---------- вкладки (23.10): приложение вместо простыней в чате ---------- */
  .tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 10px;
    margin: 0 -12px 8px; padding-left: 12px; padding-right: 12px; background: linear-gradient(180deg, var(--bg) 80%, rgba(11,15,26,0));
    scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(0,255,225,.25);
    background: #0d1326; color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .tab.on { background: linear-gradient(90deg, var(--neon), #00b3ff); color: #04121c; border-color: transparent;
    box-shadow: 0 0 14px rgba(0,255,225,.35); }
  .balance.small { font-size: 20px; margin: 4px 0; }
  .btn.ghost { background: #0d1326; color: var(--text); border: 1px solid rgba(0,255,225,.35); box-shadow: none; }
  .btn.danger { background: linear-gradient(90deg, #ff4d8d, #ff8e3d); color: #1a0008; box-shadow: none; font-size: 14px; }
  .two { display: flex; gap: 8px; } .two .btn { flex: 1; font-size: 13px; padding: 11px 6px; }
  .mini { margin-top: 6px; padding: 7px 12px; border: none; border-radius: 10px; font-weight: 800; font-size: 12px;
    cursor: pointer; background: linear-gradient(90deg, var(--neon), #00b3ff); color: #04121c; }
  .mini.ghost { background: #0d1326; color: var(--neon); border: 1px solid rgba(0,255,225,.35); }
  .mini:disabled { background: #2a3354; color: var(--muted); cursor: default; }
  .robot { display: flex; align-items: center; gap: 12px; padding: 10px; margin-bottom: 8px; border-radius: 14px;
    background: rgba(13,19,38,.7); border: 1px solid rgba(0,255,225,.18); }
  .robot img { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; flex: 0 0 auto;
    box-shadow: 0 0 16px rgba(0,255,225,.25); }
  .robot.premium img { box-shadow: 0 0 18px rgba(255,157,61,.45); }
  .robot.junior img { box-shadow: 0 0 18px rgba(0,179,255,.4); }
  .robot .rinfo { flex: 1; min-width: 0; }
  .robot .rname { font-weight: 800; font-size: 15px; }
  .robot .rrate { color: var(--accent); font-weight: 700; font-size: 13px; margin-top: 2px; }
  .robot .rstat { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .robot .rcount { font-size: 28px; font-weight: 900; color: var(--accent); min-width: 54px; text-align: right; }
  .robot.zero .rcount { color: var(--muted); }
  .res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 6px; }
  .res { text-align: center; padding: 10px 4px; border-radius: 12px; background: rgba(13,19,38,.7); border: 1px solid rgba(0,255,225,.15); }
  .res .ri { font-size: 22px; } .res .rn { font-weight: 900; font-size: 17px; color: var(--accent); }
  .res .rs { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips.big .chip { font-size: 14px; padding: 6px 10px; }
  .chip { padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; background: #0d1326;
    border: 1px solid rgba(138,147,184,.3); }
  .chip.have { color: var(--ok); border-color: rgba(55,232,95,.45); }
  .chip.lack { color: #ff8e8e; border-color: rgba(255,85,85,.45); }
  .recipe { padding: 12px 14px; margin-bottom: 10px; border-radius: 14px; background: linear-gradient(160deg, var(--card), var(--card2));
    border: 1px solid rgba(138,147,184,.18); }
  .recipe.ready { border-color: rgba(55,232,95,.5); box-shadow: 0 0 14px rgba(55,232,95,.15); }
  .recipe .rh { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
  .recipe .rh .mini { margin-top: 0; }
  .owned { color: var(--ok); font-weight: 800; font-size: 12px; white-space: nowrap; }
  .moves { display: flex; gap: 8px; margin-top: 6px; }
  .mv { flex: 1; padding: 12px 4px; border-radius: 12px; border: 1px solid rgba(0,255,225,.3); background: #0d1326;
    color: var(--text); font-weight: 800; font-size: 14px; cursor: pointer; }
  .mv.on { background: linear-gradient(90deg, var(--accent), #ff9d3d); color: #1a1200; border-color: transparent; }
  .target { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: 100%; margin-top: 8px; padding: 12px;
    border-radius: 12px; border: 1px solid rgba(255,77,141,.4); background: rgba(255,77,141,.08); color: var(--text);
    font-weight: 800; font-size: 14px; text-align: left; cursor: pointer; }
  .target .tr { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 600; }
  .sub2 { color: var(--accent); font-weight: 800; font-size: 13px; margin: 12px 0 4px; letter-spacing: .5px; }
  .rules { padding-left: 18px; color: var(--text); font-size: 13px; line-height: 1.45; }
  .rules li { margin-bottom: 6px; }
  .goal { padding: 8px 0; border-bottom: 1px dashed rgba(138,147,184,.18); }
  .goal .gh { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .goal .gt { font-weight: 700; font-size: 14px; } .goal .gp { color: var(--accent); font-weight: 800; white-space: nowrap; }
  .goal.ok .gt { color: var(--ok); }
  .ok-text { color: var(--ok); margin-top: 10px; }
  .offer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed rgba(138,147,184,.18); }
  .offer .ol { flex: 1; font-weight: 800; } .offer .mini { margin-top: 0; }
  .buyrow { width: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .lbl { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .lbl input { display: block; width: 100%; margin-top: 4px; padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(0,255,225,.3);
    background: #0d1326; color: var(--text); font-size: 16px; font-weight: 700; }
  .stres { margin-top: 8px; } .donrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .idxrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .card.hot { border-color: rgba(255,157,61,.55); box-shadow: 0 0 22px rgba(255,157,61,.18); }
  .swapcard { padding: 10px 12px; margin: 8px 0; border-radius: 12px; background: rgba(13,19,38,.7); border: 1px solid rgba(0,255,225,.18); }
  .swapcard .mini { width: 100%; margin-top: 8px; padding: 10px; }
  .card.hot h2 { color: #ffb15c; }
  .recipe.weekly { border-color: rgba(255,157,61,.35); }
  .reflink { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #0d1326; border: 1px dashed rgba(0,255,225,.4);
    font-family: monospace; font-size: 13px; word-break: break-all; user-select: all; }
  .res-grid.three { grid-template-columns: repeat(3, 1fr); }
  .top-row.me { background: rgba(255,217,61,.08); border-radius: 8px; }
  .idx { padding: 7px 10px; border-radius: 999px; border: 1px solid rgba(0,255,225,.25); background: #0d1326;
    color: var(--text); font-weight: 800; font-size: 12px; cursor: pointer; }
  .idx.on { border-color: var(--accent); box-shadow: 0 0 10px rgba(255,217,61,.35); }
  .idx .up { color: var(--ok); } .idx .down { color: #ff8e8e; }
  /* График — фиксированного размера: на широком экране не растягивается на всё окно */
  .chart { width: 100%; max-width: 480px; max-height: 180px; height: auto; display: block; margin: 0 auto; }
  .chart polyline { fill: none; stroke: var(--neon); stroke-width: 2.5; stroke-linejoin: round; }
  .chart circle { fill: var(--accent); }
  .chart text { fill: var(--muted); font-size: 9px; text-anchor: middle; }
  .swapform { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
  .lbl select { display: block; width: 100%; margin-top: 4px; padding: 11px 8px; border-radius: 10px;
    border: 1px solid rgba(0,255,225,.3); background: #0d1326; color: var(--text); font-size: 15px; font-weight: 700; }

  /* Длинные списки (лоты биржи, ТОП, рейтинги) — постранично на ЛЮБОМ экране */
  .pager { display: flex; flex-direction: column; flex: 1; }
  .pg-nav { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px;
    margin-top: auto; padding-top: 10px; }
  .pg-btn { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(0,255,225,.25); background: #0d1326; color: var(--text); font-weight: 800; font-size: 13px; }
  .pg-btn.on { background: var(--neon); color: #001a17; border-color: var(--neon); }
  .pg-btn:disabled { opacity: .35; cursor: default; }
  .pg-gap { color: var(--muted); padding: 0 2px; }
  .pg-count { width: 100%; text-align: center; color: var(--muted); font-size: 11px; }
  .doc { display: block; width: 100%; height: calc(100vh - 170px); min-height: 480px; border: 1px solid rgba(0,255,225,.14);
    border-radius: 16px; background: var(--bg); }
  .btn.danger-text { color: var(--bad); border-color: rgba(255,85,85,.45); }
  .info-item { padding: 8px 0; border-bottom: 1px dashed rgba(138,147,184,.18); }
  .info-item b { display: block; font-size: 13px; margin-bottom: 3px; }
  .info-item span { color: var(--muted); font-size: 12px; line-height: 1.4; }

  /* Компьютер и планшет: единая сетка плашек. Число колонок задаёт вкладка (data-cols):
     ≥1100px — до 3, 720–1099px — 2, уже 720px — одна колонка, как на телефоне.
     Плашки одного ряда — одной высоты; длинные списки внутри листаются страницами. */
  @media (min-width: 720px) {
    #app {
      display: grid; gap: 14px; align-items: stretch;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 1500px; margin: 0 auto;
    }
    #app[data-cols="1"] { grid-template-columns: minmax(0, 1fr); max-width: 820px; }
    #app > .card { margin-bottom: 0; display: flex; flex-direction: column; }
    #app > :not(.card), #app > .span-all { grid-column: 1 / -1; }   /* загрузка, ошибки, сетки плиток */
    #scene, #footer { max-width: 1000px; margin-left: auto; margin-right: auto; }
    /* Мастерская: рецепты — плитки одинаковой высоты, кнопка и цена внизу */
    .recipes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .recipes .recipe { margin-bottom: 0; display: flex; flex-direction: column; }
    .recipes .recipe .chips { margin-top: auto; padding-top: 8px; }
    .card .recipes { margin-top: 8px; }
  }
  @media (min-width: 720px) and (max-width: 1099px) {
    #app > .span-tablet { grid-column: 1 / -1; }    /* «Что даёт каждый товар» под двумя колонками */
  }
  @media (min-width: 1100px) {
    #app[data-cols="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
  <div class="logo">⚡ ROFL HUB</div>
  <div class="sub" id="subtitle">Mini App</div>
  <div class="tabs" id="tabs"></div>
  <div id="app"><div class="loading" id="loader">⏳ ...</div></div>
  <div id="scene" class="hidden"></div>
  <footer id="footer"></footer>

<script>
(function () {
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }
  const initData = tg ? tg.initData : "";

  const I18N = {
    ru: {
      subtitle: "твоя игровая империя в одном экране",
      tab_passport: "📋 Паспорт", tab_farm: "🚜 Ферма", tab_goals: "🎯 Цели", tab_workshop: "🔧 Мастерская",
      tab_raids: "🏴‍☠️ Налёты", tab_market: "📈 Биржа", tab_team: "🏆 Команда", tab_shop: "🏪 Магазин", tab_top: "👑 ТОП",
      passport: "📋 ПАСПОРТ ИГРОКА", coins: "🪙",
      brain: "🧠 Уровень интеллекта", toNext: "до уровня {n}: {left} верных ответов в викторине (+{reward} 🪙)",
      farm: "🚜 КИБЕР-ФЕРМА", robots: "Роботы (майнеры / бурильщики)",
      intern: "Роботы Стажёры (1 🪙/ч, вечные)", activateIntern: "🚀 АКТИВИРОВАТЬ РОБОТА СТАЖЁРА", claimIntern: "🎁 ЗАБРАТЬ СТАЖЁРА ({n})",

  // I18N_EXTRA_END
  Object.assign(I18N, I18N_EXTRA);

  // Словарь игрока поверх английского: недостающий в паке ключ не ломает экран
  let L = Object.assign({}, I18N.en, I18N.ru);
  function setLang(code) { L = Object.assign({}, I18N.en, I18N[code] || (code === "ru" ? I18N.ru : I18N.en)); }
  const fmt = (s, o) => String(s || "").replace(/\{(\w+)\}/g, (_, k) => (o[k] !== undefined ? o[k] : ""));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const num = n => Number(n || 0).toLocaleString("ru-RU");
  const RES = ["metal", "hydrogen", "crystal", "parts"];
  const RES_ICON = { metal: "⛏", hydrogen: "💧", crystal: "💎", parts: "⚙️" };
  const KINDS = ["intern", "junior", "premium"];   // от самого слабого к самому мощному
  const TABS = ["passport", "farm", "goals", "workshop", "raids", "market", "team", "friends", "shop", "top", "faq", "rules"];
  const TAB_FLAG = { goals: "goals", workshop: "workshop", raids: "raids", market: "market", shop: "shop" };

  async function api(path, opts) {
    const res = await fetch(path, Object.assign({
      headers: { "X-Telegram-Init-Data": initData, "Content-Type": "application/json" }
    }, opts || {}));
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw { status: res.status, body: body };
    return body;
  }
  const post = (path, data) => api(path, { method: "POST", body: JSON.stringify(data || {}) });

  function notify(text, ok) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(ok === false ? "error" : "success");
    if (tg && tg.showAlert) tg.showAlert(text); else alert(text);
  }
  function apiError(e) {
    if (e && e.body && e.body.message) return notify(e.body.message, false);
    notify(L.error, false);
  }
  // Действие с сервером: блокируем кнопку, показываем итог, перерисовываем вкладку
  async function act(btn, path, data, onOk) {
    if (btn) btn.disabled = true;
    try {
      const res = await post(path, data);
      if (res.ok === false) { notify(res.message || L.error, false); if (btn) btn.disabled = false; return; }
      await onOk(res);
    } catch (e) { apiError(e); if (btn) btn.disabled = false; }
  }

  function card(title, inner, id) {
    return '<div class="card"' + (id ? ' id="' + id + '"' : '') + '><h2>' + title + '</h2>' + inner + '</div>';
  }
  const row = (k, v, cls) => '<div class="row"><span class="k">' + k + '</span><span class="v ' + (cls || "") + '">' + v + '</span></div>';

  // ================= Постраничный список: «‹ 1 2 3 … 45 46 ›» =================
  // Сотни лотов не растягивают плашку: на странице per штук, номер страницы переживает
  // обновление вкладки. bind(el) — перепривязать кнопки строк после смены страницы.
  const PAGERS = {};
  function pager(id, items, per, emptyHtml, bind) {
    const prev = PAGERS[id], pages = Math.max(1, Math.ceil(items.length / per));
    PAGERS[id] = { items: items, per: per, empty: emptyHtml || "", bind: bind,
                   page: Math.min(prev ? prev.page : 0, pages - 1) };
    return '<div class="pager" id="pg-' + id + '">' + pagerBody(id) + '</div>';
  }
  function pagerBody(id) {
    const p = PAGERS[id];
    if (!p.items.length) return p.empty;
    const pages = Math.ceil(p.items.length / p.per);
    const list = '<div class="pg-list">' + p.items.slice(p.page * p.per, (p.page + 1) * p.per).join("") + '</div>';
    if (pages <= 1) return list;
    const show = [];
    for (let i = 0; i < pages; i++) if (i < 2 || i >= pages - 2 || Math.abs(i - p.page) <= 1) show.push(i);
    let nav = '<button class="pg-btn" data-pg="' + (p.page - 1) + '"' + (p.page > 0 ? '' : ' disabled') + '>‹</button>';
    let last = -1;
    show.forEach(i => {
      if (i - last > 1) nav += '<span class="pg-gap">…</span>';
      nav += '<button class="pg-btn' + (i === p.page ? ' on' : '') + '" data-pg="' + i + '">' + (i + 1) + '</button>';
      last = i;
    });
    nav += '<button class="pg-btn" data-pg="' + (p.page + 1) + '"' + (p.page < pages - 1 ? '' : ' disabled') + '>›</button>';
    return list + '<div class="pg-nav">' + nav + '</div>';
  }
  function bindPager(el) {
    const id = el.id.slice(3), p = PAGERS[id];
    if (!p) return;
    el.querySelectorAll(".pg-btn[data-pg]").forEach(b => {
      b.onclick = () => {
        p.page = Number(b.dataset.pg);
        el.innerHTML = pagerBody(id);
        bindPager(el);
        if (p.bind) p.bind(el);
      };
    });
  }
  const bindPagers = root => (root || document).querySelectorAll(".pager").forEach(bindPager);
  // Сколько колонок плашек у вкладки на широком экране (см. CSS #app[data-cols])
  const VIEW_COLS = { passport: 2, farm: 2, goals: 1, workshop: 2, raids: 2, market: 3,
                      team: 3, friends: 3, shop: 3, top: 1, faq: 1, rules: 1 };
  const resLine = stock => RES.map(k => '<span class="chip">' + RES_ICON[k] + ' ' + num(stock[k]) + '</span>').join("");
  const bundle = b => RES.filter(k => b && b[k]).map(k => RES_ICON[k] + ' ' + b[k]).join(" · ") || "—";
  const robotImg = kind => '<img src="/img/robots/' + kind + '.jpg" alt="" onerror="this.onerror=null;this.src=\'/img/robots/' + kind + '.svg\'">';

  // ================= Каркас: вкладки =================
  let me = null, current = "passport";
  function visibleTabs() {
    const f = (me && me.features) || {};
    return TABS.filter(t => !TAB_FLAG[t] || f[TAB_FLAG[t]] !== false);
  }
  function startTab() {
    let tab = null;
    try { tab = new URLSearchParams(location.search).get("tab"); } catch (e) {}
    if (!tab) { try { tab = localStorage.getItem("rofl_tab"); } catch (e) {} }
    return visibleTabs().includes(tab) ? tab : "passport";
  }
  function renderTabs() {
    document.getElementById("tabs").innerHTML = visibleTabs().map(t =>
      '<button class="tab' + (t === current ? ' on' : '') + '" data-tab="' + t + '">' + L["tab_" + t] + '</button>').join("");
    document.querySelectorAll(".tab").forEach(b => { b.onclick = () => go(b.dataset.tab); });
    const on = document.querySelector(".tab.on");
    if (on && on.scrollIntoView) on.scrollIntoView({ inline: "center", block: "nearest" });
  }
  async function go(tab) {
    current = tab;
    try { localStorage.setItem("rofl_tab", tab); } catch (e) {}
    renderTabs();
    window.scrollTo(0, 0);
    const box = document.getElementById("app");
    box.innerHTML = '<div class="loading">' + L.loading + '</div>';
    box.dataset.cols = VIEW_COLS[tab] || 2;
    try {
      await VIEWS[tab](box);
      bindPagers(box);
    } catch (e) {
      if (e && e.status === 503) box.innerHTML = '<div class="err">' + L.featureOff + '</div>';
      else box.innerHTML = '<div class="err">' + L.error + '</div>';
    }
  }

  // ================= 🚜 Ферма =================
  function robotCard(kind, f) {
    const n = f[kind];
    let status;
    if (kind === "premium") status = n === 0 ? "" : (f.premium_fueled === n ? "⚡ " + L.fueledAll : "🔴 " + fmt(L.fueledPart, { a: f.premium_fueled, b: n }));
    else if (kind === "intern") status = "♾ " + L.eternal;
    else status = n ? "⏳ " + L.license : "";
    let action = "";
    if (kind === "intern" && !f.intern_claimed) action = '<button class="mini" id="internBtn">' + L.activateIntern + '</button>';
    else if (kind === "intern" && f.interns_pending > 0) action = '<button class="mini" id="internBtn">' + fmt(L.claimIntern, { n: f.interns_pending }) + '</button>';
    else if (kind !== "intern") action = '<button class="mini ghost goShop">' + L.buyMore + '</button>';
    return '<div class="robot ' + kind + (n ? '' : ' zero') + '">' + robotImg(kind) +
      '<div class="rinfo"><div class="rname">' + L["unit_" + kind] + '</div>' +
      '<div class="rrate">' + fmt(L.rateShort, { v: (f.rates || {})[kind] || 0 }) + '</div>' +
      (status ? '<div class="rstat">' + status + '</div>' : '') + action + '</div>' +
      '<div class="rcount">×' + n + '</div></div>';
  }

  // CTA-триггеры: покупка предлагается в момент «боли»
  function buildCta(f) {
    const box = (kind, text) =>
      '<div class="cta ' + kind + '"><span>' + text + '</span><button class="goShop">' + L.ctaShopBtn + '</button></div>';
    if (f.junior + f.premium === 0) return box("red", L.ctaNoRobots);
    if (f.premium > 0 && f.premium_fueled < f.premium && f.fridge === 0 && f.inv_cutlets === 0)
      return box("red", fmt(L.ctaHungry, { n: f.premium - f.premium_fueled }));
    if (f.premium > 0 && f.fridge + f.inv_cutlets < f.premium) return box("yellow", L.ctaLowFuel);
    return "";
  }
  function setupBonusButton(secondsLeft) {
    const btn = document.getElementById("bonusBtn");
    if (!btn) return;
    function show(left) {
      btn.disabled = left > 0;
      btn.textContent = left > 0 ? fmt(L.bonusWait, { h: Math.floor(left / 3600), m: Math.floor(left % 3600 / 60) }) : L.bonusReady;
    }
    show(secondsLeft);
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const res = await post("/api/bonus", {});
        if (res.ok) { notify(L.bonusDone); await refreshMe(); go("farm"); } else show(res.seconds_left);
      } catch (e) { show(1); }
    };
  }

  // ================= 📈 Биржа v2: котлеты и ресурсы, заявки, график, индекс, обмен =================
  const ASSETS = ["cutlet", "metal", "hydrogen", "crystal", "parts"];
  const A_ICON = { cutlet: "🥩", metal: "⛏", hydrogen: "💧", crystal: "💎", parts: "⚙️" };
  let mkAsset = "cutlet";
  function chartSvg(history) {
    const pts = history.map((d, i) => [i, d.avg]).filter(p => p[1] !== null);
    if (!pts.length) return '<div class="hint">' + L.mk_noTrades + '</div>';
    const vals = pts.map(p => p[1]);
    const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    const W = 300, H = 90, pad = 10, n = Math.max(history.length - 1, 1);
    const x = i => pad + i * (W - 2 * pad) / n;
    const y = v => hi === lo ? H / 2 : H - pad - (v - lo) * (H - 2 * pad) / (hi - lo);
    const line = pts.map(p => x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1)).join(" ");
    const dots = pts.map(p => '<circle cx="' + x(p[0]).toFixed(1) + '" cy="' + y(p[1]).toFixed(1) + '" r="3"/>').join("");
    const days = history.map((d, i) => '<text x="' + x(i).toFixed(1) + '" y="' + (H + 12) + '">' + d.day.slice(8) + '</text>').join("");
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 16) + '"><polyline points="' + line + '"/>' + dots + days + '</svg>';
  }
  function idxChip(a, ix) {
    let tail = "—";
    if (ix && ix.last !== null) {
      const ch = ix.change_pct;
      const cls = ch > 0 ? "up" : ch < 0 ? "down" : "";
      tail = num(Math.round(ix.last)) + ' <span class="' + cls + '">' + (ch > 0 ? "▲" : ch < 0 ? "▼" : "•") + Math.abs(ch || 0) + '%</span>';
    }
    return '<button class="idx' + (a === mkAsset ? ' on' : '') + '" data-asset="' + a + '">' + A_ICON[a] + ' ' + tail + '</button>';
  }

      '</div><button class="mini ghost swapCancel" data-id="' + s.id + '">' + L.mk_cancel + '</button></div>'), 3, "", bindMarket) : "";
    box.innerHTML =
      card(L.mk_index, '<div class="idxrow">' + ASSETS.map(x => idxChip(x, m.index[x])).join("") + '</div>' +
        '<div class="balance small">' + icon + ' ' + name + '</div>' +
        '<div class="hint">' + fmt(L.mk_have, { n: num(m.have) }) + ' · 🪙 ' + num(m.balance) + '</div>' +
        '<div class="hint">' + fmt(L.mk_feeLine, { f: m.fee }) + '</div>' +
        (m.shuttle ? '<div class="hint status-ok">' + fmt(L.mk_shuttleNote, { f: m.fee }) + '</div>' : '') +
        (a === "cutlet" ? '<div class="hint">' + fmt(L.mk_floor, { p: m.cutlet_floor }) + '</div>' : '')) +
      card(L.mk_chart, chartSvg(m.history) + (m.index[a] && m.index[a].last !== null
        ? '<div class="hint">' + fmt(L.mk_avg, { p: m.index[a].week_avg, v: m.index[a].volume }) + '</div>' : '')) +
      card(L.mk_asks, asks) + card(L.mk_bids, bids) +
      form("sell", L.mk_sellTitle, fmt(L.mk_limits, { q: m.max_qty, o: m.max_orders }), L.mk_sell, !m.have) +
      form("bid", L.mk_bidTitle, L.mk_bidHint, L.mk_bid, false) +
      (mine ? card(L.mk_my, mine) : '') +
      card(L.sw_title, '<div class="hint">' + L.sw_hint + '</div>' + swaps) +
      card("➕ " + L.sw_create,
        '<div class="swapform"><label class="lbl">' + L.sw_give + '<select id="swG">' + resOpts("metal") + '</select></label>' +
        '<label class="lbl">' + L.sw_qty + '<input id="swGQ" type="number" inputmode="numeric" min="1" value="10"></label>' +
        '<label class="lbl">' + L.sw_want + '<select id="swW">' + resOpts("hydrogen") + '</select></label>' +
        '<label class="lbl">' + L.sw_qty + '<input id="swWQ" type="number" inputmode="numeric" min="1" value="10"></label></div>' +
        '<button class="btn ghost" id="swB">' + L.sw_create + '</button>' +
        (mySwaps ? '<div class="sub2">' + L.sw_mine + '</div>' + mySwaps : ''));

    document.querySelectorAll(".idx").forEach(b => { b.onclick = () => { mkAsset = b.dataset.asset; go("market"); }; });
    const val = id => Math.max(0, parseInt(document.getElementById(id).value || 0));
    const preview = () => {
      const t1 = val("sellQ") * val("sellP"), fee = Math.floor(t1 * m.fee / 100);
      document.getElementById("sellV").textContent = fmt(L.mk_preview, { t: t1, g: t1 - fee, f: fee });
      document.getElementById("bidV").textContent = fmt(L.mk_bidPreview, { t: val("bidQ") * val("bidP") });
    };
    ["sellQ", "sellP", "bidQ", "bidP"].forEach(id => { document.getElementById(id).oninput = preview; });
    preview();
    const place = (side, btnId, msg) => {
      const b = document.getElementById(btnId), pre = side === "sell" ? "sell" : "bid";
      b.onclick = () => (val(pre + "Q") <= 0 || val(pre + "P") <= 0) ? notify(L.sw_qtyErr, false) : act(b, "/api/market/order", { asset: a, side: side, qty: val(pre + "Q"), price: val(pre + "P") },
        async () => { notify(msg); await refreshMe(); go("market"); });
    };
    place("sell", "sellB", L.mk_listed);
    place("buy", "bidB", L.mk_listedBid);
    bindMarket(document);
    const sb = document.getElementById("swB");
    sb.onclick = () => (val("swGQ") <= 0 || val("swWQ") <= 0) ? notify(L.sw_qtyErr, false) : act(sb, "/api/swap/create", {
      give_kind: document.getElementById("swG").value, give_qty: val("swGQ"),
      want_kind: document.getElementById("swW").value, want_qty: val("swWQ")
    }, async () => { notify(L.sw_created); go("market"); });

    // Кнопки строк лотов: привязываются заново после каждой смены страницы списка
    function bindMarket(root) {
    root.querySelectorAll(".take").forEach(b => {
      b.onclick = () => {
        const q = Number(b.dataset.q), p = Number(b.dataset.p), id = b.dataset.id, isBid = b.dataset.side === "buy";
        const cap = isBid ? Math.min(q, m.have) : q;
        if (cap <= 0) return notify(fmt(L.mk_have, { n: 0 }), false);
        const opts = [1, 5, 10, 50].filter(x => x < cap).map(x => [x, x + " " + icon + " · " + num(x * p) + " 🪙"]);
        opts.push([cap, fmt(L.mk_all, { q: cap }) + " · " + num(cap * p) + " 🪙"]);
        const rowEl = document.getElementById("q" + id);
        rowEl.innerHTML = '<div class="hint">' + (isBid ? L.mk_sellHow : L.mk_buyHow) + '</div>' +
          opts.map(o => '<button class="mini qbtn" data-q="' + o[0] + '">' + o[1] + '</button>').join("");
        rowEl.classList.toggle("hidden");
        rowEl.querySelectorAll(".qbtn").forEach(x => {
          x.onclick = () => act(x, "/api/market/fill", { order_id: Number(id), qty: Number(x.dataset.q) }, async res => {
            notify(res.side === "sell" ? fmt(L.mk_bought, { q: res.qty, t: res.total }) : fmt(L.mk_sold, { q: res.qty, g: res.got }));
            await refreshMe(); go("market");
          });
        });
      };
    });
    root.querySelectorAll(".cancel").forEach(b => {
      b.onclick = () => act(b, "/api/market/cancel", { order_id: Number(b.dataset.id) },
        async () => { notify(L.mk_cancelledMsg); await refreshMe(); go("market"); });
    });
    root.querySelectorAll(".swapTake").forEach(b => {
      b.onclick = () => act(b, "/api/swap/accept", { swap_id: Number(b.dataset.id) }, async () => { notify(L.sw_done); await refreshMe(); go("market"); });
    });
    root.querySelectorAll(".swapCancel").forEach(b => {
      b.onclick = () => act(b, "/api/swap/cancel", { swap_id: Number(b.dataset.id) }, async () => { notify(L.sw_cancelled); go("market"); });
    });
    }
  }

  // ================= 🏆 Команда и станция =================

  function teamTile(tm) {
    return '<div class="offer"><div class="ol">' + esc(tm.symbol) + ' ' + esc(tm.name) +
      (tm.is_clan ? ' <span class="rank">' + L.clan + '</span>' : '') +

    root.querySelectorAll(".tjoin").forEach(b => {

  // Без команды — тот же хаб, что в чате: рулетка свободных команд, поиск, создание
  function teamHub(box, d) {
    const lim = d.limits;
    box.innerHTML =
      card(L.tm_roulette, '<div class="hint">' + L.noTeam + '</div>' +
        '<div id="tmRoulette">' + pager("tmroul", d.teams.map(teamTile), 6, '<div class="hint">' + L.tm_noFree + '</div>', bindTeamJoin) + '</div>' +
        '<button class="btn ghost" id="tmRotate">' + L.tm_rotate + '</button>') +
      card(L.tm_search,
        '<label class="lbl">' + L.tm_searchPh + '<input id="tmQ" type="text" maxlength="' + lim.name + '"></label>' +
        '<button class="btn ghost" id="tmFind">' + L.tm_searchBtn + '</button><div id="tmFound"></div>') +
      card(L.tm_create, '<div class="hint">' + fmt(L.tm_hubHint, { cost: num(d.cost) }) + '</div>' +
        '<label class="lbl">' + fmt(L.tm_name, { n: lim.name }) + '<input id="tmN" type="text" maxlength="' + lim.name + '"></label>' +
        '<label class="lbl">' + fmt(L.tm_motto, { n: lim.motto }) + '<input id="tmM" type="text" maxlength="' + lim.motto + '"></label>' +
        '<label class="lbl">' + fmt(L.tm_symbol, { n: lim.symbol }) + '<input id="tmS" type="text" maxlength="' + lim.symbol + '" placeholder="🔥"></label>' +
        (d.balance < d.cost ? '<div class="hint">' + fmt(L.tm_noMoney, { cost: num(d.cost), b: num(d.balance) }) + '</div>' : '') +
        '<button class="btn" id="tmCreate"' + (d.balance < d.cost ? ' disabled' : '') + '>' + fmt(L.tm_createBtn, { cost: num(d.cost) }) + '</button>');
    bindTeamJoin(box);
    const rot = document.getElementById("tmRotate");
    rot.onclick = async () => {
      rot.disabled = true;
      try {
        const r = await api("/api/teams");
        PAGERS.tmroul = null;
        const holder = document.getElementById("tmRoulette");
        holder.innerHTML = pager("tmroul", r.teams.map(teamTile), 6, '<div class="hint">' + L.tm_noFree + '</div>', bindTeamJoin);
        bindPagers(holder); bindTeamJoin(holder);
      } catch (e) { apiError(e); }
      rot.disabled = false;
    };
    const find = document.getElementById("tmFind"), q = document.getElementById("tmQ");
    const search = async () => {
      if (!q.value.trim()) return;
      find.disabled = true;
      try {
        const r = await api("/api/teams?q=" + encodeURIComponent(q.value.trim()));
        PAGERS.tmfound = null;
        const out = document.getElementById("tmFound");
        out.innerHTML = pager("tmfound", r.teams.map(teamTile), 5, '<div class="hint">' + L.tm_notFound + '</div>', bindTeamJoin);
        bindPagers(out); bindTeamJoin(out);
      } catch (e) { apiError(e); }
      find.disabled = false;
    };
    find.onclick = search;
    q.onkeydown = e => { if (e.key === "Enter") search(); };
    const cb = document.getElementById("tmCreate");
    cb.onclick = () => act(cb, "/api/team/create", {
      name: document.getElementById("tmN").value, motto: document.getElementById("tmM").value,
      symbol: document.getElementById("tmS").value
    }, async () => { notify(fmt(L.tm_created, { n: document.getElementById("tmN").value.trim() })); await refreshMe(); go("team"); });

    if (tg && tg.showConfirm) tg.showConfirm(text, ok => { if (ok) then(); });
    else if (window.confirm(text)) then();

      else {
        progress = '<div class="hint">' + fmt(L.st_next, { n: st.level + 1, c: st.cost }) + '</div>' + RES.map(k => {
          const have = st.stored[k] || 0, pct = Math.min(100, Math.round(have / st.cost * 100));
          const mineQty = d.stock[k] || 0, need = st.need[k] || 0;
          const btns = need > 0 && mineQty > 0
            ? [10, 50].filter(x => x <= mineQty && x <= need).map(x => '<button class="mini don" data-k="' + k + '" data-q="' + x + '">+' + x + '</button>').join("") +
              '<button class="mini ghost don" data-k="' + k + '" data-q="' + Math.min(mineQty, need) + '">' + L.st_all + ' ' + Math.min(mineQty, need) + '</button>'
            : '';
          return '<div class="stres"><div class="row"><span class="k">' + RES_ICON[k] + ' ' + esc(d.res_names[k]) +
            '</span><span class="v">' + have + '/' + st.cost + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div>' +
            '<div class="donrow">' + btns + '</div></div>';
        }).join("");

      const feed = d.feed.map(x => '<div class="hint">• ' + esc(x.name) + ' +' + x.qty + ' ' + RES_ICON[x.kind] + '</div>').join("") ||
        '<div class="hint">' + L.st_feedEmpty + '</div>';
      stHtml = head + progress + '<div class="hint">' + L.st_hint + '</div><div class="sub2">' + L.st_feed + '</div>' + feed;
    }

    lb.onclick = () => askConfirm(fmt(tm.captain ? L.tm_leaveAskCaptain : L.tm_leaveAsk, { n: tm.name }),
      () => act(lb, "/api/team/leave", {}, async () => { notify(L.tm_left); await refreshMe(); go("team"); }));
    document.querySelectorAll(".don").forEach(b => {
      b.onclick = () => act(b, "/api/station/donate", { kind: b.dataset.k, qty: Number(b.dataset.q) },
        async () => { notify(L.st_done); await refreshMe(); go("team"); });

    box.innerHTML =
      card(L.shopFarm, '<div class="hint">' + L.shopHint + '</div>' + shop.farm.map(btn).join("")) +

  async function buy(sku, btn) {
    if (!tg || !tg.openInvoice) return notify(L.oldClient, false);
    btn.disabled = true;
    try {
      const res = await post("/api/invoice", { sku: sku });
      tg.openInvoice(res.link, function (status) {
        btn.disabled = false;
        if (status === "paid") { notify(L.paid); setTimeout(async () => { await refreshMe(); }, 1500); }
        else if (status === "failed") notify(L.payFail, false);
      });
    } catch (e) {
      btn.disabled = false;
      notify((e.body && e.body.error && e.status === 400) ? e.body.error : L.payFail, false);
    }
  }

  // ================= Шахта: визуальная сцена фермы =================
  let sceneTimer = null, coinTimer = null, minedVisit = 0;
  function unitCard(kind, n, fueled) {
    let status;
    if (kind === "premium") status = fueled === n ? "⚡ " + L.fueledAll : "🔴 " + fmt(L.fueledPart, { a: fueled, b: n });
    else if (kind === "intern") status = "♾ " + L.eternal;
    else status = "⏳ " + L.license;
    const idle = kind === "premium" && fueled === 0 ? " idle" : "";
    return '<div class="unit ' + kind + idle + '">' + robotImg(kind) +
      '<div class="cnt">×' + n + '</div><div class="unm">' + L["unit_" + kind] + '</div>' +
      '<div class="ust">' + status + '</div></div>';
  }
  function openScene(meData) {
    const f = meData.farm;
    let units = KINDS.filter(k => f[k]).map(k => unitCard(k, f[k], k === "premium" ? f.premium_fueled : f[k])).join("");
    if (!units) units = '<div class="empty">' + L.emptyFarm + '</div>';
    const stars = Array.from({ length: 26 }, (_, i) =>
      '<i style="left:' + ((i * 37) % 100) + '%;top:' + ((i * 53) % 55) + '%;animation-delay:' + (i % 7) * .4 + 's"></i>').join("");
    document.getElementById("scene").innerHTML =
      '<div class="scene-head"><button class="back" id="sceneBack">' + L.back + '</button><h2>' + L.farmScene + '</h2></div>' +
      '<div class="mine"><div class="sky">' + stars + '</div><div class="moon"></div>' +
      '<div class="hill"></div><div class="arch"><span>⛏</span></div><div class="rails"></div>' +
      '<div class="units">' + units + '</div><div class="fx" id="coinsFx"></div></div>' +
      '<div class="card">' + row(L.speed, fmt(L.perHour, { v: "+" + f.speed_hour })) +
      row(L.minedVisit, '<span class="mined" id="minedVisit">+0.00</span>') + '</div>';
    ["app", "tabs", "footer"].forEach(id => document.getElementById(id).classList.add("hidden"));
    document.getElementById("scene").classList.remove("hidden");
    window.scrollTo(0, 0);
    document.getElementById("sceneBack").onclick = closeScene;
    if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeScene); }
    minedVisit = 0;
    const perTick = f.speed_hour / 3600 / 10;
    clearInterval(sceneTimer);
    sceneTimer = setInterval(() => {
      minedVisit += perTick;
      const el = document.getElementById("minedVisit");
      if (el) el.textContent = "+" + minedVisit.toFixed(2);
    }, 100);
    clearInterval(coinTimer);
    if (f.speed_hour > 0) coinTimer = setInterval(spawnCoin, Math.max(350, 5000 / (f.speed_hour / 5 + 1)));
  }
  function spawnCoin() {
    const box = document.getElementById("coinsFx");
    if (!box) return;
    const c = document.createElement("span");
    c.className = "coin"; c.textContent = "🪙";
    c.style.left = (10 + Math.random() * 80) + "%";
    box.appendChild(c);
    setTimeout(() => c.remove(), 1800);
  }
  function closeScene() {
    clearInterval(sceneTimer); clearInterval(coinTimer);
    document.getElementById("scene").classList.add("hidden");
    ["app", "tabs", "footer"].forEach(id => document.getElementById(id).classList.remove("hidden"));
    if (tg && tg.BackButton) { tg.BackButton.offClick(closeScene); tg.BackButton.hide(); }
  }

  // ================= Старт =================
  function renderChrome() {
    document.getElementById("subtitle").textContent = L.subtitle;
    document.getElementById("footer").innerHTML = esc(L.footer) +
      '<div class="made-by">' + esc(L.madeBy).replace("@mister_telebot",
        '<a href="https://t.me/mister_telebot">@mister_telebot</a>') + '</div>';
  }
  async function boot() {
    try {
      await refreshMe();
      setLang(me.lang);
      renderChrome();
      current = startTab();
      await go(current);
    } catch (e) {
      const code = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || "ru";
      setLang(code);
      let msg = L.error;
      if (e.status === 401) msg = L.outside;
      else if (e.status === 404) msg = L.noProfile;
      else if (e.status === 403) msg = (e.body && e.body.error === "deleting") ? L.deleting : L.blocked;
      document.getElementById("app").innerHTML = '<div class="err">' + msg + '</div>';
    }
  }
  window.__rofl = { setMe: m => { me = m; }, go: go, setLang: setLang, renderChrome: renderChrome, startTab: startTab };

  if (!initData) {
    document.getElementById("app").innerHTML = '<div class="err">' + I18N.ru.outside + '</div>';
  } else {
    boot();
  }
})();
</script>
</body>
</html>
