  // Флаг картинкой (на Windows эмодзи-флаги рисуются буквами), не загрузилась — эмодзи
  const isoOf = flag => Array.from(flag).map(c => String.fromCharCode(c.codePointAt(0) - 0x1F1E6 + 65)).join("");
  function flagHtml(flag) {
    return '<img class="g-flag" alt="" src="https://flagcdn.com/w320/' + isoOf(flag).toLowerCase() + '.png" ' +
      'onerror="this.outerHTML=\'<div class=&quot;g-flag-emoji&quot;>' + flag + '</div>\'">';
  }
  let regionNames = null;
  function countryName(iso, fallback) {
    try {
      if (regionNames === null) regionNames = Intl.DisplayNames ? new Intl.DisplayNames([me.lang || "en"], { type: "region" }) : false;
      return (regionNames && regionNames.of(iso)) || fallback;
    } catch (e) { regionNames = false; return fallback; }
  }

  // ⚠️ Жалоба на вопрос викторины (владелец 27.10): после ответа — причина в одно касание, текст вопроса сервер берёт сам
  const QR_REASONS = ["answer", "question", "dup", "other"];
  function quizReport(holder, roundId) {
    if (!holder) return;
    holder.querySelector(".qr-open").onclick = () => {
      holder.innerHTML = '<div class="qr-box"><div class="hint">' + L.qr_title + '</div>' +
        QR_REASONS.map(k => '<button class="btn ghost" data-qr="' + k + '">' + L["qr_" + k] + '</button>').join("") + '</div>';
      holder.querySelectorAll("[data-qr]").forEach(b => {
        b.onclick = async () => {
          holder.querySelectorAll("[data-qr]").forEach(x => x.disabled = true);
          try {
            const r = await post("/api/quiz/report", { round_id: roundId, reason: b.dataset.qr });
            holder.innerHTML = '<div class="qr-box hint">' +
              esc(r.ok ? L.qr_thanks : (r.code === "limit" ? L.qr_limit : (r.message || L.qr_limit))) + '</div>';
          } catch (e) { apiError(e); }
        };
      });
    };
  }

  // 🧠 Викторина, ➗ Математика, 🏳️ Флаги: раунд из 10 вопросов, верный ответ знает только сервер
  async function gameTimed(box, kind) {
    const d = gamesData.quiz, round = d.round, base = TIMED[kind];
    if (!quizRun || quizRun.kind !== kind) quizRun = { kind: kind, n: 0, right: 0, coins: 0, res: {}, streak: null };
    if (quizRun.n >= round) {               // 🏁 итог раунда из 10 вопросов
      gamesData = await api("/api/games");   // свежий уровень интеллекта
      const d = gamesData.quiz;
      const res = Object.keys(quizRun.res).map(k => "+" + quizRun.res[k] + " " + RES_ICON[k]).join(" · ") || "—";
      box.innerHTML = card(L.quiz_sum_title, gameHead() +
        row(L.quiz_sum, quizRun.right + " / " + round) + row(L.quiz_coins, (quizRun.coins >= 0 ? "+" : "−") + num(Math.abs(quizRun.coins)) + " 🪙") +
        row(L.resources, res) +
        (kind === "quiz" ? '<div class="hint">' + fmt(L.quiz_level, { l: d.level, a: d.progress, b: d.required }) + '</div>' : '') +
        (quizRun.streak ? '<div class="hint">' + streakLine(quizRun.streak) + '</div>' : '') +
        '<button class="btn" id="qAgain">' + L.quiz_again + '</button>');
      bindBack(box);
      box.querySelector("#qAgain").onclick = () => { quizRun = null; go("games"); };
      return;
    }
    const pre = quizRun.pre;
    quizRun.pre = null;
    // заранее загруженный вопрос годится, пока сервер ещё засчитает показ (окно предзагрузки)
    const fresh = pre && Date.now() - pre.at < (gamesData.prefetch - 1) * 1000;
    const q = await (fresh ? pre.p : post(base + "/next", {}));
    if (!q.ok) { box.innerHTML = card(L["g_name_" + kind], gameHead() + '<div class="g-result">' + esc(q.message) + '</div>'); bindBack(box); return; }
    quizRun.n += 1;
    let top = fmt(L.quiz_of, { a: quizRun.n, b: round }), body, opts = q.options;
    if (kind === "quiz") {
      top = esc(q.category.toUpperCase()) + ' · ' + top;
      body = '<div class="quiz-q">🤔 ' + esc(q.q) + '</div>';
    } else if (kind === "math") {
      body = '<div class="math-q">' + esc(q.q) + ' = ?</div>';
    } else if (q.mode === "flag") {
      body = flagHtml(q.flag) + '<div class="quiz-q" style="text-align:center">' + L.flags_q_flag + '</div>';
      opts = q.options.map((iso, i) => countryName(iso, q.names[i]));
    } else {
      body = '<div class="quiz-q">🏛 ' + fmt(L.flags_q_cap, { c: esc(q.country) }) + '</div>';
    }
    box.innerHTML = card(L["g_name_" + kind], gameHead() +
      '<div class="quiz-top" style="margin-top:10px"><span>' + top + '</span><span id="qSec">⏱ ' + q.seconds + '</span></div>' +
      '<div class="tbar"><i id="qBar" style="width:100%"></i></div><div class="hint" style="margin-top:6px">' + prizeLine(kind) + '</div>' + body +
      opts.map((o, i) => '<button class="quiz-opt" data-opt="' + i + '">' + esc(o) + '</button>').join("") +
      '<div id="qRes"></div>' + (kind === "quiz" ? '<button class="btn ghost" id="qHint">' + fmt(L.quiz_hint, { c: q.hint_cost }) + '</button>' : ''));
    bindBack(box);
    post(base + "/start", { round_id: q.round_id }).catch(() => {});   // таймер сервера — с показа вопроса
    let left = q.seconds, answered = false;
    const answer = async opt => {
      if (answered) return;
      answered = true; stopGameTimer();
      box.querySelectorAll(".quiz-opt, #qHint").forEach(x => x.disabled = true);
      try {
        const r = await post(base + "/answer", { round_id: q.round_id, option: opt });
        const els = box.querySelectorAll(".quiz-opt");
        if (r.correct !== undefined) {
          const won = r.result === "win";
          els[r.correct].classList.add(won ? "right" : "sad");
          if (won) sparks(els[r.correct], true);
          if (opt >= 0 && opt !== r.correct) { els[opt].classList.add("wrong"); sparks(els[opt], false); }
        }
        if (r.result === "win") quizRun.right += 1;
        const i = r.info || {};
        quizRun.coins += (i.reward || 0) - (i.penalty || 0) + (i.level_up ? i.level_up.bonus : 0);
        if (i.res) quizRun.res[i.res.kind] = (quizRun.res[i.res.kind] || 0) + i.res.qty;
        if (i.energy) quizRun.res.energy = (quizRun.res.energy || 0) + 1;
        if (i.milestone) quizRun.res[i.milestone.kind] = (quizRun.res[i.milestone.kind] || 0) + i.milestone.qty;
        if (i.streak) quizRun.streak = i.streak;
        vibrate(r.result === "win");
        // верный вариант уже подсвечен зелёным — текстом его не повторяем (короче, без прокрутки)
        box.querySelector("#qRes").innerHTML = '<div class="g-result ' + (r.result === "win" ? "win" : "lose") + '">' +
          payoutHtml(r, r.result ? '<b>' + L["g_" + r.result] + '</b>' : '') + '</div><button class="btn" id="qNext">' + L.quiz_next + '</button>' +
          (kind === "quiz" && r.correct !== undefined ? '<div id="qRep"><button class="btn short qr-open">' + L.qr_btn + '</button></div>' : '');
        if (kind === "quiz") quizReport(box.querySelector("#qRep"), q.round_id);
        if (!r.ok && r.message) quizRun.n = round;   // лимит / нет монет — сразу к итогу
        if (quizRun.n < round) {   // следующий вопрос грузится, пока игрок смотрит на подсветку
          quizRun.pre = { at: Date.now(), p: post(base + "/next", {}) };
          quizRun.pre.p.catch(() => {});
        }
        const next = box.querySelector("#qNext");
        next.onclick = () => { stopGameTimer(); gameTimed(box, kind); };
        if (next.scrollIntoView) next.scrollIntoView({ block: "nearest" });   // «Дальше» всегда на экране
      } catch (e) { apiError(e); go("games"); }
    };
    box.querySelectorAll(".quiz-opt").forEach(b => { b.onclick = () => answer(Number(b.dataset.opt)); });
    const hint = box.querySelector("#qHint");
    if (hint) hint.onclick = async () => {
      try {
        const h = await post("/api/quiz/hint", { round_id: q.round_id });
        if (!h.ok) return notify(h.message, false);
        quizRun.coins -= h.balance === null ? 0 : q.hint_cost;
        h.removed.forEach(i => { const o = box.querySelectorAll(".quiz-opt")[i]; o.classList.add("gone"); o.disabled = true; });
        hint.disabled = true;
      } catch (e) { apiError(e); }
    };
    gameTimer = setInterval(() => {
      left -= 1;
      const sEl = box.querySelector("#qSec"), bar = box.querySelector("#qBar");
      if (sEl) sEl.textContent = "⏱ " + Math.max(0, left);
      if (bar) bar.style.width = Math.max(0, left / q.seconds * 100) + "%";
      if (left <= 0) answer(-1);
    }, 1000);
  }

  // 🕵️ Дело дня: одно дело на всех в сутки, улики по одной, обвинение одно (shared/daily_case.py)
  function caseStrip(c) {
    let s = "";
    for (let i = 0; i < c.total; i++) s += i < c.opened ? "🔍" : "⬛";
    return s + (c.solved ? " ✅" : " ❌");
  }
  async function viewCase(box, pre) {
    const c = pre || await api("/api/case");
    if (!c.ok) { box.innerHTML = card(L.cs_title, gameHead() + '<div class="g-result">' + L.cs_none + '</div>'); bindBack(box); return; }
    const R = c.rewards;
    const ladder = Object.keys(R).map(k => '<span class="chip' + (!c.finished && Number(k) === c.opened ? ' have' : '') + '">🔍' + k +
      ' → ' + R[k] + ' 🪙</span>').join("");
    const sus = c.suspects.map((s, i) => {
      const cls = c.finished ? (i === c.culprit ? ' culprit' : (i === c.accused ? ' wrong' : '')) : '';
      return '<div class="cs-sus' + cls + '"><div class="cs-who"><span class="cs-em">' + esc(s.emoji) + '</span><b>' + esc(s.name) + '</b>' +
        (c.finished && i === c.culprit ? ' · ' + L.cs_culprit : '') + '</div><div class="hint">' + esc(s.alibi) + '</div>' +
        (c.finished ? '' : '<button class="btn ghost cs-acc" data-s="' + i + '">' + L.cs_accuse + '</button>') + '</div>';
    }).join("");
    let clues = "";
    for (let i = 0; i < c.total; i++) clues += i < c.clues.length ? '<div class="cs-clue"><b>🔍 ' + (i + 1) + '.</b> ' + esc(c.clues[i]) + '</div>'
      : '<div class="cs-clue locked">⬛ ' + fmt(L.cs_clueLocked, { n: i + 1 }) + '</div>';
    const left = Math.max(0, (Date.parse(c.next_at) - Date.now()) / 1000);
    let tail;
    if (!c.finished) {
      tail = (c.opened < c.total ? '<button class="btn" id="csMore">' + fmt(L.cs_more, { r: R[c.opened + 1] }) + '</button>' : '') +
        '<div class="hint" style="margin-top:8px">' + L.cs_rules + '</div><div class="chips">' + ladder + '</div>';
    } else {
      const res = c.result || {};
      tail = '<div class="g-result ' + (c.solved ? 'win' : 'lose') + '" id="csRes"><b>' +
        (c.solved ? fmt(L.cs_solved, { r: c.reward }) : fmt(L.cs_failed, { n: esc(c.suspects[c.culprit].name) })) + '</b>' +
        (res.bonus ? '<br>' + fmt(L.cs_bonus, { b: res.bonus }) : '') + '</div>' +
        '<div class="cs-sol"><b>' + L.cs_solution + '</b><br>' + esc(c.solution) + '</div>' +
        '<div class="cs-strip">' + caseStrip(c) + '</div>' +
        (c.stats ? '<div class="hint" style="text-align:center">' + fmt(L.cs_stats, { s: c.stats.solved, p: c.stats.played,
          a: c.stats.avg_clues === null ? "—" : c.stats.avg_clues }) + '</div>' : '') +
        (c.link ? '<button class="btn" id="csShare">' + L.cs_share + '</button>' : '') +
        '<div class="hint" style="text-align:center;margin-top:8px">' + fmt(L.cs_next, { t: dur(left) }) + '</div>';
    }
    box.innerHTML = fxStage(fmt(L.cs_head, { n: c.number }) + ' · ' + esc(c.title),
        gameHead() + '<div class="cs-story" style="margin-top:10px">' + esc(c.story) + '</div>') +
      card(L.cs_suspects, sus) + card(L.cs_clues, clues + tail) +
      '<div class="hint" style="margin:-4px 4px 4px">' + fmt(L.cs_streak, { n: c.streak, e: c.streak_every, b: c.streak_bonus }) + '</div>' +
      '<div class="hint qs-fiction" style="margin:0 4px 12px">' + L.qs_fiction + '</div>';
    bindBack(box);
    runFx(box, c.mood);
    const more = box.querySelector("#csMore");
    if (more) more.onclick = async () => {
      more.disabled = true;
      try { viewCase(box, await post("/api/case/clue", {})); } catch (e) { apiError(e); more.disabled = false; }
    };
    box.querySelectorAll(".cs-acc").forEach(b => { b.onclick = () => {
      const s = c.suspects[Number(b.dataset.s)];
      askConfirm(fmt(L.cs_accuseAsk, { n: s.name }), async () => {
        box.querySelectorAll("button").forEach(x => x.disabled = true);
        try {
          const r = await post("/api/case/accuse", { suspect: Number(b.dataset.s) });
          if (r.balance !== undefined) me.balance = r.balance;
          await viewCase(box, r);
          const el = box.querySelector("#csRes");
          if (el) { vibrate(!!r.solved); sparks(el, !!r.solved); }
        } catch (e) { apiError(e); go("games"); }
      });
    }; });
    const sh = box.querySelector("#csShare");
    if (sh) sh.onclick = () => shareLink(c.link, fmt(L.cs_shareText, { n: c.number, s: caseStrip(c), k: c.streak }));
  }

  // ⚔️ Дуэли: живой соперник (очередь общая с чатом). Состояние — опрос /api/duel раз в 1,5 с.
  const DUEL_POLL_MS = 1500;   // жесты — общий MOVES (налёты)
  const duelSeen = new Set();     // итоги, которые уже показали (повторно не всплывают)
  let duelSig = null, duelLocal = null;
  async function viewDuel(box) {
    duelSig = null;
    const draw = st => {
      const sig = JSON.stringify([st.duel && Object.assign({}, st.duel, { left: 0, waiting_left: 0 }), st.last && st.last.id]);
      if (sig === duelSig) return tick(st);   // ничего не поменялось — только таймер
      duelSig = sig;
      renderDuel(box, st);
    };
    const tick = st => {
      const d = st.duel; if (!d) return;
      const el = box.querySelector("#dlLeft"), bar = box.querySelector("#dlBar");
      if (d.status === "active" && el) { el.textContent = "⏱ " + d.left; if (bar) bar.style.width = (d.left / st.timeout * 100) + "%"; }
      if (d.status === "waiting" && el) el.textContent = d.invite ? fmt(L.di_left, { h: Math.ceil(d.waiting_left / 3600) })
        : fmt(L.dl_waitLeft, { m: Math.ceil(d.waiting_left / 60) });
    };
    const poll = async () => {
      try { if (box.isConnected && gameScreen === "duel") draw(await api("/api/duel")); } catch (e) { /* сеть моргнула — следующий опрос */ }
    };
    draw(await api("/api/duel"));
    gameTimer = setInterval(poll, DUEL_POLL_MS);
    duelLocal = poll;
  }
  function renderDuel(box, st) {
    const d = st.duel, last = st.last && !duelSeen.has(st.last.id) ? st.last : null;
    const mv = m => L["rps_" + m];
    const act = async (url, body) => {
      box.querySelectorAll("button").forEach(x => x.disabled = true);
      try {
        const r = await post(url, body);
        if (!r.ok) notify(r.message || L.error, false);
        duelSig = null;
        if (r.ok) renderDuel(box, r); else if (duelLocal) duelLocal();
      } catch (e) { apiError(e); go("games"); }
    };
    let body;
    if (d && d.status === "waiting" && d.invite) {
      body = '<div class="dl-search">🤝</div><div class="g-result" style="text-align:center"><b>' + fmt(L.di_waiting, { s: num(d.stake) }) +
        '</b><br><span class="hint" id="dlLeft">' + fmt(L.di_left, { h: Math.ceil(d.waiting_left / 3600) }) + '</span></div>' +
        (d.link ? '<div class="reflink" id="diLink">' + esc(d.link) + '</div><button class="btn" id="diShare">' + L.di_share + '</button>' +
          '<button class="btn ghost" id="diCopy">' + L.ref_copy + '</button>' : '') +
        '<div class="hint">' + L.di_waitHint + '</div><button class="btn ghost" id="dlCancel">' + L.dl_cancel + '</button>';
    } else if (d && d.status === "waiting") {
      body = '<div class="dl-search">🔎</div><div class="g-result" style="text-align:center"><b>' + fmt(L.dl_waiting, { s: num(d.stake) }) +
        '</b><br><span class="hint" id="dlLeft">' + fmt(L.dl_waitLeft, { m: Math.ceil(d.waiting_left / 60) }) + '</span></div>' +
        '<div class="hint">' + L.dl_waitHint + '</div><button class="btn ghost" id="dlCancel">' + L.dl_cancel + '</button>';
    } else if (d && d.status === "active") {
      body = '<div class="g-result"><b>' + fmt(L.dl_matched, { b: num(d.stake * 2), p: num(d.payout) }) + '</b>' +
        (d.round > 1 ? '<br>' + fmt(L.dl_round, { n: d.round }) : '') + '</div>' +
        '<div class="quiz-top" style="margin-top:8px"><span>' + (d.my_move ? L.dl_wait : L.dl_pick) + '</span><span id="dlLeft">⏱ ' + d.left + '</span></div>' +
        '<div class="tbar"><i id="dlBar" style="width:' + (d.left / st.timeout * 100) + '%"></i></div>' +
        '<div class="g-moves">' + MOVES.map(m => '<button class="btn' + (d.my_move === m ? ' picked' : '') + '" data-dm="' + m + '"' +
          (d.my_move ? ' disabled' : '') + '>' + mv(m) + '</button>').join("") + '</div>' +
        (d.opp_moved ? '<div class="hint" style="margin-top:8px">' + L.dl_oppMoved + '</div>' : '') +
        '<div class="hint" style="margin-top:6px">' + L.dl_timeoutNote + '</div>';
    } else if (last) {
      duelSeen.add(last.id);
      body = last.cancelled ? '<div class="g-result">' + fmt(L.dl_cancelled, { s: num(last.stake) }) + '</div>'
        : '<div class="dl-vs">' + fmt(L.dl_vs, { a: mv(last.my_move), b: mv(last.opp_move) }) + '</div>' +
          '<div class="g-result ' + (last.win ? 'win' : 'lose') + '" id="dlRes"><b>' +
          (last.win ? fmt(L.dl_win, { p: num(last.payout) }) : fmt(L.dl_lose, { s: num(last.stake) })) +
          '</b><br><span class="hint">' + fmt(L.g_balance, { b: num(st.balance) }) + '</span></div>';
      body += '<button class="btn" id="dlAgain">' + L.dl_again + '</button>';
    } else {
      body = '<div class="hint" style="margin-top:10px">' + fmt(L.dl_intro, { p: 100 - st.burn, b: st.burn, t: st.timeout }) + '</div>' +
        (st.burn_premium ? '<div class="hint' + (st.premium ? ' status-ok' : '') + '">' +
          fmt(st.premium ? L.dl_premOn : L.dl_premOff, { a: st.burn_base, b: st.burn_premium }) + '</div>' : '') +
        st.tables.map(tb => '<button class="btn' + (st.balance < tb.stake ? ' short' : '') + '" data-stake="' + tb.stake + '">' +
          fmt(L.dl_table, { s: num(tb.stake), p: num(tb.payout) }) + '</button>').join("") +
        '<div class="hint" style="margin-top:8px">' + fmt(L.g_balance, { b: num(st.balance) }) + '</div>' +
        '<div class="sub2">' + L.di_head + '</div><div class="hint">' + L.di_hint + '</div>' +
        st.tables.map(tb => '<button class="btn ghost" data-inv="' + tb.stake + '">' + fmt(L.di_table, { s: num(tb.stake) }) + '</button>').join("");
    }
    box.innerHTML = card(L.dl_title, gameHead() + body);
    bindBack(box);
    box.querySelectorAll("[data-stake]").forEach(b => { b.onclick = () => {
      const stake = Number(b.dataset.stake);
      if (st.balance < stake) return notify(fmt(L.dl_short, { s: num(stake) }), false);
      act("/api/duel/join", { stake: stake });
    }; });
    box.querySelectorAll("[data-dm]").forEach(b => { b.onclick = () => act("/api/duel/move", { duel_id: d.id, move: b.dataset.dm }); });
    box.querySelectorAll("[data-inv]").forEach(b => { b.onclick = async () => {
      const stake = Number(b.dataset.inv);
      if (st.balance < stake) return notify(fmt(L.dl_short, { s: num(stake) }), false);
      box.querySelectorAll("button").forEach(x => x.disabled = true);
      try {
        const r = await post("/api/duel/invite", { stake: stake });
        if (r.ok === false) notify(r.message || L.error, false);
        duelSig = null;
        if (duelLocal) duelLocal();
      } catch (e) { apiError(e); go("games"); }
    }; });
    const diShare = box.querySelector("#diShare");
    if (diShare) diShare.onclick = () => shareLink(d.link, fmt(L.di_shareText, { s: num(d.stake) }));
    const diCopy = box.querySelector("#diCopy");
    if (diCopy) diCopy.onclick = () => copyText(d.link, box.querySelector("#diLink"));
    const cancel = box.querySelector("#dlCancel");
    if (cancel) cancel.onclick = () => act("/api/duel/cancel", { duel_id: d.id });
    const again = box.querySelector("#dlAgain");
    if (again) again.onclick = () => { duelSig = null; renderDuel(box, Object.assign({}, st, { last: null })); };
    const res = box.querySelector("#dlRes");
    if (res && last) { vibrate(last.win); sparks(res, last.win); }
  }

  // 🗺 Квесты: истории с выборами (движок общий с чатом — shared/quest_engine.py)
  let questOpen = null;   // открытая сцена {id, ...} — переживает перерисовку вкладки
  const qsText = txt => txt.replace(/\n/g, "<br>");   // HTML сцен — из наших сценариев data/quests
  async function viewQuests(box) {
    if (questOpen) return questScene(box, questOpen);
    const d = await api("/api/quests");
    const st = { done: L.qs_done, progress: L.qs_progress, new: L.qs_new };
    // ротация v2: счётчик всей базы + «новых сегодня a/b»; исчерпал — непройденные гаснут до 00:00 UTC (Безлимит снимает)
    const dl = d.daily || { done: 0, max: 3 };
    const head = '<div class="qs-meta"><span>' + fmt(L.qs_total, { n: num(d.total || d.quests.length) }) + '</span><span>' +
      (dl.unlimited ? L.qs_dailyUnl : fmt(L.qs_daily, { a: Math.min(dl.done, dl.max), b: dl.max })) + '</span></div>' +
      (dl.locked ? '<div class="g-result" style="margin-top:8px">' + fmt(L.qs_lockedNote, { b: dl.max }) +
        '</div><button class="btn" id="qsUnlim">' + L.g_limit_btn + '</button>' : '');
    // locked: "day" — погас до 00:00 UTC; "epic" — эпик только с ⚡ Безлимитом (плашка яркая, кнопка ведёт в магазин)
    const qsCard = q => '<div class="qs-card' + (q.locked === "day" ? ' dim' : '') + (q.epic ? ' epic' : '') + '"><span class="qs-status">' +
      (q.locked === "day" ? L.qs_locked : q.locked === "epic" ? L.qs_epicPaid : st[q.status]) + '</span><h3>' + (q.epic ? L.qs_epic + ' ' : '') + esc(q.title) + '</h3>' +
      '<div class="hint">' + fmt(L.qs_info, { g: esc(q.genre), m: esc(q.minutes), r: q.reward }) + '</div>' +
      '<div class="hint" style="margin-top:6px">' + esc(q.teaser) + '</div>' +
      (q.notes ? '<div class="hint qs-paper">' + L.qs_paper + '</div>' : '') +
      (q.locked === "epic" ? '<button class="btn" data-unlim="1">' + L.g_limit_btn + '</button>' : q.locked ? '' : (q.status === "progress" ? '<button class="btn" data-qs="' + q.id + '">' + L.qs_resume + '</button>' : '') +
        '<button class="btn' + (q.status === "progress" ? ' ghost' : '') + '" data-qs="' + q.id + '" data-restart="1">' +
        (q.status === "new" ? L.qs_start : L.qs_restart) + '</button>') + '</div>';
    box.innerHTML = card(L.g_name_quests, gameHead() + (d.ru_only ? '<div class="hint" style="margin-top:8px">' + L.qs_ruOnly + '</div>' : '') +
      head + (d.quests.length ? d.quests.map(qsCard).join("") : '<div class="hint">' + L.qs_empty + '</div>') +
      '<div class="hint qs-fiction">' + L.qs_fiction + '</div>');
    bindBack(box);
    box.querySelectorAll("#qsUnlim, [data-unlim]").forEach(b => { b.onclick = () => { shopCat = "games"; go("shop"); }; });
    box.querySelectorAll("[data-qs]").forEach(b => { b.onclick = async () => {
      b.disabled = true;
      try {
        const r = await post("/api/quest/open", { id: b.dataset.qs, restart: !!b.dataset.restart });
        if (!r.ok) { b.disabled = false; return notify(r.message || L.error, false); }
        questOpen = r; questScene(box, r);
      } catch (e) { apiError(e); go("games"); }
    }; });
  }
  // ✨ Движок атмосферы (static/webapp/fx.js) — подгружается только в квестах
  let fxLoading = null;
  function loadFx() {
    if (window.QuestFX) return Promise.resolve(true);
    if (!fxLoading) fxLoading = new Promise(res => {
      const sc = document.createElement("script");
      sc.src = "fx.js"; sc.onload = () => res(true); sc.onerror = () => { fxLoading = null; res(false); };
      document.head.appendChild(sc);
    });
    return fxLoading;
  }
  // Карточка-«сцена»: живой фон под текстом + кнопка ✨ (выключить/включить эффекты)
  function fxStage(title, inner) {
    return '<div class="card qs-stage"><div class="fx-back"></div><h2>' + title +
      '<span class="fx-sw"><span id="qsFxL">' + L.qs_fxOff + '</span><button class="fx-toggle" id="qsFx" title="✨">✨</button></span></h2>' +
      inner + '</div>';
  }
  function runFx(box, mood, text, draw, lock) {
    const fxOpts = { text: text, draw: draw, lock: lock, lang: me.lang };
    const btn = box.querySelector("#qsFx");
    loadFx().then(ok => {
      const stage = box.querySelector(".qs-stage");
      if (!ok || !stage || !stage.isConnected) { const sw = box.querySelector(".fx-sw"); if (sw) sw.style.display = "none"; return; }
      if (btn) {
        const lbl = box.querySelector("#qsFxL"), mark = () => {
          btn.classList.toggle("off", !QuestFX.enabled());
          if (lbl) lbl.textContent = QuestFX.enabled() ? L.qs_fxOff : L.qs_fxOn;
        };
        mark();
        btn.onclick = () => { QuestFX.setEnabled(!QuestFX.enabled()); mark();
          if (QuestFX.enabled()) QuestFX.start(stage, mood, fxOpts); else { QuestFX.stop(); stage.querySelector(".fx-back").innerHTML = ""; } };
      }
      QuestFX.start(stage, mood, fxOpts);
    });
  }
  // 🎨 Галерея атмосфер — владельцу: все эффекты на тестовой сцене
  async function questFxGallery(box, current) {
    await loadFx();
    if (!window.QuestFX) return notify(L.error, false);
    const name = fx => me.lang === "ru" ? fx.ru : fx.en;
    const cur = QuestFX.list.find(f => f.id === current) || QuestFX.list[0];
    // окно предпросмотра — как настоящая сцена (высота телефона), кнопки — отдельной карточкой ниже
    box.innerHTML = fxStage(L.qs_fxGallery, '<button class="btn ghost" id="qsList" style="margin-top:0;padding:8px;font-size:13px">' + L.qs_list + '</button>' +
      '<div class="qs-text" style="min-height:300px"><b>' + name(cur) + '</b> · <code>' + cur.id + '</code><br><br>' + L.qs_fxSample + '</div>' +
      '<button class="quiz-opt">' + L.qs_fxChoice + '</button>') +
      card("✨", '<div class="fx-gal">' + QuestFX.list.map(f => '<button class="btn' + (f.id === cur.id ? '' : ' ghost') + '" data-fx="' + f.id + '">' +
        name(f) + '</button>').join("") + '</div>');
    box.querySelector("#qsList").onclick = () => { questOpen = null; go("games"); };
    box.querySelectorAll("[data-fx]").forEach(b => { b.onclick = () => { questFxGallery(box, b.dataset.fx); window.scrollTo(0, 0); }; });
    runFx(box, [cur.id]);   // галерея: исход замка и надпись зеркала — из пресета эффекта
  }
  // Сцена квеста: выборы, 🔐 ввод ответа (ребус, шифр, код — сверяет сервер) и ⏱ таймер (время тоже считает сервер)
  function questScene(box, sc, result) {
    stopGameTimer();     // таймер прошлой сцены (и её атмосфера) — до отрисовки новой
    const choices = sc.choices.map(ch => '<button class="quiz-opt" data-ch="' + ch.i + '">' + esc(ch.label) +
      (ch.cost ? ' · ' + ch.cost + ' 🪙' : '') + '</button>').join("");
    const ends = sc.end ? '<button class="btn" id="qsAgain">' + L.qs_again + '</button>' : '';
    const timer = sc.timer ? '<div class="quiz-top" style="margin-top:8px"><span>' + L.qs_timer + '</span><span id="qsLeft">⏱ ' +
      sc.timer.left + '</span></div><div class="tbar"><i id="qsBar" style="width:' + (sc.timer.left / sc.timer.seconds * 100) + '%"></i></div>' : '';
    const input = sc.input ? '<div class="qs-input"><input id="qsAns" type="text" maxlength="40" autocomplete="off" autocapitalize="off" ' +
      'spellcheck="false" placeholder="' + esc(sc.input.hint || L.qs_answerPh) + '"><button class="btn" id="qsAnsGo">' + L.qs_check +
      '</button></div><div class="hint">' + fmt(L.qs_tries, { n: sc.input.tries_left }) + '</div>' : '';
    box.innerHTML = fxStage(esc(sc.title), '<button class="btn ghost" id="qsList" style="margin-top:0;padding:8px;font-size:13px">' + L.qs_list + '</button>' +
      '<div class="qs-text">' + qsText(sc.text) + '</div>' + (result || '') + timer + input + choices + ends);
    runFx(box, sc.mood || [], sc.fx_text, sc.fx_draw, sc.fx_lock);
    box.querySelector("#qsList").onclick = () => { stopGameTimer(); questOpen = null; go("games"); };
    const again = box.querySelector("#qsAgain");
    if (again) again.onclick = async () => {
      const r = await post("/api/quest/open", { id: sc.id, restart: true });
      if (r.ok) { questOpen = r; questScene(box, r); window.scrollTo(0, 0); }
    };
    const lock = on => box.querySelectorAll("[data-ch], #qsAnsGo").forEach(x => x.disabled = on);
    // общий разбор ответа сервера на выбор, ответ и «время вышло»
    const step = async (url, body) => {
      lock(true);
      try {
        const r = await post(url, Object.assign({ id: sc.id, scene: sc.scene }, body));
        if (!r.ok) { lock(false); return notify(r.message || L.error, false); }
        if (r.wait) { lock(false); return; }                        // время ещё не вышло — сервер считает сам
        if (r.stale) notify(L.qs_stale, false);
        questOpen = r.end ? null : r;
        let res = r.timeout ? '<div class="g-result lose"><b>' + L.qs_timeUp + '</b></div>' : '';
        if (r.outcome === "win_first") res += '<div class="g-result win"><b>' + fmt(L.qs_winFirst, { c: r.reward.coins, q: r.reward.res_each }) +
          '</b><br><span class="hint">' + fmt(L.g_balance, { b: num(r.balance) }) + '</span></div>';
        else if (r.outcome === "win_repeat") res += '<div class="g-result win">' + L.qs_winRepeat + '</div>';
        else if (r.outcome === "fail") res += '<div class="g-result lose">' + L.qs_fail + '</div>';
        else if (r.wrong) res += '<div class="g-result lose">' + fmt(L.qs_wrong, { n: r.input ? r.input.tries_left : 0 }) + '</div>';
        questScene(box, r, res);
        if (r.outcome) { vibrate(r.outcome !== "fail"); sparks(box.querySelector(".g-result:last-of-type"), r.outcome !== "fail"); }
        else if (r.wrong) vibrate(false);
        const top = box.querySelector(".qs-text");
        if (top && top.scrollIntoView) top.scrollIntoView({ block: "nearest" });
      } catch (e) { stopGameTimer(); apiError(e); go("games"); }
    };
    box.querySelectorAll("[data-ch]").forEach(b => { b.onclick = () => step("/api/quest/choose", { i: Number(b.dataset.ch) }); });
    const ans = box.querySelector("#qsAns"), go1 = box.querySelector("#qsAnsGo");
    if (ans) {
      const send = () => { if (ans.value.trim()) step("/api/quest/answer", { text: ans.value.trim() }); };
      go1.onclick = send;
      ans.onkeydown = e => { if (e.key === "Enter") send(); };
    }
    if (sc.timer) {
      const end = Date.now() + sc.timer.left * 1000;
      let asked = false;
      gameTimer = setInterval(() => {
        if (!box.isConnected) return stopGameTimer();
        const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
        const el = box.querySelector("#qsLeft"), bar = box.querySelector("#qsBar");
        if (el) el.textContent = "⏱ " + left;
        if (bar) bar.style.width = (left / sc.timer.seconds * 100) + "%";
        if (left <= 0 && !asked) { asked = true; step("/api/quest/timeout", {}).then(() => { asked = false; }); }
      }, 500);
    }
  }

  // 💻 Взлом кода: «быки и коровы» — 4 разные цифры, 🐂 на своём месте, 🐄 есть, но не там
  async function gameCode(box) {
    const r0 = await post("/api/code/new", {});
    if (!r0.ok) { box.innerHTML = card(L.g_name_code, gameHead() + '<div class="g-result">' + esc(r0.message) + '</div>'); bindBack(box); return; }
    let guess = "", busy = false, over = false;
    box.innerHTML = card(L.g_name_code, gameHead() + '<div class="hint" style="margin-top:10px">' + fmt(L.code_rules, { d: r0.digits, m: r0.max }) +
      ' ' + prizeLine("code") + '</div><div class="code-slots" id="cSlots"></div><div class="hint" id="cLeft" style="text-align:center">' +
      fmt(L.code_left, { n: r0.max }) + '</div><div class="code-pad">' +
      "1234567890".split("").map(c => '<button class="btn ghost" data-dg="' + c + '">' + c + '</button>').join("") +
      '</div><div class="two"><button class="btn ghost" id="cDel">⌫</button><button class="btn" id="cGo" disabled>' + L.code_try + '</button></div>' +
      '<div id="cRes"></div><div class="code-log" id="cLog"></div>');
    bindBack(box);
    const paint = () => {
      box.querySelector("#cSlots").innerHTML = Array.from({ length: r0.digits }, (_, i) => '<span>' + (guess[i] || "") + '</span>').join("");
      box.querySelectorAll("[data-dg]").forEach(b => { b.disabled = over || guess.includes(b.dataset.dg) || guess.length >= r0.digits; });
      box.querySelector("#cGo").disabled = over || busy || guess.length < r0.digits;
      box.querySelector("#cDel").disabled = over || !guess.length;
    };
    box.querySelectorAll("[data-dg]").forEach(b => { b.onclick = () => { guess += b.dataset.dg; paint(); }; });
    box.querySelector("#cDel").onclick = () => { guess = guess.slice(0, -1); paint(); };
    box.querySelector("#cGo").onclick = async () => {
      busy = true; paint();
      try {
        const r = await post("/api/code/guess", { round_id: r0.round_id, guess: guess });
        if (!r.ok) { busy = false; paint(); return notify(r.message || L.error, false); }
        box.querySelector("#cLog").insertAdjacentHTML("afterbegin", '<div><b>' + guess + '</b><span>🐂 ' + r.bulls + ' · 🐄 ' + r.cows + '</span></div>');
        box.querySelector("#cLeft").textContent = fmt(L.code_left, { n: r.left });
        busy = false;
        if (r.result) {
          over = true; vibrate(r.result === "win");
          guess = r.secret; paint();      // разгаданный (или так и не разгаданный) код — в самих ячейках
          const slots = box.querySelector("#cSlots");
          slots.classList.add(r.result === "win" ? "win" : "sad");
          sparks(slots, r.result === "win");
          box.querySelector("#cRes").innerHTML = '<div class="g-result ' + r.result + '">' + payoutHtml(r, '<b>' + L["g_" + r.result] + '</b>') +
            '</div><button class="btn" id="cAgain">' + L.g_again + '</button>';
          box.querySelector("#cAgain").onclick = () => gameCode(box);
          const again = box.querySelector("#cAgain");
          if (again.scrollIntoView) again.scrollIntoView({ block: "nearest" });
        } else { guess = ""; paint(); }
      } catch (e) { apiError(e); go("games"); }
    };
    paint();
  }

  // 🃏 Мемори: карточки открывает сервер — колоду в приложение не отдаём до конца партии
  async function gameMemory(box) {
    const r0 = await post("/api/memory/new", {});
    if (!r0.ok) { box.innerHTML = card(L.g_name_memory, gameHead() + '<div class="g-result">' + esc(r0.message) + '</div>'); bindBack(box); return; }
    let busy = false, over = false;
    box.innerHTML = card(L.g_name_memory, gameHead() + '<div class="hint" style="margin-top:10px">' + fmt(L.mem_rules, { p: r0.cards / 2, m: r0.max }) +
      ' ' + prizeLine("memory") + '</div><div class="quiz-top" style="margin-top:8px"><span id="mMoves">' + fmt(L.mem_moves, { a: 0, b: r0.max }) +
      '</span></div><div class="mem-grid">' + Array.from({ length: r0.cards }, (_, i) => '<button class="mem-card" data-card="' + i + '"></button>').join("") +
      '</div><div id="mRes"></div>');
    bindBack(box);
    const cardEl = i => box.querySelector('[data-card="' + i + '"]');
    box.querySelectorAll("[data-card]").forEach(b => { b.onclick = async () => {
      if (busy || over || b.classList.contains("open") || b.classList.contains("done")) return;
      busy = true;
      try {
        const idx = Number(b.dataset.card), r = await post("/api/memory/flip", { round_id: r0.round_id, idx: idx });
        if (!r.ok) { busy = false; return notify(r.message || L.error, false); }
        b.textContent = r.icon; b.classList.add("open");
        box.querySelector("#mMoves").textContent = fmt(L.mem_moves, { a: r.moves, b: r.max });
        if (r.pair !== null && r.pair !== undefined) {
          const other = cardEl(r.pair);
          if (r.match) { [b, other].forEach(x => { x.classList.remove("open"); x.classList.add("done"); }); }
          else {
            [b, other].forEach(x => x.classList.add("miss"));
            await new Promise(res => setTimeout(res, 700));
            if (!r.result) [b, other].forEach(x => { x.classList.remove("open", "miss"); x.textContent = ""; });
          }
        }
        if (r.result) {
          over = true; vibrate(r.result === "win");
          if (r.deck) r.deck.forEach((ic, i) => { const c = cardEl(i); if (!c.classList.contains("done")) { c.textContent = ic; c.classList.add("open"); } });
          const grid = box.querySelector(".mem-grid");
          sparks(grid, r.result === "win");

    const curSku = "seasonpass_" + d.season.replace("-", ""), next = d.sale.season !== d.season;
    const buyBtn = (sku, text) => '<button class="btn" data-passbuy="' + sku + '">' + fmt(text, { p: d.stars }) + '</button>';
    const buy = (d.premium ? '<div class="hint status-ok">' + L.pass_owned + '</div>' : buyBtn(curSku, L.pass_buy) + '<div class="hint">' + L.pass_buyHint + '</div>') +
      (next && !d.sale.owned ? buyBtn(d.sale.sku, L.pass_buyNext) : '');
    const head = '<b>🎟 ' + esc(d.theme) + '</b><div class="hint">' + fmt(L.pass_ends, { n: days }) + '</div>' +
      '<div class="sub2">' + fmt(L.pass_level, { n: d.level, max: d.max }) + '</div>' +
      '<div class="gr-bar"><i style="width:' + Math.round(Math.max(0, inLvl) / d.per_level * 100) + '%"></i></div>' +
      '<div class="hint">' + (d.level >= d.max ? L.pass_maxed : fmt(L.pass_xp, { x: Math.max(0, inLvl), need: d.per_level })) + '</div>' +
      '<div class="hint">' + L.pass_how + '</div>' +
      (d.game_xp_cap ? '<div class="hint' + (d.game_xp_today >= d.game_xp_cap ? ' status-bad' : '') + '">' +
        fmt(L.pass_gameCap, { x: d.game_xp_today || 0, cap: d.game_xp_cap }) +
        (d.game_xp_cap >= d.game_xp_cap_monthly ? ' ⚡' : ' ' + fmt(L.pass_gameCapUp, { cap: d.game_xp_cap_monthly })) + '</div>' : '') +
      '<button class="btn" id="passClaim"' + (ready ? '' : ' disabled') + '>' + L.pass_claim + '</button>' + buy;
    const rows = d.levels.map(l => {
      const open = l.level <= d.level, hasSkin = l.paid.some(r => r.kind === "skin");
      const cell = (label, got, locked) => '<span class="' + (got ? 'status-ok' : locked ? 'hint' : open ? 'st-c-legend' : 'hint') + '">' +
        (got ? '✅ ' : locked ? '🔒 ' : '') + esc(label) + '</span>';
      return '<div class="pt-row"><span class="pt-n">' + (hasSkin ? '✨' : '') + l.level + '</span>' + cell(l.free_label, d.claimed_free.includes(l.level), false) +
        cell(l.paid_label, d.claimed_paid.includes(l.level), !d.premium) + '</div>';
    });
    box.innerHTML = psSwitch() + card(L.pass_title, head) + card(L.pass_skins, passStrip(d)) +
      card(L.pass_tracks, '<div class="pt-row pt-head"><span class="pt-n">#</span><span>' + L.pass_free + '</span><span>' + L.pass_paid + '</span></div>' +
        pager("pass-rows", rows, 10, ''));
    bindPsSwitch(box);
    box.onclick = e => {
      const b = e.target.closest("button");
      if (!b || b.disabled) return;
      if (b.id === "passClaim") act(b, "/api/pass/claim", {}, async r => { notify(fmt(L.pass_got, { r: r.got }), true); await refreshMe().catch(() => {}); go("persona"); });
      else if (b.dataset.passbuy) buySku(b, b.dataset.passbuy, () => go("persona"));
    };
  }
  // Эксклюзивные скины пропуска — с уровнем, на котором открываются
  function passStrip(d) {
    const at = { marker: 5, frame: 10, title: 20, suit: 30 };
    return '<div class="hint">' + L.pass_skinsHint + '</div>' + ["marker", "frame", "title", "suit"].map(t => { const id = d.skins[t], s = SKC()[id];
      return s ? '<div class="gr-skin" style="--rc:' + RAR_COLOR[s.rarity] + '">' + skinPreview(id, 1) + '<div class="gr-info"><b>' + esc(s.name) + '</b><small>' +
        L["gr_r_" + s.rarity] + ' · ' + fmt(L.pass_atLvl, { n: at[t] }) + '</small></div></div>' : ''; }).join("");
  }
  function sellPanel(d, m) {
    const s = SKC()[m.skin_id] || {}, min = d.min_price[s.rarity];
    return '<div class="ps-sell"><label class="hint">' + fmt(L.ps_price, { min: num(min) }) + '</label>' +
      '<input id="grPrice" type="number" min="' + min + '" value="' + min + '"><button class="btn" id="grSellGo">' + L.ps_sellGo + '</button></div>';
  }
  // Покупка за ★ через обычный платёжный контур (инвойс → pre_checkout → доставка)
  async function buySku(btn, sku, after) {
    btn.disabled = true;
    try {
      const r = await post("/api/invoice", { sku: sku });
      if (!r.link) { notify(r.error || L.error, false); btn.disabled = false; return; }
      tg.openInvoice(r.link, status => { btn.disabled = false; if (status === "paid") { notify(L.gr_paid, true); setTimeout(after, 1500); } });
    } catch (e) { apiError(e); btn.disabled = false; }
  }
  // 📸 «Похвастаться»: карточка 1080×1920 с аватаром в скинах — в истории, другу или в галерею
  async function brag(box, d, worn) {
    const btn = document.getElementById("grBrag");
    btn.disabled = true;
    let c = {};
    try { c = await api("/api/card"); } catch (e) {}
    const W = 1080, H = 1920, cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const x = cv.getContext("2d"), F = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
    const C = d.catalog, frame = worn.frame && C[worn.frame.skin], title = worn.title && C[worn.title.skin];
    const suit = worn.suit && C[worn.suit.skin];
    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#07081a"); g.addColorStop(.5, suit ? suit.look.c2 + "55" : "#1a0b3a"); g.addColorStop(1, "#04121f");
    x.fillStyle = "#07081a"; x.fillRect(0, 0, W, H); x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.textAlign = "center";
    x.shadowColor = "#ff4d8d"; x.shadowBlur = 40; x.fillStyle = "#ff6fa5"; x.font = "900 100px " + F; x.fillText("ROFL HUB", W / 2, 170);
    const svg = avatarSvg(d.gender, {}, suit ? suit.look : null, worn.suit ? worn.suit.level : 1).replace('<svg ', '<svg width="480" height="920" ');
    try {
      const img = new Image();
      await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); });
      if (frame) { x.shadowColor = frame.look.c1; x.shadowBlur = 60; x.strokeStyle = frame.look.c1; x.lineWidth = 14; rr(x, 250, 260, 580, 1000, 80); x.stroke(); }
      const top = Math.max(1, ...Object.values(worn).map(w => w.level || 1));
      if (top >= 4) {   // ⚔️ боевой и выше — искры вокруг фигуры (детерминированно: карточка одинакова при повторе)
        for (let i = 0; i < 18 * Math.min(5, top - 2); i++) {
          const a = i * 2.39996, r = 330 + (i * 37) % 160;
          x.fillStyle = i % 3 ? (suit ? suit.look.c1 : "#00ffe1") : "#ffd23f"; x.shadowColor = x.fillStyle; x.shadowBlur = 18;
          x.beginPath(); x.arc(540 + Math.cos(a) * r * .75, 760 + Math.sin(a) * r * 1.25, 3 + i % 4, 0, 7); x.fill();
        }
      }
      x.shadowColor = suit ? suit.look.c1 : "#00ffe1"; x.shadowBlur = 50; x.drawImage(img, 300, 300, 480, 920);
      if (top >= 8) { x.shadowColor = "#ffd23f"; x.shadowBlur = 30; x.font = "120px " + F; x.fillText(top >= 10 ? "♾️" : "👑", W / 2, 300); }
    } catch (e) {}
    x.shadowBlur = 0; x.fillStyle = frame ? frame.look.c1 : "#ffffff"; x.font = "800 76px " + F; x.fillText(clip(me.display_name || c.name || "", 20), W / 2, 1370);
    if (title) { x.fillStyle = title.look.c1; x.font = "700 52px " + F; x.fillText(clip(title.text || title.name, 26), W / 2, 1450); }
    let y = 1540;
    Object.values(worn).slice(0, 4).forEach(w => { const s = C[w.skin]; if (!s) return;
      x.fillStyle = RAR_COLOR[s.rarity]; x.font = "600 40px " + F;
      x.fillText("✨ " + clip(s.name, 28) + (s.edition ? "  №" + w.serial + "/" + s.edition : "") + (w.level > 1 ? "  " + ST_ICON[skStage(w.level)] + w.level : ""), W / 2, y); y += 58; });
    x.fillStyle = "#00ffe1"; x.font = "500 36px " + F; x.fillText(String(c.link || "").replace(/^https:\/\//, ""), W / 2, 1860);
    const img = cv.toDataURL("image/jpeg", .9);
    let url = null;
    try { const r = await post("/api/card/upload", { image: img }); if (r.ok) url = r.url; } catch (e) {}
    const text = L.gr_bragText, canStory = url && tg && tg.shareToStory;
    const out = document.getElementById("grOut");
    out.innerHTML = '<img class="ach-img" src="' + img + '" alt="">' + (canStory ? '<button class="btn" id="grStory">' + L.ac_story + '</button>' : '') +
      '<button class="btn ghost" id="grSend">' + L.ac_send + '</button>';
    btn.style.display = "none";
    const st = document.getElementById("grStory");
    if (st) st.onclick = e => { e.stopPropagation(); try { tg.shareToStory(url, { text: clip(text + " " + (c.link || ""), 200) }); } catch (er) { notify(L.oldClient, false); } };
    document.getElementById("grSend").onclick = e => { e.stopPropagation(); shareLink(c.link || "", text); };
  }

  const VIEWS = { passport: viewPassport, persona: viewPersona, games: viewGames, farm: viewFarm, storage: viewStorage, workshop: viewWorkshop,
                  lab: viewLab, raids: viewRaids, market: viewMarket, auctions: viewAuctions, team: viewTeam, mines: viewMines, map: viewMap, friends: viewFriends, shop: viewShop,
                  top: viewTop, history: viewHistory, info: viewInfo };

  // ================= Шахта: визуальная сцена фермы =================
  let sceneTimer = null, coinTimer = null, minedVisit = 0;
  function unitCard(kind, n, fueled) {
    let status;
    if (kind === "premium") status = fueled === n ? "⚡ " + L.fueledAll : "🔴 " + fmt(L.fueledPart, { a: fueled, b: n });
    else if (kind === "intern") status = "♾ " + L.eternal;
    else status = "⏳ " + L.license;
    const idle = kind === "premium" && fueled === 0 ? " idle" : "";
    return '<div class="unit ' + kind + idle + '">' + robotImg(kind) +
      '<div class="cnt">×' + n + '</div><div class="unm">' + L["unit_" + kind] + '</div>' +
      '<div class="ust">' + status + '</div></div>';
  }
  function openScene(meData) {
    const f = meData.farm;
    let units = KINDS.filter(k => f[k]).map(k => unitCard(k, f[k], k === "premium" ? f.premium_fueled : f[k])).join("");
    if (!units) units = '<div class="empty">' + L.emptyFarm + '</div>';
    const stars = Array.from({ length: 26 }, (_, i) =>
      '<i style="left:' + ((i * 37) % 100) + '%;top:' + ((i * 53) % 55) + '%;animation-delay:' + (i % 7) * .4 + 's"></i>').join("");
    document.getElementById("scene").innerHTML =
      '<div class="scene-head"><button class="back" id="sceneBack">' + L.back + '</button><h2>' + L.farmScene + '</h2></div>' +
      '<div class="mine-scene"><div class="sky">' + stars + '</div><div class="moon"></div>' +
      '<div class="hill"></div><div class="arch"><span>⛏</span></div><div class="rails"></div>' +
      '<div class="units">' + units + '</div><div class="fx" id="coinsFx"></div></div>' +
      '<div class="card">' + row(L.speed, fmt(L.perHour, { v: "+" + f.speed_hour })) +
      row(L.minedVisit, '<span class="mined" id="minedVisit">+0.00</span>') + '</div>';
    ["app", "tabs", "footer"].forEach(id => document.getElementById(id).classList.add("hidden"));
    document.getElementById("scene").classList.remove("hidden");
    window.scrollTo(0, 0);
    document.getElementById("sceneBack").onclick = closeScene;
    if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeScene); }
    minedVisit = 0;
    const perTick = f.speed_hour / 3600 / 10;
    clearInterval(sceneTimer);
    sceneTimer = setInterval(() => {
      minedVisit += perTick;
      const el = document.getElementById("minedVisit");
      if (el) el.textContent = "+" + minedVisit.toFixed(2);
    }, 100);
    clearInterval(coinTimer);
    if (f.speed_hour > 0) coinTimer = setInterval(spawnCoin, Math.max(350, 5000 / (f.speed_hour / 5 + 1)));
  }
  function spawnCoin() {
    const box = document.getElementById("coinsFx");
    if (!box) return;
    const c = document.createElement("span");
    c.className = "coin"; c.textContent = "🪙";
    c.style.left = (10 + Math.random() * 80) + "%";
    box.appendChild(c);
    setTimeout(() => c.remove(), 1800);
  }
  function closeScene() {
    clearInterval(sceneTimer); clearInterval(coinTimer);
    document.getElementById("scene").classList.add("hidden");
    ["app", "tabs", "footer"].forEach(id => document.getElementById(id).classList.remove("hidden"));
    if (tg && tg.BackButton) { tg.BackButton.offClick(closeScene); tg.BackButton.hide(); }
  }

  // ================= Старт =================
  function renderChrome() {
    document.getElementById("subtitle").textContent = L.subtitle;
    document.getElementById("footer").innerHTML = esc(L.footer) +
      '<div class="made-by">' + esc(L.madeBy).replace("@mister_telebot",
        '<a href="https://t.me/mister_telebot">@mister_telebot</a>') + '</div>';
  }
  async function boot() {
    const tgLang = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || "ru";
    let guess = tgLang;
    try { guess = localStorage.getItem("rofl_lang") || tgLang; } catch (e) {}
    loadPack(guess);   // догадка о языке: грузится, пока сервер считает /api/me
    try {
      await refreshMe();
      await loadPack(me.lang);
      try { localStorage.setItem("rofl_lang", me.lang); } catch (e) {}
      setLang(me.lang);
      renderChrome();
      current = startTab();
      let fxGal = false;
      try { fxGal = new URLSearchParams(location.search).get("fx") === "gallery"; } catch (e) {}
      if (fxGal && me.is_owner) { current = "games"; renderTabs(); gameScreen = "quests"; return questFxGallery(document.getElementById("app")); }
      await go(current);
      setTimeout(() => { prefetchMain().catch(() => {}); }, 600);   // после первой вкладки, не мешая ей
      const next = () => { if (!me.app_mode) chooseMode(checkUnlocks); else checkUnlocks(); };
      const code = inviteCode();
      if (code) offerDuel(code, next); else next();
    } catch (e) {
      const code = tgLang;
      await loadPack(code);
      setLang(code);
      let msg = L.error;
      if (e.status === 401) msg = L.outside;
      else if (e.status === 404) msg = L.noProfile;
      else if (e.status === 403) msg = (e.body && e.body.error === "deleting") ? L.deleting : L.blocked;
      document.getElementById("app").innerHTML = '<div class="err">' + msg + '</div>';
    }
  }
  window.__rofl = { setMe: m => { me = m; }, go: go, setLang: setLang, renderChrome: renderChrome, startTab: startTab };

  if (!initData) {
    document.getElementById("app").innerHTML = '<div class="err">' + I18N.ru.outside + '</div>';
  } else {
    boot();
  }
})();
</script>
</body>
