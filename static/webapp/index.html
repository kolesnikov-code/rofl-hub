  // ================= 🏴‍☠️ Налёты =================
  const MOVES = ["rock", "scissors", "paper"];
  const dateShort = iso => new Date(iso).toLocaleString(me.lang === "ru" ? "ru-RU" : "en-GB",
    { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  // Обратный отсчёт «ЧЧ:ММ:СС» (часы могут быть больше 24 — щит на неделю = 167:59:59)
  function hms(ms) {
    const sec = Math.max(0, Math.floor(ms / 1000)), p = n => String(n).padStart(2, "0");
    return p(Math.floor(sec / 3600)) + ":" + p(Math.floor(sec % 3600 / 60)) + ":" + p(sec % 60);
  }
  let shieldTick = null;
  // «1 д 5 ч» / «5 ч 12 мин» / «12 мин» — сколько ждать
  function dur(sec) {
    const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.max(1, Math.ceil(sec % 3600 / 60));
    return d ? fmt(L.durDH, { d: d, h: h }) : h ? fmt(L.durHM, { h: h, m: m % 60 }) : fmt(L.durM, { m: m });
  }
  async function viewRaids(box) {
    const d = await api("/api/raids");
    const R = d.rules;
    const fuelOk = (d.stock.hydrogen || 0) >= R.fuel;
    // Корабль без топлива не «готов к вылету», даже если перезарядка закончилась
    const ship = !fuelOk ? '<div class="hint status-bad">' + L.raid_noFuel + '</div>'
      : d.cooldown_left > 0 ? '<div class="hint">' + fmt(L.raid_cooldown, { m: Math.ceil(d.cooldown_left / 60) }) + '</div>'
      : '<div class="hint status-ok">' + L.raid_ready + '</div>';
    const stance = MOVES.map(m => '<button class="mv' + (d.stance === m ? ' on' : '') + '" data-st="' + m + '">' + L[m] + '</button>').join("");
    const revenge = d.revenge.map(r => '<button class="btn danger rv" data-id="' + r.raid_id + '" data-name="' + esc(r.name) + '">' +
      fmt(L.raid_revengeBtn, { name: esc(r.name) }) + ' · ' + bundle(r.loot) + '</button>').join("");
    const sh = d.shield, shOn = !!sh.active, shUntil = sh.until ? new Date(sh.until).getTime() : null;
    // Что «наготове» на следующий вылет и что охраняет склад (изделия со склада)
    const ch = d.charges || {}, gd = d.guards || {};
    const armed = [ch.economizer ? '⛽ ' + L.it_economizer + ' ×' + ch.economizer : '', ch.cargo ? '📦 ' + L.it_cargo + ' ×' + ch.cargo : '']
      .filter(Boolean).join(" · ");
    const guards = ["camo", "trap", "drill"].filter(k => gd[k]).map(k =>
      '<div class="hint status-ok">' + IT_ICON[k] + ' ' + fmt(L.raid_guardUntil, { n: L["it_" + k], t: dateShort(gd[k]) }) + '</div>').join("");
    const fs = d.forsage || {};
    const forsageBtn = d.cooldown_left > 0 && fs.qty > 0 && fs.ready
      ? '<button class="btn ghost" id="forsageBtn">' + fmt(L.raid_forsageBtn, { n: fs.qty }) + '</button>' : '';
    const shieldCard = '<div class="card shield-card ' + (shOn ? 'on' : 'off') + '"><h2>' + L.raid_shieldTitle + '</h2>' +
      '<div class="sh-state">' + (shOn ? L.raid_shieldActive : L.raid_shieldInactive) + '</div>' +
      (shOn && !shUntil ? '<div class="balance small">' + L.raid_shieldNewbie + '</div>'
        : '<div class="sh-timer" id="shTimer">' + (shUntil ? hms(shUntil - Date.now()) : "00:00:00") + '</div>') +
      (shUntil ? '<div class="hint">' + fmt(L.raid_shieldOn, { t: dateShort(sh.until) }) + '</div>' : '') +
      (sh.dome ? '<div class="hint status-ok">' + fmt(L.raid_domeOn, { t: dateShort(sh.dome) }) + '</div>' : '') + guards +
      '<div class="hint">' + L.raid_shieldHint + '</div>' +
      (shOn ? '' : '<button class="btn ghost" id="shStore">' + L.raid_toStorage + '</button>') + '</div>';
    box.innerHTML =
      '<div class="card"><div class="card-head"><h2>' + L.raid_title + '</h2>' +
        '<span class="fuel-pill' + (fuelOk ? '' : ' low') + '">💧 ' + num(d.stock.hydrogen) + ' / ' + R.fuel + '</span></div>' +
        ship + (armed ? '<div class="hint status-ok">' + fmt(L.raid_armed, { l: armed }) + '</div>' : '') +
        // Технологии (27.10): без 📡🔭⚔️ первого уровня налётов нет; топливо налёта — водород, батарейки не нужны
        '<div class="chips">' + ["comm", "scout", "attack", "defense"].map(k => '<span class="chip ' + (d.tech[k] || k === "defense" ? 'have' : 'lack') + '">' +
          TECH_ICON[k] + ' ' + d.tech[k] + '</span>').join("") + '</div>' +
        (["comm", "scout", "attack"].some(k => !d.tech[k]) ? '<div class="hint status-bad">' + L.raid_needTech + '</div><button class="btn ghost" data-go="lab">' + L.raid_toLab + '</button>' : '') +
        '<div class="hint">' + fmt(L.raid_scoutInfo, { n: d.candidates }) + '</div>' +
        '<div class="hint ' + (d.meds ? 'status-ok' : '') + '">' + (d.meds ? fmt(L.raid_medsOn, { t: dateShort(d.meds) }) : L.raid_medsOff) + '</div>' +
        '<div class="hint">' + fmt(L.raid_stats, { a: d.stats.attacks, w: d.stats.attack_wins, h: d.stats.defense_holds, d: d.stats.defenses }) + '</div>' +
        forsageBtn +
        '<button class="btn scene-btn" id="scoutBtn">' + L.raid_scout + '</button>' +
        '<div id="raidStage"></div></div>' +
      shieldCard +
      (revenge ? card(L.raid_revenge, revenge) : '') +
      card(L.raid_stance, '<div class="moves">' + stance + '</div><div class="hint">' +
        (d.stance ? L.raid_stanceHint : L.raid_stanceNone) + '</div>') +
      card(L.raid_how, '<ol class="rules">' +
        '<li>' + L.raid_rule1 + '</li>' +
        '<li>' + fmt(L.raid_rule2, { pct: R.loot_pct, cap: R.loot_cap, fpct: R.fail_pct, fcap: R.fail_cap }) + '</li>' +
        '<li>' + fmt(L.raid_rule3, { days: R.newbie_days }) + '</li>' +
        '<li>' + fmt(L.raid_rule4, { fuel: R.fuel, cd: R.cooldown_h, rh: R.revenge_h }) + '</li></ol>');
    clearInterval(shieldTick);
    if (shUntil) shieldTick = setInterval(() => {
      const el = document.getElementById("shTimer");
      if (!el) { clearInterval(shieldTick); return; }
      const left = shUntil - Date.now();
      el.textContent = hms(left);
      if (left <= 0) { clearInterval(shieldTick); go("raids"); }
    }, 1000);
    box.querySelectorAll("[data-go]").forEach(b => { b.onclick = () => go(b.dataset.go); });
    const shb = document.getElementById("shStore");
    if (shb) shb.onclick = () => go("storage");
    const fb = document.getElementById("forsageBtn");
    if (fb) fb.onclick = () => act(fb, "/api/item/use", { effect: "forsage", hours: 0 }, async () => {
      notify(L.it_forsaged); go("raids");
    });
    document.querySelectorAll(".mv[data-st]").forEach(b => {
      b.onclick = () => act(b, "/api/raid/stance", { stance: b.dataset.st }, async () => { notify(L.raid_stanceSaved); go("raids"); });
    });
    document.querySelectorAll(".rv").forEach(b => {
      b.onclick = () => pickMove(document.getElementById("raidStage"), { revenge: Number(b.dataset.id) }, b.dataset.name);
    });
    const sb = document.getElementById("scoutBtn");
    sb.onclick = () => act(sb, "/api/raid/scout", {}, async res => {
      sb.disabled = false;
      const stage = document.getElementById("raidStage");
      if (!res.targets.length) { stage.innerHTML = '<div class="hint">' + L.raid_noTargets + '</div>'; return; }
      stage.innerHTML = '<div class="sub2">' + L.raid_targets + '</div>' + res.targets.map(tg =>
        '<button class="target" data-slot="' + tg.slot + '" data-name="' + esc(tg.name) + '">🎯 ' + esc(tg.name) +
        (tg.rank ? ' <span class="rank">' + esc(tg.rank) + '</span>' : '') +
        '<span class="tr">' + fmt(L.raid_res, { n: tg.total }) + '</span></button>').join("");
      stage.querySelectorAll(".target").forEach(b => {
        b.onclick = () => pickMove(stage, { slot: Number(b.dataset.slot) }, b.dataset.name);
      });
    });
  }

  // ================= ⛏ Рудники: карта, битва за рудник, добыча команды =================
  const MINE_COLOR = { metal: "#c0c7d6", hydrogen: "#60a5fa", crystal: "#c084fc", parts: "#fbbf24", stone: "#a8a29e",
                       wood: "#d97706", energy: "#facc15" };
  let mineSel = null;
  function minePos(id, cols, rows) {
    // Детерминированная «карта»: сетка со смещением каждого рудника — выглядит живо, но не перекрывается
    const i = id - 1, c = i % cols, r = Math.floor(i / cols);
    const jx = ((id * 37) % 11 - 5) / 22, jy = ((id * 53) % 11 - 5) / 22;
    return { x: (c + 0.5 + jx) / cols * 100, y: 3 + (r + 0.5 + jy) / rows * 90 };   // снизу место под подпись «№»
  }
  async function viewMines(box) {
    const d = await api("/api/mines");
    const narrow = box.clientWidth < 560, cols = narrow ? 5 : 6, rows = Math.ceil(d.mines.length / cols);
    const battleBy = {}; d.battles.forEach(b => { (b.mine_ids || [b.mine_id]).forEach(id => { battleBy[id] = b; }); });
    const tiles = d.mines.map(m => {
      const p = minePos(m.id, cols, rows), held = !!m.team;
      const cls = 'mine ' + (held ? 'held' : 'free') + (m.mine ? ' mine-own' : '') + (m.target ? ' target' : '') + (mineSel === m.id ? ' sel' : '');
      return '<button class="' + cls + '" data-id="' + m.id + '" style="left:' + p.x.toFixed(2) + '%;top:' + p.y.toFixed(2) + '%;--mc:' + MINE_COLOR[m.kind] + '">' +
        (held ? '<i class="drop"></i><i class="drop"></i><i class="drop"></i>' : '') + RES_ICON[m.kind] +
        (m.target ? '<span class="tb">⚔️</span>' : held ? '<span class="tb">' + esc(m.team.symbol || '🏆') + '</span>' : '') +
        '<span class="no">№' + m.id + '</span></button>';
    }).join("");
    const terrain = '<svg class="terrain" viewBox="0 0 100 60" preserveAspectRatio="none">' +
      '<path d="M0 42 Q15 30 30 38 T60 34 T100 40" fill="none" stroke="#2c3d66" stroke-width=".5"/>' +
      '<path d="M0 22 Q20 12 40 20 T80 16 T100 22" fill="none" stroke="#3a2c5c" stroke-width=".5"/>' +
      '<path d="M0 52 Q25 46 50 52 T100 50" fill="none" stroke="#24405a" stroke-width=".4"/></svg>';
    const lock = d.battles.length ? '' : '<div class="map-lock">' + L.mn_closed + '</div>';
    const mapCard = '<div class="card span-all"><h2>' + L.mn_title + '</h2>' +
      '<div class="minemap" style="aspect-ratio:' + cols + ' / ' + (rows * (narrow ? 1.25 : 0.88)).toFixed(2) + '">' + terrain + tiles + lock + '</div>' +
      '<div class="hint" style="margin-top:8px">' + L.mn_pick + '</div></div>';
    const battleCards = d.battles.map(b => {
      const leaders = b.leaders.length ? b.leaders.map((x, i) => '<div class="lead-row' + (x.mine ? ' me' : '') + '"><b>' +
          ['🥇', '🥈', '🥉'][i] + ' ' + esc(x.name) + '</b><span>' + num(x.score) + '</span></div>').join("")
        : '<div class="hint">' + L.mn_noLeaders + '</div>';
      // 🔋 Заявка команды: за рудники бьются только команды, скинувшиеся батарейками
      const e = b.entry;
      const entry = !e ? '' : !e.allowed ? '<div class="hint status-bad">' + L.bt_notAllowed + '</div>'
        : e.registered ? '<div class="hint status-ok">' + L.bt_entered + '</div>'
        : '<div class="stres"><div class="row"><span class="k">' + fmt(L.bt_entry, { n: e.batteries, m: e.fee }) + '</span></div>' +
          '<div class="bar"><i style="width:' + Math.round(e.batteries / e.fee * 100) + '%"></i></div></div>' +
          '<button class="btn ghost btGive" data-b="' + b.id + '"' + (d.batteries > 0 ? '' : ' disabled') + '>' + fmt(L.bt_give, { n: d.batteries }) + '</button>';
      return card(fmt(b.started ? L.mn_battle : L.mn_soon, { t: esc(b.title), n: (b.mine_ids || [b.mine_id]).join(", №"), d: dateShort(b.starts_at) }),
        '<div class="hint">' + fmt(L.mn_nom, { n: esc(b.nomination) }) + '</div>' +
        '<div class="hint">' + fmt(L.mn_ends, { d: dateShort(b.ends_at) }) + '</div>' + entry +
        '<div class="hint">' + fmt(L.bt_info, { f: d.fee.team, fc: d.fee.clan }) + '</div>' +
        (b.started ? '<div class="sub2">' + L.mn_leaders + '</div>' + leaders : ''));
    }).join("");
    // Ход добычи на рудниках своей команды: сколько добыто всеми бойцами и сколько осталось
    const myMines = (d.my_mines || []).map(x => {
      const a = new Date(x.captured_at).getTime(), b = new Date(x.until).getTime(), pct = Math.min(100, Math.round((Date.now() - a) / (b - a) * 100));
      return '<div class="stres"><div class="row"><span class="k">' + fmt(L.mn_name, { n: x.id }) + ' · ' + RES_ICON[x.kind] + '</span><span class="v">' +
        fmt(L.mn_mined, { n: num(x.mined), i: RES_ICON[x.kind] }) + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="hint">' + fmt(L.mn_left, { t: dur(Math.max(0, (b - Date.now()) / 1000)) }) + '</div></div>';
    }).join("");
    const teamCard = card(L.mn_myTeam, d.in_team
      ? (d.my_income ? '<div class="balance small">' + fmt(L.mn_income, { n: d.my_income }) + '</div>' + myMines + '<div class="hint">' + L.mn_commNote + '</div>' : '<div class="hint">' + L.mn_noIncome + '</div>')
      : '<div class="hint">' + L.mn_noTeam + '</div><button class="btn ghost" data-go="team">' + L.mn_teamBtn + '</button>');
    const rules = card(L.mn_how, '<ol class="rules"><li>' + L.mn_rule1 + '</li><li>' +
      fmt(L.mn_rule2, { h: d.hold_hours, y: d.yield }) + '</li><li>' + L.mn_rule3 + '</li></ol>');
    box.innerHTML = mapCard + '<div class="card" id="mineInfo"><h2>' + L.mn_info + '</h2><div class="hint">' + L.mn_pick + '</div></div>' +
      battleCards + teamCard + rules;
    const info = id => {
      const m = d.mines.find(x => x.id === id), b = battleBy[id];
      let body = row(L.mn_res, RES_ICON[m.kind] + ' ' + esc(d.res_names[m.kind]));
      if (m.team) body += row(L.mn_holder, esc(m.team.symbol) + ' ' + esc(m.team.name) + (m.mine ? ' 🏆' : '')) +
        row(L.mn_untilL, dateShort(m.until)) + '<div class="hint status-ok">' + fmt(L.mn_pumping, { n: m.team.members * d.yield, i: RES_ICON[m.kind] }) + '</div>';
      else body += row(L.mn_holder, L.mn_free);
      body += b ? '<div class="hint status-ok">' + fmt(L.mn_targetOf, { t: esc(b.title) }) +
          (m.place ? ' · ' + fmt(L.mn_place, { p: m.place }) : '') + '</div>'
        : '<div class="hint">' + L.mn_closedOne + '</div>';
      document.getElementById("mineInfo").innerHTML = '<h2>' + fmt(L.mn_name, { n: id }) + '</h2>' + body;
    };
    box.querySelectorAll(".mine").forEach(el => {
      el.onclick = () => {
        mineSel = Number(el.dataset.id);
        box.querySelectorAll(".mine.sel").forEach(x => x.classList.remove("sel"));
        el.classList.add("sel"); info(mineSel);
      };
    });
    box.querySelectorAll("[data-go]").forEach(b => { b.onclick = () => go(b.dataset.go); });
    box.querySelectorAll(".btGive").forEach(b => {
      b.onclick = () => act(b, "/api/battle/battery", { battle_id: Number(b.dataset.b) }, res => {
        notify(res.registered ? L.bt_entered : fmt(L.bt_entry, { n: res.batteries, m: res.fee })); go("mines");
      });
    });
    if (mineSel && d.mines.some(x => x.id === mineSel)) info(mineSel);
  }

  // ================= 📦 Склад: ресурсы, котлеты, изделия мастерской, улучшения =================
  // Пустое — серое и неприметное; есть хоть одно — плашка медленно переливается, как лавовая лампа.
  const IT_ICON = { nitrogen: "❄️", nuclear: "☢️", drone: "🚁", shield: "🛡", unlimit: "♾", camo: "🎭", trap: "🪤",
    drill: "🎯", thermos: "🧊", banner: "🏳️", dome: "🛡", forsage: "🔥", economizer: "⛽", cargo: "📦", stamp: "📜", meds: "💊" };
  const TEAM_FX = ["banner", "dome"];
  async function viewStorage(box) {
    const d = await api("/api/storage");
    // Котлеты — тоже ресурс склада (первая строка, без лимита вместимости); изделия — общий счётчик
    const cutRow = '<div class="resbar"><div class="row"><span class="k">🥩 ' + L.sk_cutletsName + '</span><span class="v">' +
      num(d.cutlets) + '</span></div><div class="hint">' + L.sk_cutletsHint + '</div></div>';
    const resRows = (d.kinds || RES).map(k => {
      const have = d.stock[k] || 0, pct = Math.min(100, Math.round(have / d.capacity * 100));
      return '<div class="resbar"><div class="row"><span class="k">' + RES_ICON[k] + ' ' + esc(d.res_names[k]) +
        '</span><span class="v">' + num(have) + ' / ' + num(d.capacity) + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div></div>';
    }).join("");
    const itemsFull = d.items_count >= d.items_cap;
    const resCard = '<div class="card span-all"><h2>' + L.sk_res + '</h2>' +
      '<div class="hint' + (itemsFull ? ' status-bad' : '') + '">' + fmt(L.sk_items, { n: d.items_count, m: d.items_cap }) + '</div>' +
      '<div class="res-cols">' + cutRow + resRows + '</div>' +
      '<div class="res-actions"><button class="btn ghost" data-go="workshop">' + L.sk_expand + '</button>' +
      '<button class="btn ghost" data-go="farm">' + L.sk_refuel + '</button></div></div>';
    const itemCards = d.effects.map(e => {
      const units = d.items.filter(it => it.effect === e);
      const until = d.active[e], charged = (d.charges || {})[e] || 0;
      const needTeam = TEAM_FX.includes(e) && !d.in_team;
      const total = units.reduce((a, it) => a + it.qty, 0);
      const body = units.length
        ? '<div class="hint">' + fmt(L.it_total, { n: total }) + '</div>' + units.map(it => '<div class="unit-row"><b>' + (it.hours ? '⏱ ' + fmt(L.it_hours, { h: it.hours }) : '⚡ ' + L.it_oneShot) + ' × ' + it.qty + '</b>' +
            '<button class="mini itUse" data-e="' + e + '" data-h="' + it.hours + '"' + (needTeam ? ' disabled' : '') + '>' + L.it_use + '</button></div>').join("") +
          (needTeam ? '<div class="hint status-bad">' + L.it_needTeam + '</div>' : '')
        : '<div class="hint">' + L.it_empty + '</div><button class="btn ghost" data-go="workshop">' + L.it_toWorkshop + '</button>';
      // Запас есть — «лава»; запаса нет, но эффект действует — обычная плашка; ничего — серая
      return '<div class="card ' + (units.length ? 'lava' : (until || charged) ? '' : 'dim') + '"><h2>' + IT_ICON[e] + ' ' + L["it_" + e] + '</h2>' +
        '<div class="hint">' + (e === "unlimit" ? L.it_unlimitDesc : L["eff_" + e]) + '</div>' +
        (until ? '<div class="hint status-ok">' + fmt(L.it_active, { t: dateShort(until) }) + '</div>' : '') +
        (charged ? '<div class="hint status-ok">' + fmt(L.it_charges, { n: charged }) + '</div>' : '') + body + '</div>';
    }).join("");
    const P = d.perm;
    const perm = (on, title, text) => '<div class="card ' + (on ? 'lava' : 'dim') + '"><h2>' + title + '</h2><div class="hint">' + text + '</div></div>';
    const permCards =
      perm(P.shuttle, L.sk_shuttle, P.shuttle ? fmt(L.sk_shuttleOn, { f: P.shuttle_fee }) : L.sk_shuttleOff) +
      perm(P.armor_level > 0, L.sk_armor, P.armor_level > 0
        ? fmt(L.sk_armorOn, { l: P.armor_level, m: P.armor_max, p: P.armor_level * P.armor_pct, t: P.armor_until ? dateShort(P.armor_until) : "—" })
        : fmt(L.sk_armorOff, { p: P.armor_pct })) +
      perm(P.capacity > P.capacity_base, L.sk_store, fmt(L.sk_storeLvl, { c: num(P.capacity) }) + (P.capacity_max ? '<br>' + L.sk_storeMax : '')) +
      // 🤖 Боевые дроны — эксклюзив: не тратятся, склад не занимают
      (() => { const D = d.drones || {}, total = (D.guard || 0) + (D.attack || 0) + (D.spy || 0);
        return perm(total > 0, L.dr_title, ["guard", "attack", "spy"].map(k => L["dr_" + k] + ': <b>' + (D[k] || 0) + '</b>').join("<br>") +
          '<br>' + L.dr_hint); })();
    // 🐎 Конюшня: лошади (продаёт игра за монеты) и телеги (мастерская) — лоты на бирже
    const st = d.stable || {}, sh = d.shuttle || {};
    const stableCard = '<div class="card ' + (st.horses ? 'lava' : 'dim') + '"><h2>' + L.sk_stable + '</h2>' +
      '<div class="big-num">🐎 ' + (st.horses || 0) + '/' + st.max_horses + ' · 🛒 ' + (st.carts || 0) + '/' + st.max_carts + '</div>' +
      '<div class="hint">' + fmt(L.sk_lots, { n: st.lots }) + '</div><div class="hint">' + L.sk_stableHint + '</div>' +
      (st.next_price ? '<button class="btn ghost" id="horseBtn"' + (st.balance >= st.next_price ? '' : ' disabled') + '>' +
        fmt(L.sk_buyHorse, { p: num(st.next_price) }) + '</button>' : '') + '</div>';
    const shuttleCard = sh.owned ? '<div class="card ' + (sh.active ? 'lava' : 'dim') + '"><h2>' + L.sk_shuttleCharge + '</h2>' +
      '<div class="hint ' + (sh.active ? 'status-ok' : 'status-bad') + '">' + (sh.active ? fmt(L.sk_shuttleUntil, { t: dateShort(sh.until) }) : L.sk_shuttleEmpty) + '</div>' +
      '<button class="btn ghost" id="shChargeBtn"' + ((d.stock.battery || 0) > 0 ? '' : ' disabled') + '>' + fmt(L.sk_chargeBtn, { d: sh.days }) + '</button></div>' : '';
    box.innerHTML = resCard + stableCard + shuttleCard + itemCards + permCards;
    const hb = document.getElementById("horseBtn");
    if (hb) hb.onclick = () => act(hb, "/api/horse/buy", {}, async () => { notify(L.sk_horseBought); await refreshMe(); go("storage"); });
    const sc = document.getElementById("shChargeBtn");
    if (sc) sc.onclick = () => act(sc, "/api/shuttle/charge", {}, async res => { notify(fmt(L.sk_shuttleUntil, { t: dateShort(res.until) })); go("storage"); });
    box.querySelectorAll("[data-go]").forEach(b => { b.onclick = () => go(b.dataset.go); });
    box.querySelectorAll(".itUse").forEach(b => {
      b.onclick = () => act(b, "/api/item/use", { effect: b.dataset.e, hours: Number(b.dataset.h) }, async res => {
        notify(res.effect === "forsage" ? L.it_forsaged : res.charges !== null && res.charges !== undefined ? L.it_charged
          : fmt(L.it_used, { t: dateShort(res.until) }));
        await refreshMe(); go("storage");
      });
    });
  }
  function pickMove(stage, target, name) {
    stage.innerHTML = '<div class="sub2">' + fmt(L.raid_pickMove, { name: esc(name) }) + '</div><div class="moves">' +
      MOVES.map(m => '<button class="mv" data-mv="' + m + '">' + L[m] + '</button>').join("") + '</div>';
    stage.scrollIntoView({ behavior: "smooth", block: "center" });
    stage.querySelectorAll(".mv").forEach(b => {
      b.onclick = () => act(b, "/api/raid/go", Object.assign({ move: b.dataset.mv }, target), async res => {
        const title = { win: L.raid_win, draw: L.raid_draw, lose: L.raid_lose }[res.result];
        const loot = res.result === "win" ? fmt(L.raid_loot, { l: bundle(res.loot) })
          : res.result === "lose" ? fmt(L.raid_lost, { l: bundle(res.loot) }) : "";
        const vs = fmt(L.raid_vs, { m: L[res.move], s: L[res.stance] });
        const notes = (res.notes || []).map(n => L["raid_note_" + n]).filter(Boolean).join("\n");
        notify(title + "\n" + vs + (loot ? "\n" + loot : "") + (notes ? "\n" + notes : ""), res.result !== "lose");
        await refreshMe(); go("raids");
      });
    });
  }

  // ================= 📈 Биржа v2: котлеты и ресурсы, заявки, график, индекс, обмен =================
  const ASSETS = ["cutlet", "metal", "hydrogen", "crystal", "parts", "stone", "wood", "fire", "energy", "battery", "cow", "core"];
  const A_ICON = { cutlet: "🥩", metal: "⛏", hydrogen: "💧", crystal: "💎", parts: "⚙️", stone: "🪨", wood: "🪵",
                   fire: "🔥", energy: "⚡", battery: "🔋", cow: "🐄", core: "☢️" };
  let mkAsset = "cutlet", mkScope = "public";   // mkScope: "public" — общая биржа, "team" — биржа команды
  function chartSvg(history) {
    const pts = history.map((d, i) => [i, d.avg]).filter(p => p[1] !== null);
    if (!pts.length) return '<div class="hint">' + L.mk_noTrades + '</div>';
    const vals = pts.map(p => p[1]);
    const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    const W = 300, H = 90, pad = 10, n = Math.max(history.length - 1, 1);
    const x = i => pad + i * (W - 2 * pad) / n;
    const y = v => hi === lo ? H / 2 : H - pad - (v - lo) * (H - 2 * pad) / (hi - lo);
    const line = pts.map(p => x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1)).join(" ");
    const dots = pts.map(p => '<circle cx="' + x(p[0]).toFixed(1) + '" cy="' + y(p[1]).toFixed(1) + '" r="3"/>').join("");
    const days = history.map((d, i) => '<text x="' + x(i).toFixed(1) + '" y="' + (H + 12) + '">' + d.day.slice(8) + '</text>').join("");
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 16) + '"><polyline points="' + line + '"/>' + dots + days + '</svg>';
  }
  function idxChip(a, ix) {
    let tail = "—";
    if (ix && ix.last !== null) {
      const ch = ix.change_pct;
      const cls = ch > 0 ? "up" : ch < 0 ? "down" : "";
      tail = num(Math.round(ix.last)) + ' <span class="' + cls + '">' + (ch > 0 ? "▲" : ch < 0 ? "▼" : "•") + Math.abs(ch || 0) + '%</span>';
    }
    return '<button class="idx' + (a === mkAsset ? ' on' : '') + '" data-asset="' + a + '">' + A_ICON[a] + ' ' + tail + '</button>';
  }
  async function viewMarket(box) {
    let m;
    try { m = await api("/api/market?asset=" + mkAsset + "&scope=" + mkScope); }
    catch (e) { if (mkScope !== "team") throw e; mkScope = "public"; m = await api("/api/market?asset=" + mkAsset); }
    const a = m.asset, icon = A_ICON[a], name = L["as_" + a];
    const scopeKey = m.scope === "team" ? "t-" : "";   // у командной биржи свои номера страниц
    // Переключатель «Общая биржа / Биржа команды» — у кого есть команда
    const scopeRow = m.team ? '<div class="idxrow">' +
      '<button class="idx scope' + (m.scope !== "team" ? ' on' : '') + '" data-scope="public">' + L.mk_scopePublic + '</button>' +
      '<button class="idx scope' + (m.scope === "team" ? ' on' : '') + '" data-scope="team">' + L.mk_scopeTeam + ' · ' + m.team.fee + '%</button></div>' : '';
    const stockLine = '<div class="chips">' + RES_ALL.filter(k => k !== "core").map(k => '<span class="chip">' + RES_ICON[k] + ' ' + num(m.stock[k] || 0) + '</span>').join("") +
      '<span class="chip">🥩 ' + num(m.inv) + '</span></div>';
    const PER = 5;   // лотов на странице: плашка не растёт, сколько бы их ни было
    const asks = pager(scopeKey + "asks-" + a, m.asks.map(o => '<div class="offer"><div class="ol">' + o.qty + ' ' + icon + ' × ' + num(o.price) + ' 🪙</div>' +
      '<button class="mini take" data-id="' + o.id + '" data-q="' + o.qty + '" data-p="' + o.price + '" data-side="sell">🛒</button>' +
      '<div class="buyrow hidden" id="q' + o.id + '"></div></div>'), PER, '<div class="hint">' + L.mk_empty + '</div>', bindMarket);
    const bids = pager(scopeKey + "bids-" + a, m.bids.map(o => '<div class="offer"><div class="ol">' + o.qty + ' ' + icon + ' × ' + num(o.price) + ' 🪙</div>' +
      '<button class="mini ghost take" data-id="' + o.id + '" data-q="' + o.qty + '" data-p="' + o.price + '" data-side="buy">' + L.mk_sellTo + '</button>' +
      '<div class="buyrow hidden" id="q' + o.id + '"></div></div>'), PER, '<div class="hint">' + L.mk_noBids + '</div>', bindMarket);
    const mine = m.my.length ? pager("my", m.my.map(o => '<div class="offer"><div class="ol">' + (o.team ? '🏆 ' : '') + (o.side === "sell" ? L.mk_side_sell : L.mk_side_buy) + ': ' +
      o.qty + ' ' + A_ICON[o.asset] + ' × ' + num(o.price) + ' 🪙</div><button class="mini ghost cancel" data-id="' + o.id + '">' +
      L.mk_cancel + '</button></div>'), PER, "", bindMarket) : "";
    const startPrice = m.stats.best_price || m.stats.best_bid || m.min_price;
    const form = (id, title, hint, btn, disabled, holding) => card(title,
      (hint ? '<div class="hint">' + hint + '</div>' : '') +
      '<div class="holding">' + holding + '</div>' +
      '<label class="lbl">' + fmt(L.mk_qtyAny, { x: icon }) + '<input id="' + id + 'Q" type="number" inputmode="numeric" min="1" max="' + m.max_qty + '" value="1"></label>' +
      '<label class="lbl">' + L.mk_price + '<input id="' + id + 'P" type="number" inputmode="numeric" min="' + m.min_price + '" max="' + m.max_price + '" value="' + startPrice + '"></label>' +
      '<div class="hint" id="' + id + 'V"></div>' +
      '<button class="btn" id="' + id + 'B"' + (disabled ? ' disabled' : '') + '>' + btn + '</button>');
    const resOpts = sel => (m.swap_kinds || RES).map(k => '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + A_ICON[k] + ' ' + L["as_" + k] + '</option>').join("");
    const amt = (q, k) => q + ' ' + A_ICON[k] + ' ' + L["as_" + k];
    const swaps = pager(scopeKey + "swaps", m.swaps.map(s => '<div class="swapcard">' +
      '<div class="row"><span class="k">' + L.sw_youGet + '</span><span class="v status-ok">+' + amt(s.give_qty, s.give_kind) + '</span></div>' +
      '<div class="row"><span class="k">' + L.sw_youGive + '</span><span class="v">−' + amt(s.want_qty, s.want_kind) + '</span></div>' +
      '<button class="mini swapTake" data-id="' + s.id + '">' + fmt(L.sw_takeBtn, { x: amt(s.want_qty, s.want_kind) }) + '</button></div>'),
      3, '<div class="hint">' + L.sw_empty + '</div>', bindMarket);
    const mySwaps = m.my_swaps.length ? pager("myswaps", m.my_swaps.map(s => '<div class="offer"><div class="ol">' +
      fmt(L.sw_mineLine, { g: amt(s.give_qty, s.give_kind), w: amt(s.want_qty, s.want_kind) }) +
      '</div><button class="mini ghost swapCancel" data-id="' + s.id + '">' + L.mk_cancel + '</button></div>'), 3, "", bindMarket) : "";
    box.innerHTML =
      card(L.mk_index, scopeRow +
        (m.scope === "team" ? '<div class="hint status-ok">' + fmt(L.mk_teamHint, { t: esc(m.team.name), f: m.team.fee }) + '</div>' : '') +
        '<div class="idxrow">' + ASSETS.map(x => idxChip(x, m.index[x])).join("") + '</div>' +
        '<div class="balance small">' + icon + ' ' + name + '</div>' +
        '<div class="hint">' + fmt(L.mk_have, { n: num(m.have) }) + ' · 🪙 ' + num(m.balance) + '</div>' +
        '<div class="hint">' + fmt(L.mk_feeLine, { f: m.fee }) + '</div>' +
        (m.shuttle ? '<div class="hint status-ok">' + fmt(L.mk_shuttleNote, { f: m.fee }) + '</div>' : '') +
        '<div class="hint">' + (a === "cutlet" ? fmt(L.mk_floor, { p: m.cutlet_floor }) : fmt(L.mk_floorAny, { p: num(m.min_price), x: icon })) + '</div>') +
      card(L.mk_chart, chartSvg(m.history) + (m.index[a] && m.index[a].last !== null
        ? '<div class="hint">' + fmt(L.mk_avg, { p: m.index[a].week_avg, v: m.index[a].volume }) + '</div>' : '')) +
      card(L.mk_asks, asks) + card(L.mk_bids, bids) +
      form("sell", fmt(L.mk_sellTitleAny, { x: icon + ' ' + name.toUpperCase() }), fmt(L.mk_limitsAny, { q: num(m.max_qty), x: icon, o: m.max_orders }) + '<br>' +
        fmt(L.mk_lots, { o: m.open_orders, m: m.max_orders, h: m.lots.horses, c: m.lots.carts }), L.mk_sell, !m.have,
        L.mk_yourStock + ': <b>' + num(m.have) + ' ' + icon + '</b>') +
      form("bid", fmt(L.mk_bidTitleAny, { x: icon + ' ' + name.toUpperCase() }), L.mk_bidHint, L.mk_bid, false, L.mk_yourCoins + ': <b>' + num(m.balance) + ' 🪙</b>') +
      (mine ? card(L.mk_my, mine) : '') +
      card(L.sw_title, '<div class="hint">' + L.sw_hint + '</div>' +
        '<div class="holding">' + L.mk_yourStock + ':</div>' + stockLine + swaps) +
      card("➕ " + L.sw_create,
        '<div class="holding">' + L.mk_yourStock + ':</div>' + stockLine +
        '<div class="swapform"><label class="lbl">' + L.sw_give + '<select id="swG">' + resOpts("metal") + '</select></label>' +
        '<label class="lbl">' + L.sw_qty + '<input id="swGQ" type="number" inputmode="numeric" min="1" value="10"></label>' +
        '<label class="lbl">' + L.sw_want + '<select id="swW">' + resOpts("hydrogen") + '</select></label>' +
        '<label class="lbl">' + L.sw_qty + '<input id="swWQ" type="number" inputmode="numeric" min="1" value="10"></label></div>' +
        '<button class="btn ghost" id="swB">' + L.sw_create + '</button>' +
        (mySwaps ? '<div class="sub2">' + L.sw_mine + '</div>' + mySwaps : ''));

    document.querySelectorAll(".idx[data-asset]").forEach(b => { b.onclick = () => { mkAsset = b.dataset.asset; go("market"); }; });
    document.querySelectorAll(".idx[data-scope]").forEach(b => { b.onclick = () => { mkScope = b.dataset.scope; go("market"); }; });
    const val = id => Math.max(0, parseInt(document.getElementById(id).value || 0));
    const preview = () => {
      const t1 = val("sellQ") * val("sellP"), fee = Math.floor(t1 * m.fee / 100);
      document.getElementById("sellV").textContent = fmt(L.mk_preview, { t: t1, g: t1 - fee, f: fee });
      const t2 = val("bidQ") * val("bidP"), bv = document.getElementById("bidV");
      bv.textContent = fmt(L.mk_bidPreview, { t: t2 });
      bv.classList.toggle("bad-text", t2 > m.balance);          // сумма заявки больше баланса — красным
      const sv = document.getElementById("sellV");
      sv.classList.toggle("bad-text", val("sellQ") > m.have);   // продаёшь больше, чем есть — красным
    };
    ["sellQ", "sellP", "bidQ", "bidP"].forEach(id => { document.getElementById(id).oninput = preview; });
    preview();
    const place = (side, btnId, msg) => {
      const b = document.getElementById(btnId), pre = side === "sell" ? "sell" : "bid";
      b.onclick = () => (val(pre + "Q") <= 0 || val(pre + "P") <= 0) ? notify(L.sw_qtyErr, false) : act(b, "/api/market/order", { asset: a, side: side, qty: val(pre + "Q"), price: val(pre + "P"), scope: m.scope },
        async () => { notify(msg); await refreshMe(); go("market"); });
    };
    place("sell", "sellB", L.mk_listed);
    place("buy", "bidB", L.mk_listedBid);
    bindMarket(document);
    const sb = document.getElementById("swB");
    sb.onclick = () => (val("swGQ") <= 0 || val("swWQ") <= 0) ? notify(L.sw_qtyErr, false) : act(sb, "/api/swap/create", {
      give_kind: document.getElementById("swG").value, give_qty: val("swGQ"),
      want_kind: document.getElementById("swW").value, want_qty: val("swWQ"), scope: m.scope
    }, async () => { notify(L.sw_created); go("market"); });

    // Кнопки строк лотов: привязываются заново после каждой смены страницы списка
    function bindMarket(root) {
    root.querySelectorAll(".take").forEach(b => {
      b.onclick = () => {
        const q = Number(b.dataset.q), p = Number(b.dataset.p), id = b.dataset.id, isBid = b.dataset.side === "buy";
        const cap = isBid ? Math.min(q, m.have) : q;
        if (cap <= 0) return notify(fmt(L.mk_have, { n: 0 }), false);
        const opts = [1, 5, 10, 50].filter(x => x < cap).map(x => [x, x + " " + icon + " · " + num(x * p) + " 🪙"]);
        opts.push([cap, fmt(L.mk_all, { q: cap }) + " · " + num(cap * p) + " 🪙"]);
        const rowEl = document.getElementById("q" + id);
        rowEl.innerHTML = '<div class="hint">' + (isBid ? L.mk_sellHow : L.mk_buyHow) + '</div>' +
          opts.map(o => '<button class="mini qbtn" data-q="' + o[0] + '">' + o[1] + '</button>').join("");
        rowEl.classList.toggle("hidden");
        rowEl.querySelectorAll(".qbtn").forEach(x => {
          x.onclick = () => act(x, "/api/market/fill", { order_id: Number(id), qty: Number(x.dataset.q) }, async res => {
            notify(res.side === "sell" ? fmt(L.mk_boughtAny, { q: res.qty, x: icon, t: res.total }) : fmt(L.mk_sold, { q: res.qty, g: res.got }));
            await refreshMe(); go("market");
          });
        });
      };
    });
    root.querySelectorAll(".cancel").forEach(b => {
      b.onclick = () => act(b, "/api/market/cancel", { order_id: Number(b.dataset.id) },
        async () => { notify(L.mk_cancelledAny); await refreshMe(); go("market"); });
    });
    root.querySelectorAll(".swapTake").forEach(b => {
      b.onclick = () => act(b, "/api/swap/accept", { swap_id: Number(b.dataset.id) }, async () => { notify(L.sw_done); await refreshMe(); go("market"); });
    });
    root.querySelectorAll(".swapCancel").forEach(b => {
      b.onclick = () => act(b, "/api/swap/cancel", { swap_id: Number(b.dataset.id) }, async () => { notify(L.sw_cancelled); go("market"); });
    });
    }
  }

  // ================= 🏆 Команда и станция =================
  // Карточка команды в рулетке/поиске (публичное: название, девиз, эмблема, места)
  function teamTile(tm) {
    return '<div class="offer"><div class="ol">' + esc(tm.symbol) + ' ' + esc(tm.name) +
      (tm.is_clan ? ' <span class="rank">' + L.clan + '</span>' : '') +
      '<div class="hint">💬 «' + esc(tm.motto) + '» · 👥 ' + tm.members + ' / ' + tm.max + '</div></div>' +
      '<button class="mini tjoin" data-id="' + tm.id + '" data-name="' + esc(tm.name) + '">' + L.tm_join + '</button></div>';
  }
  function bindTeamJoin(root) {
    root.querySelectorAll(".tjoin").forEach(b => {
      b.onclick = () => act(b, "/api/team/join", { team_id: Number(b.dataset.id) }, async () => {
        notify(fmt(L.tm_joined, { n: b.dataset.name })); await refreshMe(); go("team");
      });
    });
  }
  // Без команды — тот же хаб, что в чате: рулетка свободных команд, поиск, создание
  function teamHub(box, d) {
    const lim = d.limits;
    box.innerHTML =
      card(L.tm_roulette, '<div class="hint">' + L.noTeam + '</div>' +
        '<div id="tmRoulette">' + pager("tmroul", d.teams.map(teamTile), 6, '<div class="hint">' + L.tm_noFree + '</div>', bindTeamJoin) + '</div>' +
        '<button class="btn ghost" id="tmRotate">' + L.tm_rotate + '</button>') +
      card(L.tm_search,
        '<label class="lbl">' + L.tm_searchPh + '<input id="tmQ" type="text" maxlength="' + lim.name + '"></label>' +
        '<button class="btn ghost" id="tmFind">' + L.tm_searchBtn + '</button><div id="tmFound"></div>') +
      card(L.tm_create, '<div class="hint">' + fmt(L.tm_hubHint, { cost: num(d.cost) }) + '</div>' +
        '<label class="lbl">' + fmt(L.tm_name, { n: lim.name }) + '<input id="tmN" type="text" maxlength="' + lim.name + '"></label>' +
        '<label class="lbl">' + fmt(L.tm_motto, { n: lim.motto }) + '<input id="tmM" type="text" maxlength="' + lim.motto + '"></label>' +
        '<label class="lbl">' + fmt(L.tm_symbol, { n: lim.symbol }) + '<input id="tmS" type="text" maxlength="' + lim.symbol + '" placeholder="🔥"></label>' +
        (d.balance < d.cost ? '<div class="hint">' + fmt(L.tm_noMoney, { cost: num(d.cost), b: num(d.balance) }) + '</div>' : '') +
        '<button class="btn" id="tmCreate"' + (d.balance < d.cost ? ' disabled' : '') + '>' + fmt(L.tm_createBtn, { cost: num(d.cost) }) + '</button>');
    bindTeamJoin(box);
    const rot = document.getElementById("tmRotate");
    rot.onclick = async () => {
      rot.disabled = true;
      try {
        const r = await api("/api/teams");
        PAGERS.tmroul = null;
        const holder = document.getElementById("tmRoulette");
        holder.innerHTML = pager("tmroul", r.teams.map(teamTile), 6, '<div class="hint">' + L.tm_noFree + '</div>', bindTeamJoin);
        bindPagers(holder); bindTeamJoin(holder);
      } catch (e) { apiError(e); }
      rot.disabled = false;
    };
    const find = document.getElementById("tmFind"), q = document.getElementById("tmQ");
    const search = async () => {
      if (!q.value.trim()) return;
      find.disabled = true;
      try {
        const r = await api("/api/teams?q=" + encodeURIComponent(q.value.trim()));
        PAGERS.tmfound = null;
        const out = document.getElementById("tmFound");
        out.innerHTML = pager("tmfound", r.teams.map(teamTile), 5, '<div class="hint">' + L.tm_notFound + '</div>', bindTeamJoin);
        bindPagers(out); bindTeamJoin(out);
      } catch (e) { apiError(e); }
      find.disabled = false;
    };
    find.onclick = search;
    q.onkeydown = e => { if (e.key === "Enter") search(); };
    const cb = document.getElementById("tmCreate");
    cb.onclick = () => act(cb, "/api/team/create", {
      name: document.getElementById("tmN").value, motto: document.getElementById("tmM").value,
      symbol: document.getElementById("tmS").value
    }, async () => { notify(fmt(L.tm_created, { n: document.getElementById("tmN").value.trim() })); await refreshMe(); go("team"); });
  }
  function askConfirm(text, then) {
    if (tg && tg.showConfirm) tg.showConfirm(text, ok => { if (ok) then(); });
    else if (window.confirm(text)) then();
  }
  async function viewTeam(box) {
    const d = await api("/api/team");
    if (!d.team) return teamHub(box, d);
    const tm = d.team, st = d.station;
    let teamHtml = row(tm.is_clan ? "👑 " + L.clan : L.teamLabel, esc(tm.symbol) + ' ' + esc(tm.name)) +
      row(L.tm_mottoL, '«' + esc(tm.motto) + '»') +
      row(L.members, tm.members + " / " + tm.max) + (tm.captain ? '<div class="hint">' + L.captain + '</div>' : '') +
      '<button class="btn ghost danger-text" id="tmLeave">' + L.tm_leave + '</button>';
    const roster = pager("tmroster", tm.roster.map(m =>
      '<div class="top-row' + (m.me ? ' me' : '') + '"><span class="brain">🧠' + m.level + '</span>' +
      '<span class="nm">' + (m.captain ? '👑 ' : '') + esc(m.name) + (m.rank ? ' <span class="rank">' + esc(m.rank) + '</span>' : '') +
      '</span></div>'), 10, "");
    let stHtml;
    if (!st.enabled) stHtml = '<div class="hint">' + L.st_off + '</div>';
    else {
      const head = '<div class="balance small">' + fmt(L.st_level, { l: st.level, m: st.max }) + '</div>' +
        '<div class="hint status-ok">' + fmt(L.st_bonus, { p: st.percent }) + '</div>';
      let progress = '';
      if (st.level >= st.max) progress = '<div class="hint">' + L.st_max + '</div>';
      else {
        progress = '<div class="hint">' + fmt(L.st_next, { n: st.level + 1, c: st.cost }) + '</div>' + RES.map(k => {
          const have = st.stored[k] || 0, pct = Math.min(100, Math.round(have / st.cost * 100));
          const mineQty = d.stock[k] || 0, need = st.need[k] || 0;
          const btns = need > 0 && mineQty > 0
            ? [10, 50].filter(x => x <= mineQty && x <= need).map(x => '<button class="mini don" data-k="' + k + '" data-q="' + x + '">+' + x + '</button>').join("") +
              '<button class="mini ghost don" data-k="' + k + '" data-q="' + Math.min(mineQty, need) + '">' + L.st_all + ' ' + Math.min(mineQty, need) + '</button>'
            : '';
          return '<div class="stres"><div class="row"><span class="k">' + RES_ICON[k] + ' ' + esc(d.res_names[k]) +
            '</span><span class="v">' + have + '/' + st.cost + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div>' +
            '<div class="donrow">' + btns + '</div></div>';
        }).join("");
      }
      const feed = d.feed.map(x => '<div class="hint">• ' + esc(x.name) + ' +' + x.qty + ' ' + RES_ICON[x.kind] + '</div>').join("") ||
        '<div class="hint">' + L.st_feedEmpty + '</div>';
      stHtml = head + progress + '<div class="hint">' + L.st_hint + '</div><div class="sub2">' + L.st_feed + '</div>' + feed;
    }
    const H = d.help, MK = d.market;
    const helpRows = pager("tmhelp", H.requests.map(h => {
      const pct = Math.round(h.filled / h.qty * 100);
      // Больше остатка просьбы, суточного лимита и своего запаса кнопка не предлагает
      const left = Math.min(h.qty - h.filled, H.daily - H.given_today, d.stock[h.kind] || 0);
      const btns = h.mine ? '<button class="mini ghost hpCancel" data-id="' + h.id + '">' + L.mk_cancel + '</button>'
        : (left <= 0 || !H.can_give) ? '' : [10, 50].filter(x => x < left).map(x => '<button class="mini hpGive" data-id="' + h.id + '" data-q="' + x + '">' + fmt(L.hp_give, { n: x }) + '</button>').join("") +
          '<button class="mini hpGive" data-id="' + h.id + '" data-q="' + left + '">' + fmt(L.hp_give, { n: left }) + '</button>';
      return '<div class="stres"><div class="row"><span class="k">' + (h.mine ? '⭐ ' : '') + esc(h.name) + ' · ' + RES_ICON[h.kind] +
        '</span><span class="v">' + h.filled + ' / ' + h.qty + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="donrow">' + btns + '</div></div>';
    }), 4, '<div class="hint">' + L.hp_empty + '</div>', bindHelp);
    const hasOwn = H.requests.some(h => h.mine);
    const helpForm = hasOwn ? '' : '<div class="swapform"><label class="lbl">' + L.hp_kind + '<select id="hpK">' +
      RES.map(k => '<option value="' + k + '">' + RES_ICON[k] + ' ' + L["as_" + k] + '</option>').join("") + '</select></label>' +
      '<label class="lbl">' + fmt(L.hp_qty, { n: H.max_qty }) + '<input id="hpQ" type="number" inputmode="numeric" min="1" max="' + H.max_qty + '" value="50"></label></div>' +
      '<button class="btn ghost" id="hpAsk">' + L.hp_ask + '</button>';
    box.innerHTML = card(L.team, teamHtml) + card(L.tm_roster, roster) +
      card(L.tm_market, '<div class="hint">' + fmt(L.tm_marketHint, { f: MK.fee, p: MK.public_fee, c: MK.clan_fee }) + '</div>' +
        '<button class="btn" id="tmMarket">' + L.tm_marketBtn + '</button>') +
      card(L.hp_title, '<div class="hint">' + fmt(L.hp_hint, { d: H.daily }) + '</div>' +
        '<div class="hint' + (H.can_give ? '' : ' status-bad') + '">' + fmt(L.hp_who, { l: H.giver_level, c: H.giver_claims }) + '</div>' +
        '<div class="holding">' + fmt(L.hp_today, { g: H.given_today, d: H.daily }) + '</div>' + helpRows + helpForm) +
      card(L.st_title, stHtml);
    document.getElementById("tmMarket").onclick = () => { mkScope = "team"; go("market"); };
    bindHelp(box);
    const ask = document.getElementById("hpAsk");
    if (ask) ask.onclick = () => act(ask, "/api/team/help", {
      kind: document.getElementById("hpK").value, qty: Number(document.getElementById("hpQ").value || 0)
    }, async () => { notify(L.hp_asked); go("team"); });
    function bindHelp(root) {
      root.querySelectorAll(".hpGive").forEach(b => {
        b.onclick = () => act(b, "/api/team/help/give", { help_id: Number(b.dataset.id), qty: Number(b.dataset.q) },
          async r => { notify(fmt(L.hp_given, { q: r.qty, k: RES_ICON[r.kind] })); await refreshMe(); go("team"); });
      });
      root.querySelectorAll(".hpCancel").forEach(b => {
        b.onclick = () => act(b, "/api/team/help/cancel", { help_id: Number(b.dataset.id) }, async () => go("team"));
      });
    }
    const lb = document.getElementById("tmLeave");
    lb.onclick = () => askConfirm(fmt(tm.captain ? L.tm_leaveAskCaptain : L.tm_leaveAsk, { n: tm.name }),
      () => act(lb, "/api/team/leave", {}, async () => { notify(L.tm_left); await refreshMe(); go("team"); }));
    document.querySelectorAll(".don").forEach(b => {
      b.onclick = () => act(b, "/api/station/donate", { kind: b.dataset.k, qty: Number(b.dataset.q) },
        async () => { notify(L.st_done); await refreshMe(); go("team"); });
    });
  }

    const d = await api("/api/referral");

      '<div class="top-row' + (p.me ? ' me' : '') + '"><span class="place">' + (["🥇", "🥈", "🥉"][i] || (i + 1) + ".") + '</span>' +

    box.innerHTML =
      card(L.ref_title,
        '<div class="hint">' + fmt(L.ref_rules, { q: R.reward, l: R.level, c: R.claims }) + '</div>' +
        (d.link ? '<div class="reflink" id="refLink">' + esc(d.link) + '</div>' +

          '<button class="btn" id="refShare">' + L.ref_share + '</button></div>' : '')) +
      card(L.ref_stats,
        '<div class="res-grid three">' +
        '<div class="res"><div class="ri">👥</div><div class="rn">' + d.invited + '</div><div class="rs">' + L.ref_invited + '</div></div>' +
        '<div class="res"><div class="ri">✅</div><div class="rn">' + d.qualified + '</div><div class="rs">' + L.ref_qualified + '</div></div>' +
        '<div class="res"><div class="ri">🪙</div><div class="rn">' + num(d.earned) + '</div><div class="rs">' + L.ref_earned + '</div></div>' +
        '</div>') +
      card(L.ref_top, (d.season ? '<div class="balance small">' + fmt(L.top_seasonTitle, { s: d.season }) + ' · ' +
        fmt(L.top_left, { t: dur(Math.max(0, (new Date(d.ends_at).getTime() - Date.now()) / 1000)) }) + '</div>' : '') +
        '<div class="hint">' + L.ref_topHint + '</div>' + top);
    const copy = document.getElementById("refCopy");
    if (copy) copy.onclick = async () => {
      try { await navigator.clipboard.writeText(d.link); notify(L.ref_copied); }
      catch (e) {
        const r = document.createRange(); r.selectNodeContents(document.getElementById("refLink"));
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        try { document.execCommand("copy"); notify(L.ref_copied); } catch (e2) { notify(d.link); }
      }
    };
    const share = document.getElementById("refShare");
    if (share) share.onclick = () => {
      const url = "https://t.me/share/url?url=" + encodeURIComponent(d.link) + "&text=" + encodeURIComponent(d.share_text);
      if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
    };
  }

  // ================= 🏪 Магазин =================
  // Компьютер: «Для фермы» | «Игровые» | «Что даёт каждый товар» в три колонки;
  // планшет: две колонки товаров, описание — под ними во всю ширину; телефон — одной лентой.
  async function viewShop(box) {
    const shop = await api("/api/shop");
    const btn = item => '<button class="shop-item" data-sku="' + esc(item.sku) + '">' + esc(item.label) + '</button>';
    const info = (shop.info || []).map(i => '<div class="info-item"><b>' + esc(i.title) + '</b><span>' + esc(i.text) + '</span></div>');
    box.innerHTML =
      card(L.shopFarm, '<div class="hint">' + L.shopHint + '</div>' + shop.farm.map(btn).join("")) +
      card(L.shopGames, '<div class="hint">' + L.shopHint + '</div>' + shop.games.map(btn).join("")) +
      '<div class="card span-tablet"><h2>' + L.shop_info + '</h2>' + pager("shopinfo", info, 4, "") +
      '<button class="btn ghost" id="shopInfo">FAQ ↗</button></div>';
    document.querySelectorAll(".shop-item").forEach(b => { b.onclick = () => buy(b.dataset.sku, b); });
    document.getElementById("shopInfo").onclick = () => { docSection = "shop-items"; infoDoc = "faq"; go("info"); };
  }
  async function buy(sku, btn) {
    if (!tg || !tg.openInvoice) return notify(L.oldClient, false);
    btn.disabled = true;
    try {
      const res = await post("/api/invoice", { sku: sku });
      tg.openInvoice(res.link, function (status) {
        btn.disabled = false;
        if (status === "paid") { notify(L.paid); setTimeout(async () => { await refreshMe(); }, 1500); }
        else if (status === "failed") notify(L.payFail, false);
      });
    } catch (e) {
      btn.disabled = false;
      notify((e.body && e.body.error && e.status === 400) ? e.body.error : L.payFail, false);
    }
  }

  // ================= 👑 ТОП-100 =================
  let topMode = "season";
  // 🎯 Акции и битвы: зачёт, сроки, призы по местам, моё место, лидеры (данные — /api/events)
  async function viewEvents(box, sw) {
    const d = await api("/api/events");
    const cards = d.events.map(ev => {
      const ends = ev.started ? fmt(L.mn_ends, { d: dateShort(ev.ends_at) }) : fmt(L.mn_soonShort, { d: dateShort(ev.starts_at) });
      const prizes = ev.prizes.length ? '<div class="sub2">' + L.ev_prizes + '</div>' + ev.prizes.map(p =>
        '<div class="row"><span class="k">' + (["🥇", "🥈", "🥉"][p.place - 1] || p.place + ".") + '</span><span class="v">' + esc(p.label) + '</span></div>').join("") : '';
      const forAll = ev.reward_all ? '<div class="hint">' + fmt(L.map_rewardAll, { r: esc(ev.reward_all) }) + '</div>' : '';
      const mines = ev.mines.length ? '<div class="hint">⛏ ' + ev.mines.map((m, i) => (["🥇", "🥈", "🥉"][i] || (i + 1) + ".") + ' №' + m).join(" · ") + '</div>' : '';
      const leaders = ev.manual ? '<div class="hint">' + L.ev_manual + '</div>'
        : ev.leaders.length ? '<div class="sub2">' + L.ev_leaders + '</div>' + ev.leaders.map((x, i) => '<div class="lead-row' + (x.me ? ' me' : '') + '"><b>' +
            (["🥇", "🥈", "🥉"][i] || (i + 1) + ".") + ' ' + esc(x.name) + '</b><span>' + num(x.score) + '</span></div>').join("") : '';
      const mine = ev.manual ? '' : '<div class="hint ' + (ev.my_place ? 'status-ok' : '') + '">' + (ev.my_place ? fmt(L.ev_my, { p: ev.my_place }) : L.ev_noPlace) + '</div>';
      return '<div class="card ' + (ev.my_place ? 'lava' : '') + '"><h2>⚔️ ' + esc(ev.title) + '</h2>' +
        '<div class="hint">' + esc(ev.scope) + ' · ' + esc(ev.nomination) + '</div><div class="hint">' + ends + '</div>' +
        '<div class="hint">' + fmt(L.ev_places, { n: ev.places }) + '</div>' + mine + prizes + forAll + mines + leaders +
        (ev.entry && ev.entry.allowed && !ev.entry.registered ? '<button class="btn ghost" data-go="mines">' + fmt(L.bt_entry, { n: ev.entry.batteries, m: ev.entry.fee }) + '</button>' : '') + '</div>';
    }).join("");
    box.innerHTML = sw + (cards || card(L.top_events, '<div class="hint">' + L.ev_empty + '</div>'));
    box.querySelectorAll("[data-top]").forEach(b => { b.onclick = () => { topMode = b.dataset.top; go("top"); }; });
    box.querySelectorAll("[data-go]").forEach(b => { b.onclick = () => go(b.dataset.go); });
  }
  async function viewTop(box) {
    const sw = '<div class="span-all doc-switch">' + ["season", "events", "rich"].map(x =>
      '<button class="idx' + (topMode === x ? ' on' : '') + '" data-top="' + x + '">' + L["top_" + x] + '</button>').join("") + '</div>';
    if (topMode === "events") return viewEvents(box, sw);
    const top = await api("/api/top" + (topMode === "rich" ? "?mode=rich" : ""));
    if (top.mode === "season") {
      const left = Math.max(0, (new Date(top.ends_at).getTime() - Date.now()) / 1000);
      const players = pager("stop", top.top.map((p, i) =>
        '<div class="top-row' + (p.me ? ' me' : '') + '"><span class="place">' + (["🥇", "🥈", "🥉"][i] || (i + 1) + ".") + '</span>' +
        '<span class="nm">' + esc(p.name) + (p.rank ? ' <span class="rank">' + esc(p.rank) + '</span>' : '') + '</span>' +
        '<span class="brain">🧠' + p.quiz_level + '</span><span class="bal">' + num(p.earned) + '</span></div>'), 10, '<div class="hint">' + L.top_empty + '</div>');
      const teams = top.teams.length ? top.teams.map((x, i) => '<div class="lead-row"><b>' + (["🥇", "🥈", "🥉"][i] || (i + 1) + ".") + ' ' + esc(x.name) +
        '</b><span>' + x.points + '</span></div>').join("") : '<div class="hint">' + L.top_noTeams + '</div>';
      box.innerHTML = sw + card(fmt(L.top_seasonTitle, { s: top.season }),
        '<div class="balance small">' + fmt(L.top_left, { t: dur(left) }) + '</div>' +
        '<div class="hint">' + (top.me.place ? fmt(L.top_myPlace, { p: top.me.place, n: top.me.total, e: num(top.me.earned) }) : L.top_noPlace) + '</div>' +
        '<div class="hint">🎁 ' + L.top_prizes + '</div><div class="hint">' + L.top_rules + '</div>') +
        card(L.top_players, players) + card(L.top_teams, teams + '<div class="hint">' + L.top_teamRules + '</div>');
    } else {
      box.innerHTML = sw + card(L.top, pager("top", top.top.map((p, i) =>
        '<div class="top-row"><span class="place">' + (["🥇", "🥈", "🥉"][i] || (i + 1) + ".") + '</span>' +
        '<span class="nm">' + esc(p.name) + (p.vip ? ' <span class="vip">💎</span>' : '') +
        (p.rank ? ' <span class="rank">' + esc(p.rank) + '</span>' : '') + '</span>' +
        '<span class="brain">🧠' + p.quiz_level + '</span>' +
        '<span class="bal">' + num(p.balance) + '</span></div>'), 10, '<div class="hint">—</div>'));
    }
    box.querySelectorAll("[data-top]").forEach(b => { b.onclick = () => { topMode = b.dataset.top; go("top"); }; });
  }

  // ================= 🔬 Лаборатория: инструменты и технологии =================
  const TECH_ICON = { comm: "📡", scout: "🔭", attack: "⚔️", defense: "🛡", science: "📚" };
  async function viewLab(box) {
    const d = await api("/api/tech");
    const T = d.tools;
    const toolsRow = [1, 2, 3, 4].map(l => '<span class="chip ' + (T.level >= l ? 'have' : 'lack') + '">' + TOOL_ICON[l] + ' ' + L["tool_" + l] + '</span>').join("");
    const toolsCard = '<div class="card ' + (T.level ? 'lava' : '') + '"><h2>' + L.lab_tools + '</h2><div class="chips">' + toolsRow + '</div>' +
      '<div class="hint">' + L.lab_toolsHint + '</div>' +
      (T.next ? '<div class="sub2">' + fmt(L.lab_nextTool, { t: TOOL_ICON[T.next] + ' ' + L["tool_" + T.next] }) + '</div><div class="chips">' + costChips(T.cost, d.stock) + '</div>' +
        '<button class="btn" data-tech="tools"' + (T.affordable ? '' : ' disabled') + '>' + L.lab_craftTool + '</button>'
        : '<div class="hint status-ok">' + L.lab_toolsMax + '</div>') + '</div>';
    const E = d.effects;
    const techCards = d.techs.map(x => {
      const eff = fmt(L["lab_eff_" + x.key], { a: E.attack, d: E.defense, s: E.science, c: E.comm });
      let body = '<div class="balance small">' + fmt(L.lab_level, { l: x.level, m: x.max }) + '</div><div class="hint">' + eff + '</div>';
      if (!x.next) body += '<div class="hint status-ok">' + L.lab_max + '</div>';
      else {
        body += '<div class="chips">' + costChips(x.cost, d.stock) + '</div>' +
          '<div class="hint' + (x.tool_ok ? '' : ' status-bad') + '">' + fmt(L.ws_needTool, { t: TOOL_ICON[x.tool] + ' ' + L["tool_" + x.tool] }) + '</div>' +
          (x.wait ? '<div class="lockline">' + fmt(L.lab_wait, { t: dur(x.wait) }) + '</div>' : '') +
          '<button class="btn ghost" data-tech="' + x.key + '"' + (x.affordable ? '' : ' disabled') + '>' + fmt(L.lab_up, { l: x.next }) + '</button>' +
          (x.gate_ok === false ? '<div class="hint status-bad">' + fmt(L.lab_sciGate, { l: x.next }) + '</div>' : '') +
          '<div class="hint">' + fmt(L.lab_cooldown, { d: x.cooldown_days }) + '</div>';
      }
      return '<div class="card ' + (x.level ? '' : 'dim') + '"><h2>' + x.icon + ' ' + L["tech_" + x.key] + '</h2>' + body + '</div>';
    }).join("");
    box.innerHTML = toolsCard + techCards + card(L.lab_how, '<ol class="rules"><li>' + L.lab_rule1 + '</li><li>' + L.lab_rule2 + '</li><li>' + L.lab_rule3 + '</li></ol>');
    box.querySelectorAll("[data-tech]").forEach(b => {
      b.onclick = () => act(b, "/api/tech/up", { tech: b.dataset.tech }, async res => {
        notify(fmt(L.lab_done, { l: res.level })); await refreshMe(); go("lab");
      });
    });
  }

  // FAQ и соглашение — те же страницы, что открываются из чата, но внутри приложения (вкладки остаются сверху)
  let docSection = "";   // раздел FAQ, который раскрыть (например, «Что даёт каждый товар» из магазина)
  const viewDoc = path => box => {
    const src = path + (docSection ? "?s=" + encodeURIComponent(docSection) : "");
    docSection = "";
    box.innerHTML = '<iframe class="doc" src="' + src + '" title="' + path.slice(1) + '"></iframe>';
  };
  // 📚 Инфо: FAQ и соглашение в одной вкладке, переключатель сверху
  let infoDoc = "faq";
  function viewInfo(box) {
    box.innerHTML = '<div class="span-all"><div class="doc-switch">' +
      ['faq', 'rules'].map(d => '<button class="idx' + (infoDoc === d ? ' on' : '') + '" data-doc="' + d + '">' + L["tab_" + d] + '</button>').join("") +
      '</div><div id="docBox"></div></div>';
    viewDoc("/" + infoDoc)(document.getElementById("docBox"));
    box.querySelectorAll("[data-doc]").forEach(b => { b.onclick = () => { infoDoc = b.dataset.doc; go("info"); }; });
  }
  // ================= 🗺 Карта мира: цели экспедиций, отряды в пути, развилки =================
  // Маркеры отрядов ползут к цели пропорционально пройденному времени (очень медленно — как в жизни);
  // цели ставит владелец в пульте, у каждой свой час итогов.
  let mapTimer = null, mapPick = null;
  const MODE_ICON = { solo: "👤", team: "🏆", clan: "👑" };
  function mapPos(s, t, nowMs) {
    if (s.status !== "marching" || !s.departed_at) return [s.ox, s.oy];
    const a = Date.parse(s.departed_at), b = Date.parse(s.arrive_at);
    const k = b > a ? Math.max(0, Math.min(1, (nowMs - a) / (b - a))) : 1;
    return [s.ox + (t.x - s.ox) * k, s.oy + (t.y - s.oy) * k];
  }
  function mapSvg(d) {
    const W = d.map.w, H = d.map.h, T = {};
    d.targets.forEach(t => { T[t.id] = t; });
    let g = '<svg class="world" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      '<defs><radialGradient id="wg" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#14304a"/><stop offset="1" stop-color="#070b16"/></radialGradient></defs>' +
      '<rect width="' + W + '" height="' + H + '" rx="4" fill="url(#wg)"/>';
    for (let x = 10; x < W; x += 10) g += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + H + '" class="wgrid"/>';
    for (let y = 10; y < H; y += 10) g += '<line x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '" class="wgrid"/>';
    // Материки — декорация (одинаковые у всех игроков)
    [[38, 30, 22, 13], [112, 26, 26, 12], [70, 68, 30, 14], [132, 74, 16, 11], [22, 76, 13, 9]].forEach(([cx, cy, rx, ry]) => {
      g += '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" class="wland"/>';
    });
    d.squads.forEach(s => {
      const t = T[s.target_id];
      if (!t || s.status !== "marching") return;
      g += '<line x1="' + s.ox + '" y1="' + s.oy + '" x2="' + t.x + '" y2="' + t.y + '" class="wpath' + (s.mine ? ' mine' : '') + '"/>';
    });
    const home = d.me.home || {};
    [["solo", home.solo], ["team", home.team]].forEach(([k, p]) => {
      if (p) g += '<text x="' + p[0] + '" y="' + p[1] + '" class="whome">' + (k === "solo" ? "🏠" : "🏯") + '</text>';
    });
    d.targets.forEach(t => {
      g += '<g class="wtgt' + (mapPick === t.id ? ' on' : '') + '" data-t="' + t.id + '"><circle cx="' + t.x + '" cy="' + t.y + '" r="6" class="wglow"/>' +
        '<circle cx="' + t.x + '" cy="' + t.y + '" r="3.6" class="wcore"/><text x="' + t.x + '" y="' + (t.y + 1.4) + '" class="wicon">' + esc(t.icon) + '</text>' +
        '<text x="' + t.x + '" y="' + (t.y - 6.5) + '" class="wlabel">' + esc(t.title.length > 22 ? t.title.slice(0, 21) + "…" : t.title) + '</text>' +
        '<text x="' + t.x + '" y="' + (t.y + 9) + '" class="wtime" data-resolve="' + t.resolve_at + '"></text></g>';
    });
    d.squads.forEach(s => {
      if (!T[s.target_id]) return;
      const label = s.mine ? L.map_you : (s.symbol || "") + (s.name ? " " + s.name.slice(0, 10) : "");
      g += '<g class="wsq ' + s.mode + (s.mine ? ' mine' : '') + (s.status === "gathering" ? ' wait' : '') + '" data-sq="' + s.id + '">' +
        '<circle r="' + (s.mode === "solo" ? 1.3 : s.mode === "clan" ? 2.3 : 1.8) + '"/>' +
        (label.trim() ? '<text y="-2.6">' + esc(label.trim()) + '</text>' : '') + '</g>';
    });
    return g + '</svg>';
  }
  function placeSquads(d) {
    const T = {}, now = Date.now();
    d.targets.forEach(t => { T[t.id] = t; });
    d.squads.forEach(s => {
      const el = document.querySelector('[data-sq="' + s.id + '"]');
      if (!el || !T[s.target_id]) return;
      const p = mapPos(s, T[s.target_id], now);
      el.setAttribute("transform", "translate(" + p[0].toFixed(2) + " " + p[1].toFixed(2) + ")");
    });
    document.querySelectorAll("[data-resolve]").forEach(el => {
      const left = (Date.parse(el.dataset.resolve) - now) / 1000;
      el.textContent = left > 0 ? "⏳ " + dur(left) : "🏁";
    });
    document.querySelectorAll("[data-countdown]").forEach(el => {
      const left = (Date.parse(el.dataset.countdown) - now) / 1000;
      el.textContent = fmt(L[el.dataset.key], { t: dur(Math.max(60, left)) });
    });
  }
  function gearButtons(t, exp, mode) {
    const need = exp ? exp.need : { battery: (window.__mapRules || {}).batteries[mode], cutlet: mode === "clan" ? (window.__mapRules || {}).clan_cutlets : 0 };
    const a = exp ? exp.batteries : 0, c = exp ? exp.cutlets : 0;
    let h = '<button class="btn ghost expGear" data-t="' + t.id + '" data-w="battery"' + (a >= need.battery ? ' disabled' : '') + '>' +
      fmt(L.map_gearBattery, { a: a, b: need.battery }) + '</button>';
    if (need.cutlet) h += '<button class="btn ghost expGear" data-t="' + t.id + '" data-w="cutlet"' + (c >= need.cutlet ? ' disabled' : '') + '>' +
      fmt(L.map_gearCutlet, { a: c, b: need.cutlet }) + '</button>';
    return h + '<div class="hint">' + L.map_gearHint + '</div>';
  }
  function targetCard(t, d) {
    const mine = d.my.filter(e => e.target_id === t.id);
    const opts = t.options.map(o => row(L["map_mode_" + o.mode] + ' · ' + L.map_path, dur(o.minutes * 60) + ' · ' +
      (o.ok ? '<span class="status-ok">✓ ' + L.map_ok + '</span>' : '<span class="status-bad">✗ ' + L.map_no + '</span>'))).join("");
    const prizes = t.prizes.length ? '<div class="sub2">' + L.map_prizes + '</div>' + t.prizes.map(p =>
      '<div class="row"><span class="k">' + (["🥇", "🥈", "🥉"][p.place - 1] || p.place + ".") + '</span><span class="v">' + esc(p.label) + '</span></div>').join("") : '';
    let actions = "";
    const solo = t.options.find(o => o.mode === "solo"), team = t.options.find(o => o.mode !== "solo");
    if (solo && !mine.some(e => e.mode === "solo"))
      actions += '<button class="btn expSolo" data-t="' + t.id + '"' + (solo.ok && d.me.hydrogen >= d.rules.solo_h2 ? '' : ' disabled') + '>' +
        fmt(L.map_goSolo, { n: d.rules.solo_h2 }) + '</button>';
    const teamExp = mine.find(e => e.mode !== "solo");
    if (team && (!teamExp || teamExp.status === "gathering") && team.ok) actions += gearButtons(t, teamExp, team.mode);
    if (!t.options.length) actions += '<div class="hint">' + (["team", "clan", "teams"].includes(t.scope) && !d.me.in_team ? L.map_needTeam : L.map_notYours) + '</div>';
    if (mine.length) actions += '<div class="hint status-ok">' + L.map_my + '</div>';
    return '<div class="card exp-target' + (mapPick === t.id ? ' picked' : '') + '" id="tg' + t.id + '"><h2>' + esc(t.icon) + ' ' + esc(t.title) + '</h2>' +
      (t.descr ? '<div class="hint">' + esc(t.descr) + '</div>' : '') +
      row(t.scope_label, '<span data-key="map_resolve" data-countdown="' + t.resolve_at + '"></span>') +
      row(fmt(L.map_squads, { n: t.squads }), fmt(L.map_forks, { n: t.forks })) + opts + prizes +
      (t.reward_all ? '<div class="hint">' + fmt(L.map_rewardAll, { r: esc(t.reward_all) }) + '</div>' : '') + actions + '</div>';
  }
  function hintChips(h) {
    if (!h) return "";
    const sign = n => (n > 0 ? "+" : "") + n;
    return '<span class="chips">' + (h.cargo ? '<span class="chip">📦 ' + sign(h.cargo) + '</span>' : '') +
      (h.loss ? '<span class="chip lack">−' + h.loss + '%</span>' : '') +
      (h.delay ? '<span class="chip ' + (h.delay < 0 ? 'have' : '') + '">⏱ ' + sign(h.delay) + '′</span>' : '') +
      (h.fight ? '<span class="chip">⚔️ ' + L.map_fight + '</span>' : '') + '</span>';
  }
  // 🔎 Разведка развилки: min(🛰 шпионов, 🔭 разведки) лидера отряда; первая экспедиция сезона — вслепую
  function peekBlock(e, f) {
    const P = e.peeks || {};
    if (f.peeked) return '<div class="hint status-ok">' + L.map_peeked + '</div>';
    if (P.left > 0) return '<button class="btn ghost expPeek" data-e="' + e.id + '">' + fmt(L.map_peek, { n: P.left }) + '</button>';
    return '<div class="hint">' + (P.blind ? L.map_peekBlind + ' ' : '') + L.map_noHint + '</div>';
  }
  function mySquadCard(e, d) {
    const t = d.targets.find(x => x.id === e.target_id);
    if (!t) return "";
    let body = '<div class="hint">' + esc(t.icon) + ' ' + esc(t.title) + ' · ' + L["map_mode_" + e.mode] + '</div>';
    if (e.status === "gathering") {
      body += '<div class="sub2">' + L.map_gathering + '</div>' + gearButtons(t, e, e.mode);
    } else {
      const a = Date.parse(e.departed_at), b = Date.parse(e.arrive_at);
      const pct = Math.round(Math.max(0, Math.min(1, (Date.now() - a) / Math.max(1, b - a))) * 100);
      body += (e.arrived ? '<div class="sub2 status-ok">' + L.map_arrived + '</div>'
        : '<div class="sub2" data-key="map_marching" data-countdown="' + e.arrive_at + '"></div>') +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        (e.late ? '<div class="hint status-bad">' + L.map_late + '</div>' : '') +
        row(L.map_cargo, '<b>' + e.cargo + '</b>') + '<div class="hint">' + L.map_cargoHint + '</div>' +
        (e.effects.cargo || e.effects.guard || e.effects.speed ? '<div class="hint">' + fmt(L.map_effects, { a: e.effects.cargo, g: e.effects.guard, s: e.effects.speed }) + '</div>' : '');
      if (e.fork) {
        // Ближайшая развилка видна сразу: до неё — таймер и выбор заранее; у развилки — время на решение
        const f = e.fork, voted = f.options.reduce((a, o) => a + o.votes, 0);
        body += '<div class="fork"><div class="sub2">' + fmt(L.map_fork, { k: f.no, n: f.of }) + '</div>' +
          '<div class="fork-timer" data-key="' + (f.reached ? 'map_forkNow' : 'map_forkAhead') + '" data-countdown="' + (f.reached ? f.closes_at : f.opens_at) + '"></div>' +
          '<div class="fork-text">' + f.icon + ' ' + esc(f.text) + '</div>' +
          f.options.map(o => '<button class="btn ghost expVote' + (o.mine ? ' voted' : '') + '" data-e="' + e.id + '" data-o="' + o.i + '">' +
            esc(o.text) + (e.mode === "solo" ? '' : ' · ' + fmt(L.map_votes, { n: o.votes })) +
            (o.mine ? ' · ✓ ' + (e.mode === "solo" ? L.map_myChoice : L.map_myVote) : '') + hintChips(o.hint) + '</button>').join("") +
          '<div class="hint">' + (e.mode === "solo" ? L.map_voteSolo : fmt(L.map_voteTeam, { a: voted, b: e.members || 1 })) + '</div>' +
          peekBlock(e, f) + '</div>';
      } else if (!e.arrived && e.forks_done < e.forks) {
        body += '<div class="hint">' + L.map_waitFork + '</div>';
      }
    }
    if (e.log.length) body += '<div class="sub2">' + L.map_log + '</div>' + e.log.map(l => {
      const sign = n => (n > 0 ? "+" : "") + n;
      return '<div class="row"><span class="k">' + l.icon + ' ' + esc(l.choice) + '</span><span class="v">📦 ' + sign(l.cargo) + (l.delay ? ' · ⏱ ' + sign(l.delay) + '′' : '') + '</span></div>';
    }).join("");
    return '<div class="card hot">' + '<h2>' + L.map_my + '</h2>' + body + '</div>';
  }
